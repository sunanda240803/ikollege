<th:block th:fragment="content(id, url, title)">
	<div class="card">
		<div class="card-header bg-primary text-bg-primary p-2 fw-bold">
			<span th:text="${title}"></span>
		</div>
		<div class="card-body card-body-wrap">
			<div class="row">
				<div class="col-lg-6 col-md-6 col-sm-6 text-start">
					<span>Archived:</span>
				</div>
				<div class="col-lg-6 col-md-6 col-sm-6 text-end">
					<span th:id="'archived_data_' + ${id}">0 of 0</span>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12">
					<div class="row">
						<div class="col-12 text-start">
							<div class="progress">
								<div th:id="'archived_progress_' + ${id}" class="progress-bar" role="progressbar" style="width: 100%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">100%</div>
							</div>
						</div>
						<div class="col-lg-12 col-md-12 col-sm-12 text-start">
							<span th:id="'archived_status_' + ${id}">Status</span>
						</div>
						<div class="col-lg-6 col-md-6 col-sm-6 text-start">
							<div class="row">
								<div class="col-3 text-start">
									<span class="f-small text-primary me-2">ETL:</span>
								</div>
								<div class="col-9 text-end">
									<span class="f-small" th:id="'archived_etl_' + ${id}">0</span>
								</div>
							</div>
						</div>
						<div class="col-lg-6 col-md-6 col-sm-6 text-start">
							<div class="row">
								<div class="col-3 text-start">
									<span class="f-small text-primary me-2">ETC:</span>
								</div>
								<div class="col-9 text-end">
									<span class="f-small" th:id="'archived_etc_' + ${id}">0</span>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-12 col-md-12 col-sm-12 text-start">
					<div class="col-lg-12" th:id="'log-container_' + ${id}" style="max-height: 120px; overflow: scroll; scrollbar-width: thin;"></div>
				</div>
			</div>
		</div>
		<div class="card-footer">
			<button type="button" th:text="'Start'" class="btn btn-primary" onclick="start(this)"
					th:id="'btn_' + ${id}" th:data-url="${url}"></button>
		</div>
	</div>
</th:block>
