<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{common/head :: common_header(~{null})}"></th:block>
<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body">
                    <div class="themeForm">
                        <h2 class="tmsub-title">
                            <span th:text="'Sync Data'"></span>
                        </h2>
                        <div class="row">
                            <div class="col-lg-4 mb-3">
                                <label class="form-label"
                                       for="messId">Mess</label>
                                <select type="text" class="form-select" id="messId" th:value="${messId}">
                                    <option value="">Select Mess</option>
                                    <option value="0">All Messes</option>
                                    <option th:each="mess: ${messList}" th:text="${mess.messName}"
                                            th:value="${mess.messMasterId}"
                                    th:selectd="${messId == mess.messMasterId}"></option>
                                </select>
                            </div>
                            <div class="col-auto mt-4">
                                <button type="button" class="btn btn-lgtblue me-2 mt-3"
                                        id="getData">
                                    <i class="fa fa-database me-2"></i>Get Data
                                </button>
                                <button type="button" class="btn btn-info text-light me-2 mt-3"
                                        id="syncData">
                                    <i class="fa-solid fa-rotate me-2"></i>Sync
                                </button>
                                <button type="button" class="btn btn-warning text-light me-2 mt-3"
                                        id="syncDataStop">
                                    <i class="fa fa-stop me-2"></i>Stop
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Student Count: <span th:text="${userList != null ? userList.size() : '0'}"></span></label>
                        </div>
                        <div class="table-responsive themeTable">
                            <table class="table table-bordered nowrap w-100">
                                <thead>
                                <tr>
                                    <th>S.No</th>
                                    <th>Roll No</th>
                                    <th>Student Name</th>
                                    <th>Facial Serial No</th>
                                    <th>Fingerprint Status</th>
                                    <th>Card Status</th>
                                    <th>Facial Status</th>
                                    <th>Mess</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user, index: ${userList}">
                                    <td th:text="${index.index + 1}"></td>
                                    <td th:text="${user.userId}"></td>
                                    <td th:text="${user.getFullName()}"></td>
                                    <td th:text="${user.accessSerialNo}"></td>
                                    <td>
                                        <i class="fa "
                                           th:classappend="${user.hasFingerprint ? 'fa-check text-success' : 'fa-xmark text-danger'}"></i>
                                    </td>
                                    <td>
                                        <i class="fa "
                                           th:classappend="${user.hasCardSn ? 'fa-check text-success' : 'fa-xmark text-danger'}"></i>
                                    </td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                            <th:block th:if="${user.hasFacial}">
                                                <img th:src="'data:image/png;base64,' + ${user.facialPhotoSrc}"
                                                     style="width: 30px; cursor: pointer;"
                                                     data-bs-toggle="tooltip"
                                                     data-bs-placement="right"
                                                     th:attr="data-bs-html='true', title='<img src=\'data:image/png;base64, ' + ${user.facialPhotoSrc} + '\' style=\'width: 150px; height: auto; display: block; margin: auto;\'>'">

                                            </th:block>
                                            <th:block th:if="${!user.hasFacial}">
                                                <i class="fa fa-xmark text-danger"></i>
                                            </th:block>
                                        </div>
                                    </td>
                                    <td th:text="${user.messName != null && !user.messName.isEmpty()} ? ${user.messName} : 'NA'"></td>
                                    <td>
                                        <div class="d-flex justify-content-center">
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <hr>
                        <th:block th:replace="~{common/log-content::content('syncData')}"></th:block>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/biometric/log.js}"></script>
    <script th:inline="javascript">
        $(document).ready(function () {
            $('#syncDataStop').on('click', function (event) {
                console.log("sync stop triggered")
                event.preventDefault();
                const syncDataBtn = $('#syncDataStop');
                const messSelect = $('#messId');
                syncDataBtn.attr('disabled', true);
                fetch(contextPath + "/syncData/stop?messId=" + messSelect.val())
                    .then(response => {
                        syncDataBtn.removeAttr('disabled');
                    });
            });
            $('#syncData').on('click', function (event) {
                console.log("sync data triggered")
                event.preventDefault();
                const syncDataBtn = $('#syncData');
                const messSelect = $('#messId');
                syncDataBtn.attr('disabled', true);
                fetch(contextPath + "/syncData/perform?messId=" + messSelect.val())
                    .then(response => {
                        syncDataBtn.removeAttr('disabled');
                    });
            });
            $('#getData').on('click', function (event) {
                console.log("get data triggered");
                event.preventDefault();
                const messSelect = $('#messId');
                window.location.href = contextPath + "/syncData/" + messSelect.val();
            });
        });
    </script>
</th:block>
</body>
</html>
