<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>

<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body">
                    <!--<th:block th:replace="~{tabs}"></th:block>-->
                    <div class="themeForm">
                        <div class="row">
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="date" th:text="#{message.label.date}"></label>
                                <input type="date" class="form-control" id="date" th:value="${date}">
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="status" th:text="#{message.label.status}"></label>
                                <select type="text" class="form-select" id="status" th:value="${status}">
                                    <option value="" th:text="#{message.label.both}"></option>
                                    <option value="Pushed" th:text="#{message.label.pushed}"></option>
                                    <option value="Removed" th:text="#{message.label.removed}"></option>
                                </select>
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="messId" th:text="#{message.label.mess}"></label>
                                <select type="text" class="form-select" id="messId" th:value="${messId}">
                                    <option value="" th:text="#{message.label.select} + ' ' + #{message.label.mess}"></option>
                                    <option value="0" th:text="#{message.label.all.messes}"></option>
                                    <option th:each="mess: ${messList}" th:text="${mess.messName}"
                                            th:value="${mess.messMasterId}"></option>
                                </select>
                            </div>
                            <div class="col-auto mt-3">
                                <button type="button" onclick="getData()" class="btn btn-lgtblue mt-3" id="getData">
                                    <i class="fa fa-database me-1"></i>
                                    <span th:text="#{message.button.get.data}"></span>
                                </button>
                            </div>
                        </div>
                        <div class="table-responsive themeTable mt-3">
                            <table class="table table-bordered nowrap w-100">
                                <thead>
                                <tr>
                                    <th th:text="#{message.label.mess}"></th>
                                    <th th:text="#{message.label.student.id}"></th>
                                    <th th:text="#{message.label.student.name}"></th>
                                    <th th:text="#{message.label.status}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="student: ${studentList}">
                                        <td th:text="${student.messName}"></td>
                                        <td th:text="${student.studentId}"></td>
                                        <td th:text="${student.studentName}"></td>
                                        <td th:text="${student.pushStatus}"></td>
                                    </tr>
                                    <tr th:if="${studentList  == null || studentList.isEmpty()}">
                                        <td colspan="7" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{common/biometric-footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/biometric/history.js}"></script>
    <script th:src="@{/assets/js/biometric/log.js}"></script>
</th:block>
</body>
</html>
