<!DOCTYPE html>
<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body">
						<form class="themeForm needs-validation" id="collegeForm"
						  th:object="${schoolGeographyInfoDto}" th:action="@{#{url.college.info}+#{url.save}}" method="post" novalidate>
							<input type="text" th:field="*{schoolId}" th:name="*{schoolId}" th:value="*{schoolId}" hidden>
							<div class="row mt-2">
                        	    <div class="col-lg-12">
                            	    <h2 class="tmsub-title" th:text="#{message.label.college.details}"></h2>
                            	</div>
                        	</div>
                        	<div class="row mb-5">
                            	<div class="col-lg-12">
                                	<div class="row">
                                    	<div class="col-lg-6 mb-3">
                                    		<label class="form-label" for="institutionName">
                                    			<span th:text="#{message.label.institute.name}"></span>
												<th:block th:replace="~{common/template/mandatory-symbol}" />
											</label>
											<input type="text" class="form-control" id="institutionName" maxlength="60" oninput="trimSpaces(this)" th:field="*{schoolName}" name="institutionName" required>
											<div class="invalid-feedback" th:text="#{message.label.institute.name} + ' ' + #{message.validation.is.required}"></div>
										</div>
										<div class="col-lg-6 mb-3">
											<label class="form-label" for="dateOfEsatablish">
												<span th:text="#{message.label.date.of.establish}"></span>
												<th:block th:replace="~{common/template/mandatory-symbol}" />
											</label>
											<input type="date" class="form-control required-input" th:field="*{dateOfEstd}" th:value="*{dateOfEstd}" onkeydown="return false" id="dateOfEsatablish" name="dateOfEsatablish" required>
											<div class="invalid-feedback" th:text="#{message.validation.date.of.establish.required}"></div>
                                    	</div>
										<div class="col-lg-6 mb-3">
                                    	    <label class="form-label" for="location">
                                        		<span th:text="#{message.label.location}"></span>
                                      	  </label>
											<textarea type="text" class="form-control" id="location" maxlength="320" th:field="*{location}" oninput="trimSpaces(this)" name="location"></textarea>
                                    	</div>
										<div class="col-lg-6 mb-3">
                                    	    <label class="form-label" for="address">
                                        		<span th:text="#{message.label.address}"></span>
                                      	  </label>
											<textarea type="text" class="form-control" id="address" maxlength="320" th:field="*{address1}" oninput="trimSpaces(this)" name="address"></textarea>
                                    	</div>
										<div class="row mt-2">
			                       		     <div class="col-lg-12">
			                            	    <h2 class="tmsub-title" th:text="#{message.label.contact.information}"></h2>
											 </div>
										</div>
										<div class="col-lg-6 mb-3">
                                    		<label class="form-label" for="email">
                                    			<span th:text="#{message.label.common.email}"></span>
                                    			<th:block th:replace="~{common/template/mandatory-symbol}" />
											</label>
											<input type="text" class="form-control required-email" th:field="*{email}" maxlength="100" oninput="trimSpaces(this)" id="email" name="email">
											<div class="invalid-feedback" th:text="#{message.validation.email.required}"></div>
											<div class="invalid-valid-feedback d-none" th:text="#{message.validation.local.guardian.details.email}"></div>
										</div>
										<div class="col-lg-6 mb-3">
                                    		<label class="form-label" for="websiteURL">
                                    			<span th:text="#{message.label.website.url}"></span>
                                    			<th:block th:replace="~{common/template/mandatory-symbol}" />
											</label>
											<input type="text" class="form-control required-input" th:field="*{website}" id="websiteURL"
												name="websiteURL" onblur="validateWebsiteURL(this,true);" maxlength="320" oninput="trimSpaces(this)" required>
											<div class="form-text" th:text="#{message.label.url.note}"></div>
											<div class="invalid-feedback" th:text="#{message.validation.website.url.required}" ></div>
											<div class="invalid-valid-feedback d-none" th:text="#{message.validation.invalid.website.url}"></div>
										</div>
                                    	<div class="col-lg-6 mb-3">
											<label class="form-label" for="contactNumber">
												<span th:text="#{message.label.contact.number}"></span>
												<th:block th:replace="~{common/template/mandatory-symbol}" />
											</label>
											<input type="text" class="form-control numeric required-mob-num" th:field="*{landlineContactNo1}"  id="contactNumber"
												th:attr="placeholder=#{message.placeholder.mobile.number}" th:data-mask="${mobileNumberMask}" required>
											<div class="form-text" th:text="#{message.label.mob.no.note}"></div>
											<div class="invalid-feedback"><span
													th:text="#{message.validation.contact.number.required}"></span></div>
											<div class="invalid-req-feedback d-none"><span
													th:text="#{message.validation.contact.number.required}"></span></div>
											<div class="invalid-val-feedback d-none"><span
													th:text="#{message.validation.student.details.mob.no}"></span>
											</div>
										</div>
										<div class="col-lg-6">
											<label class="form-label" for="alternateContactNumber">
												<span th:text="#{message.label.alternate.contact.number}"></span>
											</label>
											<input type="text" class="form-control numeric required-mob-num" th:field="*{landlineContactNo2}"  id="alternateContactNumber"
												   th:attr="placeholder=#{message.placeholder.mobile.number}" th:data-mask="${mobileNumberMask}">
											<div class="form-text" th:text="#{message.label.mob.no.note}"></div>
											<div class="invalid-feedback"><span
													th:text="#{message.validation.contact.number.required}"></span></div>
											<div class="invalid-req-feedback d-none"><span
													th:text="#{message.validation.contact.number.required}"></span></div>
											<div class="invalid-val-feedback d-none"><span
													th:text="#{message.validation.student.details.mob.no}"></span>
											</div>
										</div>
									</div>
								</div>
							</div>
							<!--Button Section-->
							<hr>
							<div class="row text-end">
								<div class="col-lg-12 mt-2 mb-4">
									<div class="d-flex align-items-center justify-content-end">
										<button type="button" class="btn btn-secondary px-4 me-3" id="cancel" onclick="window.history.back();">
											<i class="fa-solid fa-ban me-1"></i>
											<span th:text="#{message.button.cancel}"></span>
										</button>
										<button type="button" class="btn btn-blue me-2" id="collegeSave">
											<i class="fa-solid fa-rotate me-1"></i>
											<span th:text="#{message.button.update}"></span>
										</button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/base/jquery.inputmask.min.js}"></script>
		<script th:src="@{/assets/js/collegeInfo/college-info.js}"></script>
	</th:block>
	<!-- Footer-->
</body>

</html>
