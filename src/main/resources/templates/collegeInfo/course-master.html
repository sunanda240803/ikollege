<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
		<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<div class="row">
	                        <div class="col-lg-12">
	                            <h2 class="tmsub-title" th:text="#{message.label.manage.department}"></h2>
	                        </div>
	                    </div>
	                    <form class="themeForm g-3 " action="#" th:action="@{#{url.course.master} + #{url.department}}" method="post"
								 id="departmentSave">
							<div class="row mb-3" id="departmentSearch">
								<div id="departmentSelect" class="col-lg-4 mb-3">
									<label for="departmentName" class="form-label">
										<span th:text="#{message.label.department.name}"></span><th:block th:replace="~{common/template/mandatory-symbol}" />
									</label>
									<div class="input-group mb-3" id="searchDepartment">
										<select id="departmentName" class="selectpicker required-select-input" data-live-search="true" th:name="departmentId">
											<option value="" th:text="#{message.label.select}+' '+#{message.label.department.name}"></option>
											<option th:each="department:${departmentNameList}"
													th:value="${department.departmentId}" th:text="${department.departmentName}">
											</option>
										</select>
										<div class="validateCatNameDrop invalid-feedback d-none text-danger position-absolute" id="validateCatNameDrop" style="top: 100%; left: 0;">
											<span th:text="#{message.validation.department.required}"></span>
										</div>
										<div class="">
										</div>
									</div>
								</div>
								<div id="departmentInput" class="col-lg-4 mb-3 d-none">
									<label for="addDepartment" class="form-label">
										<span th:text="#{message.label.department.name}"></span>
										<th:block th:replace="~{common/template/mandatory-symbol}" />
									</label>
									<input type="text" id="addDepartment" class="form-control required-input" th:placeholder="#{message.placeholder.department.name}"
										   th:name="departmentName" maxlength="40" oninput="validateAlphabetWithSpaceInput(this)">
									<div class="validateCatName invalid-feedback" id="validateCatName"></div>
									<input type="hidden" th:name="departmentId" id="masterId">
								</div>
								<div class="col-lg-8 d-flex align-items-center mb-3">
									<button type="button" id="addCatBtn" class="btn btn-sm btn-success me-2" data-bs-toggle="tooltip"
											data-bs-placement="bottom" title="Add Department" onclick="showCategoryBox()">
										<i class="fa-solid fa-plus fa-lg"></i>
									</button>
									<button type="button" id="editCatBtn" class="btn btn-sm btn-primary me-2" data-bs-toggle="tooltip"
											data-bs-placement="bottom" title="Edit Department">
										<i class="fa-solid fa-pencil"></i>
									</button>
									<button type="button" id="deleteCatBtn" class="btn btn-sm btn-danger me-2" data-bs-toggle="tooltip"
											data-bs-placement="bottom" title="Delete Department" onclick="deleteDepartment()">
										<i class="fa-solid fa-trash-can"></i>
									</button>
									<button type="button" id="saveCatBtn" class="btn btn-sm btn-aqua me-2 mt-3 d-none" data-bs-toggle="tooltip"
											data-bs-placement="bottom" title="Save Department">
										<i class="fa-solid fa-floppy-disk fa-lg"></i>
									</button>
									<button type="button" id="departmentCancelButton" class="btn btn-sm btn-tmSecondary me-2 mt-3 d-none"
											data-bs-toggle="tooltip" data-bs-placement="bottom" title="Cancel">
										<i class="fa-solid fa-xmark fa-lg"></i>
									</button>
								</div>
							</div>

						</form>
                        <div class="row">
                            <div class="col-lg-12">
                                <h2 class="tmsub-title" th:text="#{message.label.manage.course}"></h2>
                            </div>
                            <form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Course Name, Description, Department Name and Course Code to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="*{form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
                        </div>
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="courseListTable" class="table table-bordered nowrap w-100">
	                                <thead>
	                                <tr>
	                                    <th><span th:text="#{message.label.course.name}"></span></th>
	                                    <th><span th:text="#{message.label.description}"></span></th>
	                                    <th><span th:text="#{message.label.department.name}"></span></th>
	                                    <th><span th:text="#{message.label.degree.awarded}"></span></th>
	                                    <th><span th:text="#{message.label.affiliation}"></span></th>
	                                    <th class="text-center"><span th:text="#{message.label.course.code}"></span></th>
	                                    <th class="text-center"><span th:text="#{message.label.action}"></span></th>
	                                </tr>
	                                </thead>
	                                <tbody >
	                                	<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
	                                		 th:each="courseMaster, iter: ${form.paginationList.getContent()}">
		                                    <td><span th:text="${courseMaster.courseMasterName}"></span></td>
		                                    <td><span th:text="${courseMaster.description}"></span></td>
		                                    <td><span th:text="${courseMaster.departmentName}"></span></td>
		                                    <td><span th:text="${courseMaster.degreeAwarded}"></span></td>
		                                    <td><span th:text="${courseMaster.affiliation}"></span></td>
		                                    <td class="text-center"><span th:text="${courseMaster.courseMasterHead}"></span></td>
		                                    <td class="text-center">
												<div class="d-flex justify-content-center">
													<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" th:data-course-id="${courseMaster.courseMasterId}"
														onclick="editCourseMaster(this);" data-bs-title="Edit">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" th:id="${'deleteReq_'+courseMaster.courseMasterId}"
														onclick="deleteCourseMaster(this);"
														th:data-course-id="${courseMaster.courseMasterId}" data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button>
												</div>
											</td>
	                                	</tr>
	                                	<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="7" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>	                                	 
	                                </tbody>
	                            </table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:id="modalDiv"></div>
	<th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>

	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/collegeInfo/course-master.js}"></script>
		
		<script th:inline="javascript">
			const baseURL = /*[[#{url.course.master}]]*/ '';
			const baseURL1 = /*[[#{url.department}]]*/ '';
			const checkCourseNameExistURL = /*[[#{url.course.name.exist}]]*/ '';
			const checkDepartmentNameExistURL = /*[[#{url.department.name.exist}]]*/ '';
			const checkCourseCodeExistURL = /*[[#{url.course.code.exist}]]*/ '';

		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
