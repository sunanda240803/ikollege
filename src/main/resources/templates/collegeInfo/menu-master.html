<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/head :: common_header(~{::link})} ">
  <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>
<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
  <div class="row">
    <div class="col-lg-12">
      <div class="card main-card mt-4">
        <div class="card-body themeForm">
          <div class="row">
            <form action="#" method="get">
              <div class="row mb-3">
                <div class="col-auto">
                  <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                    <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                       data-bs-title="Use Menu Name, Menu URL to search"></i>
                  </label>
                  <input type="text" class="form-control" name="search" id="search"
                         th:field="*{form.search}">
                </div>
                <div class="col-auto mt-3">
                  <button class="btn btn-secondary mt-4" type="submit">
                    <span th:text="#{message.label.search}"></span>
                  </button>
                </div>
              </div>
            </form>
          </div>
          <div class="mb-4">
            <div class="table-responsive themeTable">
              <table id="menuList" class="table table-bordered nowrap w-100">
                <thead>
                <tr>
                  <th><span th:text="#{message.label.menu.name}"></span></th>
                  <th><span th:text="#{message.label.menu.order}"></span></th>
                  <th><span th:text="#{message.label.menu.mainMenuOrder}"></span></th>
                  <th><span th:text="#{message.label.menu.subMenuOrder}"></span></th>
                  <th><span th:text="#{message.label.menu.subSubMenu}"></span></th>
                  <th><span th:text="#{message.label.menu.url}"></span></th>
                  <th><span th:text="#{message.label.menu.menuType}"></span></th>
                  <th class="text-center"><span th:text="#{message.label.action}"></span></th>
                </tr>
                </thead>
                <tbody >
                <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                    th:each="menu, iter: ${form.paginationList.getContent()}">
                  <td><span th:text="${menu.menuHeading}"></span></td>
                  <td><span th:text="${menu.menuOrder}"></span></td>
                  <td><span th:text="${menu.mainMenuOrder}"></span></td>
                  <td><span th:text="${menu.subMenuOrder}"></span></td>
                  <td><span th:text="${menu.subSubMenuOrder}"></span></td>
                  <td><span th:text="${menu.urlPath}"></span></td>
                  <td><span th:text="${menu.menuType}"></span></td>
                  <td class="text-center">
                    <div class="d-flex justify-content-center">
                      <button type="button" class="btn btn-outline-primary btn-sm me-2"
                              data-bs-toggle="tooltip" th:menu-id="${menu.menuId}"
                              onclick="editMenu(this);" data-bs-title="Edit">
                        <i class="fa-solid fa-pencil"></i>
                      </button>
                      <button th:if="${menu.activeFlag} == 'Y'" type="button" class="btn btn-outline-danger btn-sm"
                              data-bs-toggle="tooltip" th:id="${'deleteReq_'+menu.menuId}"
                              onclick="deleteMenu(this);"
                              th:menu-id="${menu.menuId}" data-bs-title="Delete">
                        <i class="fa-solid fa-trash-can"></i>
                      </button>
                    </div>
                  </td>
                </tr>
                <tr th:if="${form.paginationList == null || form.paginationList.getContent().size() eq 0}">
                  <td colspan="8" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
                </tr>
                </tbody>
              </table>
            </div>
            <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:id="modalDiv"></div>
<th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
  <script th:src="@{/assets/js/collegeInfo/menu.js}"></script>

  <script th:inline="javascript">
    const baseURL = /*[[#{url.menu.master}]]*/ '';
  </script>
</th:block>
<!-- Footer-->
</body>

</html>
