<!DOCTYPE html>
<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>

<body>
 <header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Question and Answer to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="*{form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
						
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="faqTable" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
		                                    <th th:text="#{message.label.question}"></th>
		                                    <th th:text="#{message.label.answer}"></th>
                                    		<th class="text-center" th:text="#{message.label.action}"></th>
                                    	</tr>
									</thead>
									<tbody>
										
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											th:each="faqInfo, iter: ${form.paginationList.getContent()}">
											<td th:text="${faqInfo.question}"></td>
											<td th:text="${faqInfo.answer}"></td>
											<td class="text-center">
												<div class="d-flex justify-content-center">
													<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip"
														th:data-faq-id="${faqInfo.id}"
														onclick="editFaqInfo(this);" data-bs-title="Edit">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip"
														th:id="${'deleteReq_'+faqInfo.id}"
														onclick="deleteFaqInfo(this);"
														th:data-faq-id="${faqInfo.id}"
														data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button>
												</div>
											</td>
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="8" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
										
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
<div th:id="modalDiv"></div>

<!-- Delete Modal-->
<th:block 
	th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>
<!-- //Delete Modal-->

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
	<script th:src="@{/assets/js/collegeInfo/faq.js}"></script>
	<script th:inline="javascript">
		const baseURL = /*[[#{url.faq}]]*/ '';
	</script>
</th:block>
<!-- Footer-->
</body>

</html>
