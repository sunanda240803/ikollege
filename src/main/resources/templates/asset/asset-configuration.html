<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>

	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Asset category, Maintenance and Shortcode to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="*{form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="assetConfigTable" class="table table-bordered nowrap w-100">
									<thead>
									<tr>
										<th>
											<span th:text="#{message.label.asset.category}"></span>
										</th>
										<th>
											<span th:text="#{message.label.asset.category.maintenance}"></span>
										</th>
										<th class="text-center">
											<span th:text="#{message.label.shortcode}"></span>
										</th>
										<th class="text-end"><span th:text="#{message.label.minor.repair.cost}"></span> 
											<i class="fa-solid fa-indian-rupee-sign"></i>
										</th>
										<th class="text-end"><span th:text="#{message.label.major.repair.cost}"></span> 
											<i class="fa-solid fa-indian-rupee-sign"></i>
										</th>
										<th class="text-end"><span th:text="#{message.label.replacement.cost}"></span> 
											<i class="fa-solid fa-indian-rupee-sign"></i>
										</th>
										<th class="text-center">
											<span th:text="#{message.label.action}"></span>
										</th>
									</tr>
									</thead>
									<tbody>
									<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}" 
										th:each="asset, iter: ${form.paginationList.getContent()}">
										<td th:text="${asset.categoryType}"></td>
										<td th:text="${asset.categoryName}"></td>
										<td class="text-center" th:text="${asset.assetCategoryShortcode ?: ''}"></td>
										<td class="text-end currency" th:text="${asset.minorRepairCost}"></td>
										<td class="text-end currency" th:text="${asset.majorRepairCost}"></td>
										<td class="text-end currency" th:text="${asset.replacementCost}"></td>
										<td class="text-center">
											<div class="d-flex justify-content-center">
												<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" th:data-category-id="${asset.getId()}"
														th:data-category-type="${asset.getCategoryType()}"
														onclick="editCategory(this);" data-bs-title="Edit">
													<i class="fa-solid fa-pencil"></i>
												</button>
												<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" th:data-category-id="${asset.getId()}"
														th:data-category-type="${asset.getCategoryType()}"
														th:id="${'deleteReq_'+asset.id}" onclick="deleteCategory(this);"
														data-bs-title="Delete">
													<i class="fa-solid fa-trash-can"></i>
												</button>
											</div>
										</td>
									</tr>
									<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="6" class="text-center">No Data Available</td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>


	<div th:id="modalDiv"></div>
	<th:block
		th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
	</th:block>

	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/asset/asset-configuration.js}"></script>
		<script th:inline="javascript">
			const baseURL = /*[[#{url.asset.configuration}]]*/ '';
			const checkDetailsExistURL = /*[[#{url.exist}]]*/ '';
			const checkShortcodeExistURL = /*[[#{url.shortcode.exist}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
