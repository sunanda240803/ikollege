<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="contents(studentFileInfoDtoList)">
    <div class="row mt-4" th:if="${!studentFileInfoDtoList.empty}">
        <div class="col-lg-12">
            <h2 class="tmsub-title" th:text="#{message.label.uploaded.documents}"></h2>
        </div>
    </div>
    <div class="col-lg-12 mb-2">
        <div class="row mb-3">
            <div class="col-lg-6 mb-3" th:each="studentFileInfoDto : ${studentFileInfoDtoList}">
                <ul class="list-group">
                    <li class="list-group-item" >
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="text-truncate"
                                 th:text="${studentFileInfoDto.description == null or #strings.isEmpty(#strings.trim(studentFileInfoDto.description)) ? studentFileInfoDto.filename : studentFileInfoDto.description}"></div>
                            <button class="btn btn-tmPrimary btn-sm" type="button" data-bs-toggle="tooltip"
                                    data-bs-custom-class="custom-popover" data-bs-trigger="hover focus"
                                    th:attr="data-bs-title=#{message.label.download.file}"
                                    th:data-filename="${studentFileInfoDto.filename}" onclick="triggerDownload(this)">
                                <i class="fa fa-download pdf text-white"></i>
                            </button>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
