<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
	<div class="col-lg-12 mb-3">
		<div class="alert alert-warning" role="alert">
			<ul>
				<li><span th:text="#{message.label.fill.fields}"></span></li>
				<li><span th:text="#{message.label.registration.enable}"></span></li>
				<li><span th:text="#{message.label.fill.roll.no.application.no}"></span></li>
			</ul>
			<!-- Hidden content -->
			<ul id="moreContent" class="d-none">
				<li><span th:text="#{message.label.photo.instructions}"></span>
					<ul>
						<li>
							<span th:text="#{message.label.candidate.photo}"></span>
							<span class="text-danger" th:text="#{message.label.photo.dimensions}"></span>
						</li>
						<li>
							<span th:text="#{message.label.signature}"></span>
							<span class="text-danger" th:text="#{message.label.signature.size}"></span>
						</li>
						<li>
							<span th:text="#{message.label.parent.proof}"></span>
							<span class="text-danger" th:text="#{message.label.parent.proof.size}"></span>
						</li>
					</ul>
				</li>
				<li><span th:text="#{message.label.hostel.rules.regulations}"></span></li>
				<li><span th:text="#{message.label.pdf.generation.submission}"></span></li>
				<li><span th:text="#{message.label.payments}"></span></li>
				<li>
					<span th:text="#{message.label.instruction.student.details}"></span>
					<ul>
						<li><span
								th:text="#{message.label.instruction.faculty.name}"></span>
						</li>
						<li><span
								th:text="#{message.label.instruction.roll.no}"></span>
						</li>
					</ul>
				</li>
			</ul>

			<!-- Show more/less link -->
			<button type="button" class="btn btn-sm btn-tmPrimary" id="toggleContent">
				<span th:text="#{message.label.instruction.more.details}"></span>
			</button>
		</div>
	</div>
	<!--Upload Documents-->
	<div class="row mt-4">
		<div class="col-lg-12">
			<h2 class="tmsub-title"><span th:text="#{message.label.upload.documents}"></span>
			</h2>
		</div>
	</div>
	<div class="row mb-3">
		<div class="col-lg-3 mb-3">
			<th:block th:if="${form.imageBytes == null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center has-validation">
						<span th:text="#{message.label.upload.documents.student.photo}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
						<input type="file" name="studentProfile" id="studentPhoto"
							   class="inputfile inputfile-4"
							   data-multiple-caption="{count} files selected" required data-width="300"
							   data-height="400" th:accept="#{message.accepted.image.types}">
						<label for="studentPhoto">
							<img class="img-fluid d-block mx-auto profile" id="studentProfileImage"
								 th:data-default="@{/assets/img/user-img1.png}"
								 th:src="@{/assets/img/user-img1.png}" alt="">
						</label>
						<div class="invalid-feedback"><span th:text="#{message.validation.upload.documents.picture}"></span></div>
						<div class="invalid-value-feedback d-none" th:text="#{message.validation.upload.documents.picture}"></div>
						<div class="invalid-dimension-feedback d-none" th:text="#{message.validation.profile.dimension}"></div>
						<div class="invalid-size-feedback d-none" th:text="#{message.validation.image.size}"></div>
						<div class="invalid-img-feedback d-none" th:text="#{message.validation.image}"></div>
						<div class="invalid-format-feedback d-none" th:text="#{message.invalid.file.format}"></div>
					</div>
				</div>
			</th:block>
			<th:block th:if="${form.imageBytes != null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center">
						<label>Student Photo</label>
						<div class="d-flex justify-content-center mt-3">
							<img th:src="@{'data:image/jpeg;base64,' + ${studentProfile}}" alt="Student Photo" style="max-width: 100px; max-height: 110px;" />
						</div>
					</div>
				</div>
			</th:block>
		</div>
		<div class="col-lg-3 mb-3">
			<th:block th:if="${form.studentSignBytes == null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center">
						<span th:text="#{message.label.upload.documents.student.signature}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
						<input type="file" name="studentSignature" id="studentSignature"
							   class="inputfile inputfile-4"
							   data-multiple-caption="{count} files selected" required data-width="400"
							   data-height="100" th:accept="#{message.accepted.image.types}">
						<label for="studentSignature">
							<div class="photoSign-upload">
								<img class="img-fluid d-block mx-auto signature"
									 id="studentSignaturePreview"
									 th:data-default="@{/assets/img/signature-img.png}"
									 th:src="@{/assets/img/signature-img.png}">
							</div>
						</label>
						<div class="invalid-feedback"><span th:text="#{message.validation.upload.documents.signature}"></span></div>
						<div class="invalid-value-feedback d-none" th:text="#{message.validation.upload.documents.signature}"></div>
						<div class="invalid-dimension-feedback d-none" th:text="#{message.validation.signature.dimension}"></div>
						<div class="invalid-size-feedback d-none" th:text="#{message.validation.image.size}"></div>
						<div class="invalid-img-feedback d-none" th:text="#{message.validation.image}"></div>
						<div class="invalid-format-feedback d-none" th:text="#{message.invalid.file.format}"></div>
					</div>
				</div>
			</th:block>
			<th:block th:if="${form.studentSignBytes != null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center d-flex justify-content-center">
						<div style="width: 200px; height: 170px;">
						<label>Student Signature</label>
							<div class="photoSign-upload mt-3">
								<img th:src="@{'data:image/jpeg;base64,' + ${studentSignature}}" alt="Student Signature" style="max-width: 95%; max-height: 95%;" />
							</div>
						</div>
					</div>
				</div>
			</th:block>
		</div>
		<div class="col-lg-3 mb-3">
			<label class="form-label" for="signedParentName">
				<span th:text="#{message.label.upload.documents.parent.name}"></span>
				<th:block th:replace="~{common/template/mandatory-symbol}" />
			</label>
			<th:block th:if="${form.signedParentName == null}">
				<input type="text" id="signedParentName" name="signedParentName"
					   class="form-control uppercase required-input" required
					   th:placeholder="#{message.placeholder.upload.documents.parent.name}" maxlength="120">
				<div class="invalid-feedback"><span th:text="#{message.validation.upload.documents.parent.name}"></span></div>
			</th:block>
			<th:block th:if="${form.signedParentName != null}">
				<div class="form-control form-graybox">
					<span th:text="${form.signedParentName}"></span>
					<input type="hidden" id="signedParentName" th:value="${form.signedParentName}">
				</div>
			</th:block>
		</div>
		<div class="col-lg-3 mb-3">
			<th:block th:if="${form.parentSignBytes == null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center">
						<span th:text="#{message.label.upload.documents.parent.signature}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
						<input type="file" name="parentSignature" id="parentSignatureFile"
							   class="inputfile inputfile-4"
							   data-multiple-caption="{count} files selected" required data-width="400"
							   data-height="100" th:accept="#{message.accepted.image.types}">
						<label for="parentSignatureFile">
							<div class="photoSign-upload">
								<img class="img-fluid d-block mx-auto signature"
									 id="parentSignaturePreview"
									 th:data-default="@{/assets/img/signature-img.png}"
									 th:src="@{/assets/img/signature-img2.png}">
							</div>
						</label>
						<div class="invalid-feedback"><span th:text="#{message.validation.upload.documents.parent.signature}"></span></div>
						<div class="invalid-value-feedback d-none" th:text="#{message.validation.upload.documents.parent.signature}"></div>
						<div class="invalid-dimension-feedback d-none" th:text="#{message.validation.signature.dimension}"></div>
						<div class="invalid-size-feedback d-none" th:text="#{message.validation.image.size}"></div>
						<div class="invalid-img-feedback d-none" th:text="#{message.validation.image}"></div>
						<div class="invalid-format-feedback d-none" th:text="#{message.invalid.file.format}"></div>
					</div>
				</div>
			</th:block>
			<th:block th:if="${form.parentSignBytes != null}">
				<div class="upload-box d-lg-block">
					<div class="box text-center d-flex justify-content-center">
						<div style="width: 200px; height: 170px;">
						<label>Parent Signature</label>
							<div class="photoSign-upload mt-3">
								<img th:src="@{'data:image/jpeg;base64,' + ${parentSignature}}" alt="Profile Image" style="max-width: 95%; max-height: 95%;" />
							</div>
						</div>
					</div>
				</div>
			</th:block>
		</div>
	</div>
	<!--Undertaking form--->
	<div class="row">
		<div class="col-lg-12">
			<h2 class="tmsub-title"><span th:text="#{message.label.undertaking.form}"></span>
			</h2>
		</div>
	</div>
	<div class="col-lg-4 mb-3">
		<th:block th:if="${form.id == null}">
			<div class="form-check">
				<input class="form-check-input d-none required-select-input" type="checkbox" id="underTakingCheck"
					   value="option1" disabled required>
				<a href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#undertakingFormModel">
					<label for="underTakingCheck">
						<u class="text-tmPrimary"><span th:text="#{message.label.undertaking.form.read}"></span></u>
					</label>
				</a>
				<div class="invalid-feedback"><span th:text="#{message.validation.undertaking.form.read}"></span></div>
			</div>
		</th:block>
		<th:block th:if="${form.id != null}">
		    <div class="form-check">
		        <input class="form-check-input" type="checkbox" disabled checked>
		        <u class="text-tmPrimary">
					<a href="javascript:void(0);" data-bs-toggle="modal"
					   data-bs-target="#undertakingFormModel" id="undertakingFormLink">
		                <span th:text="#{message.label.undertaking.form.read}"></span>
		            </a>
		        </u>
		    </div>
		</th:block>
	</div>
	<div class="col-lg-4 mb-3">
		<th:block th:if="${form.id == null}">
			<div class="form-check">
				<input class="form-check-input d-none required-select-input" type="checkbox" id="hostelRulesCheck"
					   value="option2" disabled required>
				<a href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#hostelRulesModel">
					<label for="hostelRulesCheck">
						<u class="text-tmPrimary"><span th:text="#{message.label.undertaking.form.read.hostel.rules}"></span></u>
					</label>
				</a>
				<div class="invalid-feedback"><span th:text="#{message.validation.undertaking.form.read}"></span></div>
			</div>
		</th:block>
		<th:block th:if="${form.id != null}">
		    <div class="form-check">
		        <input class="form-check-input" type="checkbox" disabled checked>
		        <u class="text-tmPrimary">
					<a href="javascript:void(0);" data-bs-toggle="modal"
					   data-bs-target="#hostelRulesModel" id="hostelRulesRegulationLink">
		                <span th:text="#{message.label.undertaking.form.read.hostel.rules}"></span>
		            </a>
		        </u>
		    </div>
		</th:block>
	</div>
	<div class="col-lg-4 mb-3">
		<th:block th:if="${form.id == null}">
			<div class="form-check">
				<input class="form-check-input d-none required-select-input" type="checkbox" id="vehicleRulesCheck"
					   value="option3" disabled required>
				<a href="javascript:void(0);" data-bs-toggle="modal" data-bs-target="#vehicleRulesModel">
					<label for="vehicleRulesCheck">
						<u class="text-tmPrimary"><span th:text="#{message.label.undertaking.form.read.vehicle.rules}"></span></u>
					</label>
				</a>
				<div class="invalid-feedback"><span th:text="#{message.validation.undertaking.form.vehicle.rules}"></span></div>
			</div>
		</th:block>
		<th:block th:if="${form.id != null}">
		    <div class="form-check">
		        <input class="form-check-input" type="checkbox" disabled checked>
		        <u class="text-tmPrimary">
					<a href="javascript:void(0);" data-bs-toggle="modal"
					   data-bs-target="#vehicleRulesModel" id="vehicleRulesRegulationLink">
		                <span th:text="#{message.label.undertaking.form.read.vehicle.rules}"></span>
		            </a>
		        </u>
		    </div>
		</th:block>
	</div>

	<!--Student Details--->
	<div class="row mt-4">
		<div class="col-lg-12">
			<h2 class="tmsub-title"><span th:text="#{message.label.student.details}"></span>
			</h2>
		</div>
	</div>
	<div class="row mb-3">
		<div class="col-lg-12">
			<div class="row">
				<div class="col-lg-3 mb-3">
					<label class="form-label" for="studentId">
						<span th:text="#{message.label.iitm.roll.no}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.studentId == null}">
						<input type="text" id="studentId" name="studentId"
						   class="form-control uppercase required-student-id"
							   onblur="validateStudentId();" oninput="validateAlphaNumericInput(this);"
						   th:placeholder="#{message.placeholder.roll.no}" maxlength="10"
						   required>
					</th:block>
					<th:block th:if="${form.studentId != null}">
						<div class="form-control form-graybox">
							<span th:text="${form.studentId}"></span>
						</div>
						<input type="hidden" id="updateStudentId" th:value="${form.studentId}"/>
					</th:block>
					
					<div class="invalid-feedback"><span th:text="#{message.validation.no.roll.no}"></span></div>
					<div class="invalid-req-feedback d-none"><span th:text="#{message.validation.no.roll.no}"></span></div>
					<div class="invalid-min-feedback d-none"><span th:text="#{message.validation.min.roll.no}"></span></div>
					<div class="invalid-value-feedback d-none"><span th:text="#{message.validation.no.roll.no}"></span></div>
					<div class="invalid-exist-feedback d-none"><span th:text="#{message.validation.roll.no.already.exists}"></span></div>
					<div class="invalid-format-feedback d-none"><span th:text="#{message.validation.alpha.numeric.roll.no}"></span></div>

				</div>
				<div class="col-lg-3 mb-3">
					<label class="form-label" for="applicationNumber">
						<span th:text="#{message.label.qualifying.exam.application.no}"></span>
					</label>
					<th:block th:if="${form.applicationNumber == null}">
						<input type="text" name="applicationNumber" id="applicationNumber"
							   class="form-control uppercase required-input" th:placeholder="#{message.placeholder.application.no}"
							   maxlength="12">
					</th:block>
					<th:block th:if="${form.applicationNumber != null}">
						<div class="form-control form-graybox"><span th:text="${form.applicationNumber}"></span></div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<label class="form-label" for="studentName">
						<span th:text="#{message.label.student.name}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.studentName == null}">
						<input type="text" id="studentName" class="form-control uppercase required-input" required
							   th:placeholder="#{message.placeholder.student.name}" name="studentName" maxlength="60">
						<div class="invalid-feedback"><span th:text="#{message.validation.student.details.name}"></span>
						</div>
					</th:block>
					<th:block th:if="${form.studentName != null}">
						<div class="form-control form-graybox"><span th:text="${form.studentName}"></span></div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<label class="form-label">
						<span th:text="#{message.label.gender}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.gender == null}">
						<div class="checkRadio-bg form-control" id="genderChecks">
							<div class="form-check form-check-inline">
								<input class="form-check-input required-input" type="radio" value="M" id="male"
									   name="gender" required>
								<label class="form-check-label" for="male"><span th:text="#{message.label.male}"></span></label>
							</div>
							<div class="form-check form-check-inline">
								<input class="form-check-input required-input" type="radio" value="F" id="female"
									   name="gender" required>
								<label class="form-check-label" for="female"><span th:text="#{message.label.female}"></span></label>
							</div>
						</div>
						<div class="invalid-feedback"><span th:text="#{message.validation.student.details.gender}"></span></div>
					</th:block>
					<th:block th:if="${form.gender != null}">
						<div class="form-control form-graybox">
							<span th:text="${form.gender == 'M' ? 'Male' : (form.gender == 'F' ? 'Female' : '')}"></span>
						</div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<label class="form-label" for="dob">
						<span th:text="#{message.label.dob}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.dob == null}">
						<input type="date" id="dob" name="dob" min="1900-01-01" class="form-control required-input"
							   th:placeholder="#{message.label.dob}" onkeydown="return false" required th:max="${dobMax}">
						<div class="invalid-feedback"><span th:text="#{message.validation.student.details.dob}"></span></div>
					</th:block>
					<th:block th:if="${form.dob != null}">
						<div class="form-control form-graybox">
							<span th:text="${#temporals.format(form.dob, #messages.msg('date.format'))}"></span>
						</div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<label class="form-label" for="studentPersonalEmail">
						<span th:text="#{message.label.personal.email}"></span>
					</label>
					<th:block th:if="${form.studentPersonalEmail == null}">
						<input type="text" id="studentPersonalEmail" class="form-control required-email"
							   th:placeholder="#{message.placeholder.personal.email}" name="studentPersonalEmail" >
						  <div class="invalid-feedback" th:text="#{message.label.personal.email.required}"></div>
			              <div class="invalid-req-feedback d-none" th:text="#{message.label.personal.email.required}"></div>
			              <div class="invalid-valid-feedback d-none" th:text="#{message.validation.email.id}"></div>
		            </th:block>
					<th:block th:if="${form.studentPersonalEmail != null}">
						<div class="form-control form-graybox"><span th:text="${form.studentPersonalEmail}"></span></div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<th:block th:replace="~{common/field/blood-group-select::select(${form}, 'true', '')}"></th:block>
				</div>
				<div class="col-lg-3 mb-3">
					<label for="messPreference" class="form-label">
						<span th:text="#{message.label.mess.preference}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.messName == null}">
						<div class="input-group mb-3">
							<select id="messPreference" class="form-select required-input" name="messName" required>
								<option value="" th:text="#{message.label.select}+' '+#{message.label.mess.preference}"></option>
								<option value="South Indian">South Menu</option>
								<option value="North Indian">North Menu</option>
								<option value="Food Court">Food Court</option>
								<option value="South Indian with Extras">South Menu with extras only Veg</option>
								<option value="North Indian with Extras">North Menu with extras only Veg</option>
							</select>
							<div class="invalid-feedback"><span th:text="#{message.validation.student.details.mess.pref}"></span></div>
						</div>
					</th:block>
					<th:block th:if="${form.messName != null}">
						<div class="form-control form-graybox">
							<span th:text="${form.messName == 'South Indian' ? 'South Menu' 
				                 : (form.messName == 'North Indian' ? 'North Menu' 
				                 : (form.messName == 'Food Court' ? 'Food Court' 
				                 : (form.messName == 'South Indian with Extras' ? 'South Menu with extras only Veg' 
				                 : (form.messName == 'North Indian with Extras' ? 'North Menu with extras only Veg' : ''))))}">
							</span>
						</div>
					</th:block>
				</div>
				<div class="col-lg-12 mb-3">
					<label class="form-label" for="address">
						<span th:text="#{message.label.address}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<th:block th:if="${form.studentAddress == null}">
						<textarea id="address" name="studentAddress" rows="2" class="form-control addressForm required-input"
								  th:placeholder="#{message.placeholder.address}" required maxlength="300"></textarea>
						<div class="invalid-feedback"><span th:text="#{message.validation.student.registration.address.required}"></span></div>
					</th:block>
					<th:block th:if="${form.studentAddress != null}">
						<div class="form-control form-graybox text-wrap" style="height: 99px; overflow: auto;"><span th:text="${form.studentAddress}"></span></div>
					</th:block>
				</div>
				<div class="col-lg-3 mb-2">
		            <label class="form-label"><span th:text="#{message.label.pwd}"></span></label>
					<th:block th:if="${form.pwd == null}">
			            <div class="checkRadio-bg form-control col-lg-3">
			                <div class="form-check form-check-inline me-4">
			                    <input class="form-check-input required-input" type="radio" id="yes" name="pwd"
			                           onclick="togglePwdFields(true)" value="Y"
			                           th:checked="${form.pwd ne null and !form.pwd.isEmpty()}">
			                    <label class="form-check-label" for="yes">
			                        <span th:text="#{message.label.yes}"></span>
			                    </label>
			                </div>
			                <div class="form-check form-check-inline">
			                    <input class="form-check-input required-input" type="radio" id="no" name="pwd"
			                           onclick="togglePwdFields(false)" value="N"
			                           th:checked="${form.pwd eq null or form.pwd.isEmpty()}">
			                    <label class="form-check-label" for="no">
			                        <span th:text="#{message.label.no}"></span>
			                    </label>
			                </div>
			            </div>
		            </th:block>
					<th:block th:if="${form.pwd != null}">
