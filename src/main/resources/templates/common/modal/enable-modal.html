<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="contents(headerText, bodyText)">
	<div th:replace="~{common/modal/simple-modal-template :: modal('enableModal', ~{::modalHeader}, ~{::modalBody}, 
		'success','fa-solid fa-thumbs-up', #{message.label.okay},true)}">
		<modalHeader>
			<th:block th:text="${headerText}"></th:block>!
		</modalHeader>
		<modalBody>
			<span th:text="${bodyText}"></span>
			<input id="dynamicId" type="hidden">
		</modalBody>
	</div>
</th:block>
