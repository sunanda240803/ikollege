<th:block th:fragment="tabs(feedback, studentEditStatus , messId)">
	<div class="col-lg-12 themeTabs">
	    <ul class="nav nav-tabs">
	        <!-- Student Edit Tab (Only clickable if studentEditStatus is true) -->
	        <li class="nav-item">
	            <a class="nav-link"
	               th:href="${studentEditStatus} ? @{|#{url.priority.mess.widget} + #{url.get.student.biodata}|} : 'javascript:void(0)'"
	               th:classappend="${studentEditStatus} ? 'active' : ''"
	               th:attr="tabindex=${studentEditStatus} ? '0' : '-1'"
				   th:onclick="showInfoModal('studentBioData',[[${studentEditStatus}]],[[${feedback}]],[[${messId}]])">
	                <span th:text="#{message.student.biodata}"></span>
	                <i th:if="${!studentEditStatus}" class="fa fa-check"></i>
	            </a>
	        </li>
	
	        <!-- Feedback Form Tab (Only clickable if studentEditStatus is false and feedback is 'Enable') -->
	        <li class="nav-item">
	            <a class="nav-link"
	               th:href="${studentEditStatus == false && feedback == 'Enable' && messId != 0 } ? @{|#{url.mess.feedback}|} : 'javascript:void(0)'"
				   th:classappend="${studentEditStatus == false && feedback == 'Enable' && messId != 0} ? 'active' : ''"
	               th:attr="tabindex=${studentEditStatus == false && feedback == 'Enable' && messId != 0} ? '0' : '-1'"
				   th:onclick="showInfoModal('feedBackForm',[[${studentEditStatus}]],[[${feedback}]],[[${messId}]])">
	               <span th:text="#{message.feedbackform}"></span>
	               <i th:if="${feedback == 'Disable'}" class="fa fa-check"></i>
	            </a>
	        </li>



	        <!-- Priority Mess Registration Tab (Only clickable if studentEditStatus is false and feedback 'Disable') -->
	        <li class="nav-item">
	            <a class="nav-link"
	               th:href="${studentEditStatus == false && (feedback == 'Enable' && messId == 0) || (feedback == 'Disable' && messId != 0)} ? @{|#{url.priority.mess.widget} + #{url.priority.mess.get}|} : 'javascript:void(0)'"
	               th:classappend="${studentEditStatus == false && (feedback == 'Enable' && messId == 0) || (feedback == 'Disable' && messId != 0) } ? 'active' : 'disabled-tab'"
	               th:attr="tabindex=${studentEditStatus == false && (feedback == 'Enable' && messId == 0) || (feedback == 'Disable' && messId != 0) } ? '0' : '-1'">
	               <span th:text="#{message.priority.mess.registration}"></span>
	            </a>
	        </li>
	    </ul>
	</div>
</th:block>
