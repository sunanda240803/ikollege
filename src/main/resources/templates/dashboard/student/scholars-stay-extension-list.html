<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>

<header th:replace="~{common/student-dashboard-header:: title(${headerForm},'MS/PHD Scholar Stay Extension','Dashboard', 'Add New',null,null,'Back','scholar-stay-extension-modal',#{url.dashboard}+#{url.student},null)}">
</header>

<!-- //Main-->
<main id="main" class="main">
    <div class="container mt-4" th:if="${!isGuideNameEmailPresent}">
        <div class="d-flex justify-content-center">
            <a href="javascript:void(0);" class="btn btn-warning text-center py-2 px-4" onclick="viewBioData()">
                <span th:text="#{message.label.guide.name.email.fill.note}"></span>
            </a>
        </div>
    </div>
    <input type="hidden" id="guideNameEmailPresent" th:value="${!isGuideNameEmailPresent}">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body">
                    <div class="table-responsive themeTable">
                        <table id="MyDataTable" class="table table-bordered  nowrap w-100">
                            <thead>
                            <tr>
                                <th th:text="#{message.label.submitted.date}"></th>
                                <th th:text="#{message.label.stay.from}"></th>
                                <th th:text="#{message.label.stay.to}"></th>
                                <th th:text="#{message.label.status}"></th>
                                <th class="text-center"  th:text="#{message.label.action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                th:each="scholarsStayExtension, iter: ${form.paginationList.getContent()}">
                                <td th:text="${#temporals.format(scholarsStayExtension.thesisSubmittedDate, #messages.msgOrNull('date.format'))}"></td>
                                <td th:text="${#temporals.format(scholarsStayExtension.stayFrom, #messages.msgOrNull('date.format'))}"></td>
                                <td th:text="${#temporals.format(scholarsStayExtension.stayTo, #messages.msgOrNull('date.format'))}"></td>
                                <td>
                                    <i class="fas fa-info-circle text-secondary"
                                       data-bs-toggle="tooltip" th:data-bs-title="${scholarsStayExtension.statusNotes}">
                                    </i>
                                    <th:block th:include="common/template/approval-status-badge :: statusBadge(${scholarsStayExtension.status},null)"></th:block>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center">
                                        <button type="button" th:if="${scholarsStayExtension.status == 'Validating' || scholarsStayExtension.status == 'Pending'}" class="btn btn-outline-warning btn-sm edit me-2"
                                                data-bs-toggle="tooltip" onclick="scholarsStayExtensionResendMail(this);"
                                                th:data-extension-id="${scholarsStayExtension.id}"
                                                th:data-bs-title="#{message.button.resend.mail}">
                                            <i class="fa-solid fa-paper-plane"></i>
                                        </button>
                                        <button type="button" class="btn btn-sm btn-outline-bluegray me-2"
                                                data-bs-toggle="tooltip"
                                                th:data-extension-id="${scholarsStayExtension.id}"
                                                onclick="scholarsStayExtensionView(this);"
                                                th:data-bs-title="#{message.button.view}">
                                            <i class="fa-solid fa-eye"></i>
                                        </button>
                                        <!--<button type="button" th:if="${scholarsStayExtension.status == 'Validating'}" class="btn btn-outline-secondary btn-sm cancel"
                                                data-bs-toggle="tooltip" onclick="scholarsStayExtensionCancel(this);"
                                                th:id="${scholarsStayExtension.id}"
                                                th:data-extension-id="${scholarsStayExtension.id}"
                                                th:data-bs-title="#{message.button.cancel}">
                                            <i class="fa-solid fa-ban fa-lg"></i>
                                        </button>
                                        <button type="button" th:if="${scholarsStayExtension.status == 'Approved'}" class="btn btn-outline-secondary btn-sm cancel"
                                                data-bs-toggle="tooltip" onclick="scholarsStayExtensionCancel(this);"
                                                th:id="${scholarsStayExtension.id}"
                                                th:data-extension-id="${scholarsStayExtension.id}"
                                                th:data-bs-title="#{message.button.approved.cancel}">
                                            <i class="fa-solid fa-ban fa-lg"></i>
                                        </button>-->
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                <td colspan="12" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- //Main-->

<!-- Modal-->
<div th:id="modalDiv"></div>
<div th:id="modalViewDiv"></div>
<div th:id="modalCancelDiv"></div>
<div th:id="modalResendEmailDiv"></div>
<th:block th:replace="~{common/modal/thesis-submitted-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.thesis.option})}">
</th:block>

<!-- Cancel Modal-->
<th:block th:replace="~{common/modal/cancel-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.cancel.submission})}">
</th:block>
<!-- //Cancel Modal-->

<!-- Resend Email Modal-->
<th:block th:replace="~{common/modal/resend-mail-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.resend.email.submission})}">
</th:block>
<!-- //Resend Email Modal-->



<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/dashboard/student/scholars-stay-extension.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.scholars.stay.extension}]]*/ '';
        const getURL = /*[[#{url.get.form}]]*/ '';
        const getViewURL = /*[[#{url.get.view}]]*/ '';
        const getResendMailURL = /*[[#{url.get.resend.mail}]]*/ '';
        const getCancelURL = /*[[#{url.get.cancel}]]*/ '';
        const otherLoginURL = /*[[#{url.other.login}]]*/ '';
        const getStudentRegistrationURL = /*[[#{url.student.registration}]]*/ '';
        const getStudentRegistrationURLSuffix = /*[[#{url.get}]]*/ '';
    </script>

</th:block>
<!-- //Footer-->
</body>
</html>
