<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>
<body>
	<!-- <header th:replace="~{common/header:: title(${headerForm})}"></header> -->
	<header th:replace="~{common/student-dashboard-header:: title(${headerForm},'Student Registration','Dashboard', null,null,null,null,null,#{url.dashboard}+#{url.student},null)}">
	</header>

<!-- //Main-->
<main id="main" class="main">
	<div class="row">
		<div class="col-lg-12">
			<div class="card main-card mt-4">
				<div class="card-body">
					<th:block th:insert="~{common/priority-mess-tabs::tabs(feedback='Enable',studentEditStatus=true,messId=0)}"></th:block>
					<form class="themeForm g-3 needs-validation" th:object="${form}" method="post"
						  th:action="@{#{url.priority.mess.widget}+#{url.student.biodata.registration}}" enctype="multipart/form-data">
						<div class="row mt-3">
							<div class="col-lg-12">
								<h2 class="tmsub-title"><span th:text="#{message.label.instructions}"></span></h2>
							</div>
						</div>
						<!-- student-biodata.html -->
						<th:block th:insert="~{common/template/student-registration-common :: content}"></th:block>

					</form>
				</div>
			</div>
		</div>
	</div>
</main>

<th:block th:insert="~{common/template/student-registration-common-modal :: modalContent}"></th:block>

<!-- Footer-->
<th:block th:replace="~{common/footer2 :: scripts(~{::script}, ${footerForm})}">
	<script th:src="@{/assets/js/base/jquery.inputmask.min.js}"></script>
	<script th:src="@{/assets/js/student-registration.js}"></script>
	<script th:src="@{/assets/js/common/login-registration.js}"></script>
	<script th:inline="javascript">
		const baseURL = /*[[#{url.student.registration}]]*/ '';
		const validateStudentIdURL = /*[[#{url.validate.student.id}]]*/ '';
	</script>

</th:block>
<!-- //Footer-->
</body>

</html>
