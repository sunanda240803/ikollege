<!DOCTYPE html>
<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>
<body>
	<header th:replace="~{common/student-dashboard-header:: title(${headerForm},'Mess Feedback','Dashboard', null,null,null,null,null,#{url.dashboard}+#{url.student},null)}">
	</header>
	<!-- //Main-->
	<main id="main" class="main">
	<div class="row">
		<div class="col-lg-12">
			<div class="card main-card mt-4">
				<div class="card-body">
					<th:block th:insert="~{common/priority-mess-tabs::tabs(feedback='Enable',studentEditStatus=false,messId=${messId})}"></th:block>
					<form class="themeForm needs-validation" id="feedbackForm" th:action="@{#{url.mess.feedback}}" method="POST" th:object="${feedbackList}">
						<div class="mb-4 mt-4">
						        <div class="table-responsive themeTable">
						            <table class="table table-bordered nowrap w-100">
						                <thead>
						                    <tr>
						                        <th th:text="#{message.label.description}"></th>
						                        <th th:each="qualifier : ${feedbackList.qualifiers}"
						                            th:text="${qualifier.feedbackDesc + ' (' + qualifier.feedbackPoints + ' points)'}" ></th>
						                    </tr>
						                </thead>
						                <tbody>
						                    <tr th:each="feedbackQuestion, iter : ${feedbackList.questions}">
						                        <td th:text="${feedbackQuestion.feedbackQuesDesc}"></td>
						                        <td class ="text-center" th:each="qualifier, qualIndex : ${feedbackList.qualifiers}">
						                            <input type="radio" class="form-check-input"
						                                   th:name="|questions[${iter.index}].selectedQualifier|" 
						                                   th:value="${qualifier.feedbackPoints}" />
						                            <!-- Hidden fields -->
						                            <input type="hidden" 
						                                   th:name="|questions[${iter.index}].feedbackWeightage|" 
						                                   th:value="${feedbackQuestion.feedbackWeightage}" />
						                            <input type="hidden" 
						                                   th:name="|questions[${iter.index}].feedbackQuesId|" 
						                                   th:value="${feedbackQuestion.feedbackQuesId}" />
						                        </td>
						                    </tr>
						                </tbody>
						            </table>
						        </div>
						    </div>
						    
							<input type="hidden" th:if="${messDetails != null}" th:name="messMasterId" th:value="${messDetails.messId}"/>
							<input type="hidden" th:if="${messDetails != null}"  th:name="messControllerId" th:value="${messDetails.id}"/>
							<input type="hidden" th:if="${messDetails != null}" th:name="month" th:value="${messDetails.month}"/>
	
						    <!-- Button Section -->
						    <hr>
						    <div class="row text-end">
						        <div class="col-lg-12 mt-2 mb-4">
						            <div class="d-flex align-items-center justify-content-end">
						                <a type="button" class="btn btn-secondary px-4 me-3" id="cancel" th:href="@{#{url.dashboard} + #{url.student}}">
						                    <i class="fa-solid fa-circle-arrow-left me-1"></i>
						                    <span th:text="#{message.button.cancel}"></span>
						                </a>
						                <button type="submit" class="btn btn-tmPrimary px-4" id="feedBackSave">
						                    <i class="fa-solid fa-floppy-disk me-1"></i>
						                    <span th:text="#{message.button.submit.form}"></span>
						                </button>
						            </div>
						        </div>
						    </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/dashboard/student/student-priority-mess-reg.js}"></script>
		<script th:inline="javascript">
			const feedbackValidation = /*[[${#messages.msg('message.validation.mess.feedback')}]]*/'';
		</script>
	
	</th:block>
	<!-- Footer-->
</body>

</html>
