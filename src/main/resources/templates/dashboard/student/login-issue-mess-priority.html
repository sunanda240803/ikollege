<!DOCTYPE html>
<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>
<body>
<header th:replace="~{common/student-registration-header:: title('Login Issue Mess Registration','', '/login','new')}">
</header>*
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body">
						<form class="themeForm " id="loginIssueForm" th:action="@{#{url.login.issue.mess.reg}+#{url.login.issue.save}}" method="POST"
							th:object="${messPriorityRegDto}" >

							<div class="row mt-4">
								<div class="col-lg-12">
									<h2 class="tmsub-title">
										<span th:text="#{message.label.mess.details}"></span>
									</h2>
								</div>
							</div>

							<div class="row">
								<div class="col-lg-4">
									<label class="form-label">
										<span th:text="#{message.label.mess.period}"></span>
									</label>
									<div class="form-control form-graybox" th:text="${dinningFromDate} + ' to ' + ${dinningToDate}"></div>
								</div>
							</div>

							<div class="studentDetails">
								<div class="row mt-4">
									<div class="col-lg-12">
										<h2 class="tmsub-title">
											<span th:text="#{message.label.iitm.student.details}"></span>
										</h2>
									</div>
								</div>
								<div class="row mb-3">
									<div class="col-lg-3 mb-3">
										<label for="studentId" class="form-label">
											<span th:text="#{message.label.studentID}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}"/>
										</label>
										<input type="text" class="form-control required-input" id="studentId"
											   oninput="this.value = this.value.toUpperCase()" onblur="validateAndFetchStudent()"
											   th:placeholder="#{message.placeholder.student.id}" th:name="id.studentId" required>
										<div class="invalid-feedback backendErrors" th:errors="*{id.studentId}"></div>
										<div class="invalid-feedback-frontEnd"
											 th:text="#{message.label.validation.student.id.is.required}"></div>
									</div>
									<div class="col-lg-3 mb-3">
										<label for="studentName" class="form-label">
											<span th:text="#{message.label.studentName}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}"/>
										</label>
										<div class="form-control form-graybox" id="studentName"></div>
										<!--<input type="text" class="form-control required-input" id="studentName" th:name="studentName"
											   th:placeholder="#{message.placeholder.student.name}">
										<div class="invalid-feedback backendErrors" th:errors="*{studentName}"></div>
										<div class="invalid-feedback-frontEnd"
											 th:text="#{message.validation.student.details.name}"></div>-->
									</div>
									<div class="col-lg-3 mb-3">
										<label for="hostelName" class="form-label">
											<span th:text="#{message.label.hostel}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}"/>
										</label>
										<div class="form-control form-graybox" id="hostelName"></div>
										<!--<select class="form-select required-input" data-live-search="true" th:name="hostelId"
												id="hostelName" >
											<option value="" th:text="#{message.label.select}+' '+#{message.label.hostel.name}"></option>
											<option th:each="hostel: ${hostels}" th:value="${hostel.id}" th:text="${hostel.hostelName}"></option>
										</select>
										<div class="invalid-feedback backendErrors" th:errors="*{hostelId}"></div>
										<div class="invalid-feedback-frontEnd" th:text="#{message.validation.hostel.name.required}"></div>-->
									</div>
									<div class="col-lg-3 mb-3">
										<label for="roomNo" class="form-label">
											<span th:text="#{message.label.roomNo}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}"/>
										</label>
										<div class="form-control form-graybox" id="roomNo"></div>
										<!--<input type="text" class="form-control required-input numeric" id="roomNo" maxlength="7"
											   th:placeholder="#{message.placeholder.room.no}" th:name="roomNo">
										<div class="invalid-feedback backendErrors" th:errors="*{roomNo}"></div>
										<div class="invalid-feedback-frontEnd" th:text="#{message.validation.room.no.required}"></div>-->
									</div>

									<div class="col-lg-3 mb-3">
										<label class="form-label">
											<span th:text="#{message.label.gender}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}" />
										</label>
										<div class="form-control form-graybox" id="genderId"></div>
										<!--<div class="checkRadio-bg form-control" id="genderChecks">
											<div class="form-check form-check-inline">
												<input class="form-check-input required-input" type="radio" value="M" id="male"
													   name="gender" required>
												<label class="form-check-label" for="male"><span th:text="#{message.label.male}"></span></label>
											</div>
											<div class="form-check form-check-inline">
												<input class="form-check-input required-input" type="radio" value="F" id="female"
													   name="gender" required>
												<label class="form-check-label" for="female"><span th:text="#{message.label.female}"></span></label>
											</div>
										</div>
										<div class="invalid-feedback"><span th:text="#{message.validation.student.details.gender}"></span></div>-->

									</div>
									<div class="col-lg-3 mb-3">
										<label class="form-label">
											<span th:text="#{message.login.problem}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}" />
										</label>
										<textarea class="form-control required-input" id="loginProblemId"
												  th:placeholder="#{message.login.problem}" th:name="description" required></textarea>
										<div class="invalid-feedback backendErrors" th:errors="*{description}"></div>
										<div class="invalid-feedback-frontEnd" th:text="#{message.login.problem.required}"></div>
									</div>
									<div class="col-lg-3 mb-3">
										<img id="captcha" width="200" src="" alt="Captcha image" onerror="this.src='assets/img/default.png';">
										<a href="javascript:void(0)" class="captchaBox ml-4"
										   onclick="getCaptchaCode();">
											<i data-toggle="tooltip" title="Reset Captcha" class="fas fa-redo-alt"></i></a>

										<label class="form-label"> <span th:text="#{message.label.captcha.code}"></span>
											<th:block th:replace="~{common/template/mandatory-symbol}" />
										</label>
										<input type="text" class="form-control required-input" th:placeholder="#{message.placeholder.captcha.code}"
											   id="captchaCode" required>
										<span class="captchaError text-danger"></span>
										<div class="invalid-feedback" th:text="#{message.validation.captcha.code.required}"></div>
									</div>

								</div>
							</div>

							<div id="messPreferenceContainer">
								<div id="messInnerContainer">
									<th:block th:replace="~{dashboard/student/login-issue-mess-list-fragment :: messListFragment(${messRegistrationList})}"></th:block>
								</div>
							</div>

							<div id="loadingSpinner" style="display:none; text-align:center;">
								<div class="spinner-border" role="status">
									<span class="visually-hidden">Loading...</span>
								</div>
							</div>

							<!--Button Section-->
							<div class="row text-end ">
								<div class="col-lg-12 mb-4">
									<div class="d-flex align-items-center justify-content-end">
										<a type="button" class="btn btn-secondary px-4 me-3" id="cancel" th:href="@{#{url.dashboard} + #{url.student}}">
											<i class="fa-solid fa-circle-arrow-left me-1"></i>
											<span th:text="#{message.button.cancel}"></span>
										</a>
										<button type="button" class="btn btn-aqua px-4" id="loginIssueSave" >
											<i class="fa-solid fa-floppy-disk me-1"></i>
											<span th:text="#{message.button.save}"></span>
										</button>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>

	<th:block th:replace="~{common/modal/info-modal :: contents(id = null, headerText=#{message.label.information},bodyText=#{message.label.information})}"></th:block>

	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
	    <script th:inline="javascript">
			const baseUrl = /*[[#{url.login.issue.mess.reg}]]*/ '';
            const studentInfoURL = /*[[#{url.student}]]*/'';
            const checkMessPeriod = /*[[#{url.get.mess.period}]]*/ '';
			const CAPTCHA_URL=/*[[#{url.captcha}]]*/'';
			const messValidationMsg = /*[[${#messages.msg('message.validation.mess.preference')}]]*/'';
	    </script>
		<script th:src="@{/assets/js/landing-page.js}"></script>
		<script th:src="@{/assets/js/dashboard/student/student-priority-mess-reg.js}"></script>
	</th:block>	
	<!-- Footer-->
</body>

</html>
