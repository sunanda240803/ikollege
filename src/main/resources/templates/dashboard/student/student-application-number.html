<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} ">
</head>
<body>
	<!-- <header th:replace="~{common/header:: title(${headerForm})}"></header> -->
	<header th:replace="~{common/student-dashboard-header:: title(${headerForm},'Student Registration','Dashboard', null,null,null,null,#{url.dashboard}+#{url.student},null)}">
	</header>

<!-- //Main-->
<main id="main" class="main">
	<div class="row">
		<div class="col-lg-12">
			<div class="card main-card mt-4">
				<div class="card-body themeForm">
					<th:block th:insert="~{common/priority-mess-tabs::tabs(feedback='Enable',studentEditStatus=true,messId=0)}"></th:block>
						<!-- <form class="themeForm g-3 needs-validation" th:object="${form}" method="post"
						  th:action="@{#{url.applicationNo.exists}}"> -->
						<div class="row mb-3">
							<div class="col-lg-12">
								<div class="row mt-3">
									<div class="col-lg-3 mb-3">
										<label class="form-label" for="applicationNumber">
											<span th:text="#{message.label.application.no}"></span>
										</label>
										<input type="text" name="applicationNumber" id="applicationNumber"
											   class="form-control uppercase required-input" th:placeholder="#{message.placeholder.application.no}"
											   maxlength="12" required>
										<div class="invalid-feedback">
											<span th:text="#{message.validation.applicationNo}"></span>
										</div>
									</div>
									<div class="col-lg-3 mb-3 mt-3">
										<button type="button" class="btn btn-tmPrimary px-4 me-4 mt-3" id="saveForm"
											onclick="return validateApplicationNo();">
											<i class="fa-solid fa-arrow-pointer me-1"></i>
											<span th:text="#{message.button.submit.form}"></span>
										</button>
									</div>
								</div>
							</div>
						</div>
					<!-- </form> -->
				</div>
			</div>
		</div>
	</div>
</main>
<th:block th:replace="~{common/modal/success-modal ::
    contents(headerText=#{message.label.confirmation}, bodyText=#{message.label.forgot.password.success})}">
</th:block>
<!-- Footer-->
<th:block th:replace="~{common/footer2 :: scripts(~{::script}, ${footerForm})}">
	<script th:src="@{/assets/js/base/jquery.inputmask.min.js}"></script>
	<script th:src="@{/assets/js/student-registration.js}"></script>
	<script th:src="@{/assets/js/common/login-registration.js}"></script>
	<script th:inline="javascript">
		//const baseURL = /*[[#{url.student.registration}]]*/ '';
		const validateApplicationURL = /*[[#{url.applicationNo.exists}]]*/ '';
		const getTabURL = /*[[#{url.priority.get.tab}]]*/ '';
	</script>

</th:block>
<!-- //Footer-->
</body>

</html>
