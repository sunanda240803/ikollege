<!-- Forgot Password Module -->
<div
        th:replace="~{common/modal-template :: modal('forgotPassword', ~{::modalHeader}, ~{::modalBody}, Cancel, null, Save,
        null, 'md')}">
    <modalHeader>
        <span th:text="#{message.label.forgot.password.modal}"></span>
    </modalHeader>
    <modalBody>
            <form class="themeForm" id="forgotPasswordForm">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-lg-12 mb-3">
                            <label class="form-label" for="applicantEmail"><span th:text="#{message.label.email.id}"></span>
                                <th:block th:replace="~{common/template/mandatory-symbol}" />
                            </label>
                            <input type="text" class="form-control required-email" name="applicantEmail" id="applicantEmail"  th:placeholder="#{message.placeholder.reg.email.id}">
                            <div class="invalid-feedback" th:text="#{message.validation.email.id.required}"></div>
                            <div class="invalid-req-feedback d-none"><span th:text="#{message.validation.email.id.required}"></span></div>
                            <div class="invalid-valid-feedback d-none" th:text="#{message.validation.invalid.registered.email.id}"></div>
                        </div>
                    </div>
                </div>
            </form>
</modalBody>
</div>
