<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get" id="messAllottedListFormList" th:object="${messAllottedList}">
							<div class="row mb-4">
								<div class="col-lg-3 mb-3">
									<label for="messPeriodId" class="form-label"> 
										<span th:text="#{message.label.mess.allotted.list.period}"></span>
									</label>
					              	<select id="messPeriod" class="form-select" th:field="*{messPeriod}">
						                 <option value="" th:text="#{message.label.select}+' '+#{message.label.mess.allotted.list.period}"></option>
										<option th:each="messPeriod : ${messPeriodList}"
											th:value="${messPeriod.id}"
											th:text="${#temporals.format(messPeriod.diningFromDate, #messages.msg('date.format'))} +' to ' +
						               	 	${#temporals.format(messPeriod.diningToDate, #messages.msg('date.format'))}">
										</option>
									</select>
								</div>
								<div class="col-lg-3 mb-3">
									<label for="messListName" class="form-label">
										<span th:text="#{message.label.mess.name}"></span>
									</label> 
					              	<select id="messName" class="form-select" th:field="*{messName}">
						                 <option value="" th:text="#{message.label.select}+' '+#{message.label.mess.name}"></option>
										<option th:each="messMaster : ${messMasterList}"
											th:value="${messMaster.id}" th:text="${messMaster.messName}">
										</option>
									</select>
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"> <span
										th:text="#{message.label.student.name}"></span>
									</label> 
									<input type="text" class="form-control" id="studentName" th:field="*{studentName}"
										th:placeholder="#{message.placeholder.student.name}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label">
										<span th:text="#{message.label.student.id}"></span>
									</label> 
									<input type="text" id="studentId" class="form-control" th:field="*{studentId}" 
										th:placeholder="#{message.placeholder.student.id}">
								</div>
								<div class="col-auto mt-3">
									<input type="hidden" id="pageVal" th:value="${form.pageVal}"/>
									<input type="hidden" id="sizeVal" th:value="${form.size}"/>
									<button id="getData" class="btn btn-lgtblue mt-3" type="button"
										onclick="getMessAllottedList('get')">
										<i class="fa-solid fa-database"></i>
										<span th:text="#{message.label.get.data}"></span>
									</button>
								</div>
							</div>
						</form>
						<div class="mb-4">
							<div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
							<div class="table-responsive themeTable">
								<table id="studentLoginTable"
									class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th th:text="#{message.label.student.id}"></th>
											<th th:text="#{message.label.student.name}"></th>
											<th th:text="#{message.label.from.date}"></th>
											<th th:text="#{message.label.to.date}"></th>
											<th th:text="#{message.label.mess.name}"></th>
											<th th:text="#{message.label.mess.status}"></th>
											<th th:text="#{message.label.description}"></th>
											<th class="text-center" th:text="#{message.label.action}"></th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											th:each="messAllotted, iter : ${form.paginationList.getContent()}">
											<td>
												<span th:text="${messAllotted.studentId}"></span>
											</td>
								    		<td>
												<span th:text="${messAllotted.studentName}"></span>
											</td>
								    		<td>
												<span th:text="${#temporals.format(messAllotted.changeFromDate, #messages.msg('date.format'))}"></span>
											</td>
								    		<td>
												<span th:text="${#temporals.format(messAllotted.changeToDate, #messages.msg('date.format'))}"></span>
											</td>
								    		<td>
												<span th:text="${messAllotted.messName}"></span>
											</td>
								    		<td>
												<span th:text="${messAllotted.messStatus}"></span>
											</td>
								    		<td>
												<span th:text="${messAllotted.description}"></span>
											</td>
											<td class="text-center">
												<div class="d-flex justify-content-center">
												<th:block th:if="${messAllotted.toChange == 
													T(com.iitm.hosteldine.constant.dashboard.student.WorkflowStatus).SHOW.status}">
													<button type="button"
														class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" data-bs-title="Mess Change"
														th:data-id="${messAllotted.id}"
														onclick="messConfig(this, 'change');">
														<i class="fa-solid fa-refresh"></i>
													</button>
												</th:block>
												<th:block th:if="${messAllotted.toRemove == 
													T(com.iitm.hosteldine.constant.dashboard.student.WorkflowStatus).SHOW.status}">
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" data-bs-title="To Remove"
														th:data-id="${messAllotted.id}"
														onclick="messConfig(this, 'remove');">
														<i class="fa fa-ban"></i>
													</button>
												</th:block>
												</div>
											</td>
										</tr>
								    	<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="7" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
						<input type="hidden" th:value="${returnId}" id="returnId">
						<input type="hidden" th:value="${returnType}" id="returnType">
					</div>
				</div>
			</div>
		</div>
	</main>
	<div th:id="modalDiv"></div>
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/mess/mess-allotted.js}"></script>
		<script th:inline="javascript">
      		const baseURL = /*[[#{url.mess.allotted.list}]]*/ '';
      		const messConfigURL = /*[[#{url.mess.allotment.configuration}]]*/ '';
      		const studentURL = /*[[#{url.student}]]*/ '';
      		const checkStudentInMessPeriodURL = /*[[#{url.student.in.mess.period}]]*/ '';
      		const studentMessListURL = /*[[#{url.student.in.mess.list}]]*/ '';
      		const downloadReportURL = /*[[#{url.download.mess.allotted.list.report}]]*/ '';
    	</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
