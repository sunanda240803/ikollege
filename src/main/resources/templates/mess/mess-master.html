<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->

	<!-- //Main-->
	<main id="main" class="main">
		<!--School Info Section-->
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Mess Name,Floor Name, Description and Mess Head to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="*{form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
						<div class="mb-4">
							<div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
							<div class="table-responsive themeTable " id="myTable">
								<table id="messMasterTable" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th><span th:text="#{message.label.mess.name}"></span></th>
											<th><span th:text="#{message.label.floor.name}"></span></th>
											<th><span th:text="#{message.label.description}"></span></th>
											<th class="text-center"><span th:text="#{message.label.mess.head}"></span></th>
											<th class="text-center"><span th:text="#{message.label.capacity}"></span></th>
											<th class="text-center"><span th:text="#{message.label.girls.threshold.count}"></span></th>
											<th class="text-center"><span th:text="#{message.label.food.court}"></span></th>
											<th class="text-center"><span th:text="#{message.label.food.court.amount}"></span></th>
											<th class="text-center"><span th:text="#{message.label.sick.food}"></span></th>
											<th class="text-center"><span th:text="#{message.online.coupon}"></span></th>
											<th class="text-center"><span th:text="#{message.label.action}"></span></th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											th:each="messInfo, iter: ${form.paginationList.getContent()}">
											<td th:text="${messInfo.messName}"></td>
											<td th:text="${messInfo.messFloorName}"></td>
											<td th:text="${messInfo.description}"></td>
											<td class="text-center" th:text="${messInfo.messHead}"></td>
											<td class="text-center" th:text="${messInfo.capacity}"></td>
											<td class="text-center" th:text="${messInfo.girlsThresholdCount}"></td>
											<td class="text-center">
												<th:block th:if="${messInfo.isFoodCourt == true}">
													<i class="fa-solid fa-check" style="color: green;"></i>
												</th:block>
												<th:block th:if="${messInfo.isFoodCourt != true}">
													<i class="fa fa-times" aria-hidden="true" style="color: red;"></i>
												</th:block>
											</td>
											<td class="text-center" th:text="${#numbers.formatDecimal(messInfo.foodCourtAmount, 1, 'NONE', 2, 'POINT')}"></td>
											<td class="text-center">
												<th:block th:if="${messInfo.sickFoodAvail ==true}">
													<i class="fa-solid fa-check" style="color: green;"></i>
												</th:block>
												<th:block th:if="${messInfo.sickFoodAvail !=true}">
													<i class="fa fa-times" aria-hidden="true" style="color: red;"></i>
												</th:block>
											</td>
                                            <td class="text-center">
												<th:block th:if="${messInfo.onlineCoupon ==true}">
													<i class="fa-solid fa-check" style="color: green;"></i>
												</th:block>
												<th:block th:if="${messInfo.onlineCoupon !=true}">
													<i class="fa fa-times" aria-hidden="true" style="color: red;"></i>
												</th:block>
											</td>
											<td class="text-center">
												<div class="d-flex justify-content-center">
													<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip"
														th:data-mess-id="${messInfo.id}"
														onclick="editMessInfo(this);" data-bs-title="Edit">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip"
														th:id="${'deleteReq_'+messInfo.id}"
														onclick="deleteMessInfo(this);"
														th:data-mess-id="${messInfo.id}"
														data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button>
												</div>
											</td>
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="8" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>



	<div th:id="modalDiv"></div>

	<th:block
		th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
	</th:block>


	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/mess/mess-master.js}"></script>
		<script th:inline="javascript">
			const baseURL = /*[[#{url.mess.master}]]*/ '';
			const checkMessNameExistURL = /*[[#{url.exist}]]*/ '';
			const checkMessHeadExistURL = /*[[#{url.mess.head.exist}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
