<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <form action="#" method="get">
                        <div class="row mb-3">
                            <div class="col-auto">
                                <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                                    <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                       th:data-bs-title="#{message.bs.title.mess.period.config}"></i>
                                </label>
                                <input type="text" class="form-control" name="search" id="search"
                                       th:field="*{form.search}">
                            </div>
                            <div class="col-auto mt-3">
                                <button class="btn btn-secondary mt-4" type="submit">
                                    <span th:text="#{message.label.search}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="mb-4">
                        <div class="table-responsive themeTable">
                            <table id="HostelListDataTable" class="table table-bordered nowrap w-100">
                                <thead>
                                <tr>
                                    <th>
                                        <span th:text="#{message.label.month.name}"></span>
                                    </th>
                                    <th>
                                        <span th:text="#{message.label.dining.from.date}"></span>
                                    </th>
                                    <th>
                                        <span th:text="#{message.label.dining.to.date}"></span>
                                    </th>
                                    <th>
                                        <span th:text="#{message.label.registration.start.date}"></span>
                                    </th>
                                    <th>
                                        <span th:text="#{message.label.registration.end.date}"></span>
                                    </th>
                                    <th class="text-center">
                                        <span th:text="#{message.label.action}"></span>
                                    </th>
                                </tr>
                                </thead>
                                <tbody th:with="dateFormat=#{date.format}">
                                <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="messController : ${form.paginationList.getContent()}">
                                    <td th:text="${messController.month}"></td>
                                    <td th:text="${#temporals.format(messController.diningFromDate, dateFormat)}">
                                    </td>
                                    <td th:text="${#temporals.format(messController.diningToDate, dateFormat)}">
                                    </td>
                                    <td th:text="${#temporals.format(messController.regBeginDate, dateFormat)}">
                                    </td>
                                    <td th:text="${#temporals.format(messController.regEndDate, dateFormat)}">
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex justify-content-center" th:if="${messController.currentActiveFlag eq 'Y'}">
                                            <a th:href="@{#{url.mess.period.config}+'/'+${messController.id}}"
                                               class="btn btn-outline-primary btn-sm me-2"
                                               data-bs-toggle="tooltip" data-bs-title="Edit">
                                                <i class="fa-solid fa-pencil"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="6" class="text-center">
                                        <span th:text="#{message.label.no.data.available}"></span>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer-->
<th:block
        th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/mess/mess-period-config.js}"></script>
</th:block>

<script th:inline="javascript">
    const baseURL = /*[[#{url.mess.period.config}]]*/'';
</script>
</body>
</html>
