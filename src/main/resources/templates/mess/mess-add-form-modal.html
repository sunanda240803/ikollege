<div th:replace="~{common/modal-template :: modal('mess-allotment-configuration-modal', ~{::modalHeader}, ~{::modalBody}, Cancel, null, Update, null, 'lg')}">
	<modalHeader> <span id="modalHeaderText"></span> </modalHeader>
	<modalBody>
	<form class="themeForm" th:action="@{#{url.mess.allotted.list}+#{url.mess.allotment.configuration}}" method="post"
		th:object="${messAllottedListDTO}" id="messAllotedListForm">
		<div class="row">
			<div class="col-lg-12 mb-3 bg-primary text-bg-primary p-2 fw-bold text-center">
				<span th:text="#{message.label.mess.period.colon} + ' ' +
					${#temporals.format(currentMessPeriod.diningFromDate, #messages.msg('date.format'))}
					+ ' ' + #{message.label.to} + ' ' +
					${#temporals.format(currentMessPeriod.diningToDate, #messages.msg('date.format'))}">
				</span>
			</div>
		</div>
		<div class="row">
			<!-- Student Id -->
			<div class="col-lg-6 mb-3">
				<label class="form-label"> 
					<span th:text="#{message.label.student.id}"></span> 
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<div class="form-control form-graybox toggle-common-mess">
					<span th:text="*{studentId}">
				</div>
				<input type="text" class="form-control required-input toggle-change-mess-input" id="studentIdModal" th:field="*{studentId}"
					th:placeholder="#{message.placeholder.student.id}" required onblur="checkStudentInMessPeriod()"
					th:classappend="${#fields.hasErrors('studentId')} ? 'is-invalid' : ''">
                <div class="invalid-feedback backendErrors" th:errors="*{studentId}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.label.validation.student.id.is.required}"></div>
				<div class="invalid-req-feedback d-none" th:text="#{message.label.validation.student.id.is.required}"></div>
				<div class="invalid-exist-feedback d-none" th:text="#{message.validation.student.already.added.mess.period}"></div>
				<div class="invalid-not-exist-feedback d-none" th:text="#{message.label.validation.student.id.exist}"></div>
			</div>
			<!-- Student Name -->
			<div class="col-lg-6 mb-3">
				<label class="form-label"> 
					<span th:text="#{message.label.student.name}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<th:block th:if="${studentMessDetails != null}">
					<div class="form-control form-graybox toggle-common-mess">
						<span th:text="${studentMessDetails.studentName}">
					</div>
				</th:block>
				<div class="form-control form-graybox toggle-change-mess-input">
					<span id="studentNameModal">
				</div>
			</div>

			<!-- From Date -->
			<div class="col-lg-6 mb-3">
				<label class="form-label">
					<span th:text="#{message.label.from.date}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<th:block th:if="${studentMessDetails != null}">
					<div class="form-control form-graybox toggle-common-mess">
						<span th:text="${#temporals.format(studentMessDetails.changeFromDate, #messages.msg('date.format'))}">
					</div>
					<input type="hidden" name="fromDate" th:value="${studentMessDetails.changeFromDate}" id="currentFromDate">
				</th:block>
				<input type="date" class="form-control toggle-change-mess-input" id="fromDate" th:field="*{fromDate}" required
					th:classappend="${#fields.hasErrors('fromDate')} ? 'is-invalid' : ''">
                <div class="invalid-feedback backendErrors" th:errors="*{fromDate}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.from.date.required}"></div>
				<div class="invalid-req-feedback d-none" th:text="#{message.validation.from.date.required}"></div>
				<div class="invalid-range-feedback d-none" th:text="#{message.validation.you.selected.out.of.mess.period}"></div>
			</div>

			<!-- To Date -->
			<div class="col-lg-6 mb-3">
				<label class="form-label"> 
					<span th:text="#{message.label.to.date}"></span> 
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<th:block th:if="${studentMessDetails != null}">
					<div class="form-control form-graybox toggle-common-mess">
						<span th:text="${#temporals.format(studentMessDetails.changeToDate, #messages.msg('date.format'))}">
					</div>
					<input type="hidden" name="toDate" th:value="${studentMessDetails.changeToDate}" id="currentToDate">
				</th:block>
				<div class="form-control form-graybox toggle-change-mess-input">
					<span th:text="${#temporals.format(currentMessPeriod.diningToDate, #messages.msg('date.format'))}">
				</div>
			</div>

			<!-- Current Mess -->
			<div class="col-lg-6 mb-3 toggle-common-mess">
				<label class="form-label"> 
					<span th:text="#{message.label.current}+' '+#{message.label.mess}"></span>
				</label>
				<th:block th:if="${studentMessDetails != null}">
					<div class="form-control form-graybox">
						<span th:text="${studentMessDetails.messName}">
					</div>
				</th:block>
			</div>
			
			<!-- Change Mess To -->
			<div class="col-lg-6 mb-3 toggle-change-mess">
				<label class="form-label"> 
					<span th:text="#{message.label.change.mess.to}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<select class="form-select required-input toggle-change-mess"
					id="changeMessId" th:field="*{changeMessId}" required
					th:classappend="${#fields.hasErrors('changeMessId')} ? 'is-invalid' : ''">
					<option value="" th:text="#{message.label.select}+' '+#{message.label.mess.name}"></option>
					<option th:each="messMaster : ${messMasterList}"
						th:value="${messMaster.id}" th:text="${messMaster.messName}">
					</option>>
				</select>
                <div class="invalid-feedback backendErrors" th:errors="*{changeMessId}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.student.select.mess}"></div>
			</div>
			
			<!-- Mess -->
			<div class="col-lg-6 mb-3 toggle-change-mess-input">
				<label class="form-label"> 
					<span th:text="#{message.label.mess.name}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<select class="form-select required-input toggle-change-mess-input"
					id="messIdModal" th:field="*{messId}" required
					th:classappend="${#fields.hasErrors('messId')} ? 'is-invalid' : ''">
					<option value="" th:text="#{message.label.select}+' '+#{message.label.mess.name}"></option>
				</select>
                <div class="invalid-feedback backendErrors" th:errors="*{messId}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.student.select.mess}"></div>
			</div>

			<!-- Effective From Date -->
			<div class="col-lg-6 mb-3 toggle-change-mess">
				<label class="form-label">
					<span th:text="#{message.label.mess.allotted.list.effective.from.date}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label> 
				<input type="date" class="form-control required-input toggle-change-mess" 
					id="effectiveFromDate" th:field="*{effectiveFromDate}" required
					th:classappend="${#fields.hasErrors('effectiveFromDate')} ? 'is-invalid' : ''">
				<div class="invalid-feedback backendErrors" th:errors="*{effectiveFromDate}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.effective.from.date.required}"></div>
				<div class="invalid-req-feedback d-none" th:text="#{message.validation.effective.from.date.required}"></div>
				<div class="invalid-range-feedback d-none" th:text="#{message.validation.you.selected.out.of.mess.period}"></div>
				<div class="invalid-limit-feedback d-none" th:text="#{message.label.effective.date.period.limit}"></div>
			</div>

			<!-- Effective Till -->
			<div class="col-lg-6 mb-3 toggle-remove-mess">
				<label class="form-label">
					<span th:text="#{message.label.mess.allotted.list.effective.till}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label> 
				<input type="date" class="form-control required-input toggle-remove-mess"
					id="effectiveTill" th:field="*{effectiveTill}" required
					th:classappend="${#fields.hasErrors('effectiveTill')} ? 'is-invalid' : ''">
				<div class="invalid-feedback backendErrors" th:errors="*{effectiveTill}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.effective.till.required}"></div>
				<div class="invalid-req-feedback d-none" th:text="#{message.validation.effective.till.required}"></div>
				<div class="invalid-range-feedback d-none" th:text="#{message.validation.you.selected.out.of.mess.period}"></div>
				<div class="invalid-limit-feedback d-none" th:text="#{message.label.effective.date.period.limit}"></div>
			</div>

			<!-- Description -->
			<div class="col-lg-6 mb-3 toggle-common-mess">
				<label class="form-label">
					<span th:text="#{message.label.description}"></span>
					<th:block th:replace="~{common/template/mandatory-symbol}" />
				</label>
				<textarea class="form-control toggle-common-mess required-input" id="description" th:field="*{description}"
					th:placeholder="#{message.placeholder.description}" required
					th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''">
				</textarea>
				<div class="invalid-feedback backendErrors" th:errors="*{description}"></div>
				<div class="invalid-feedback-frontEnd" th:text="#{message.validation.mess.allotted.list.description}"></div>
			</div>
		</div>
		<input type="hidden" name="id" id="id">
		<input type="hidden" name="type" id="type">
		<input type="hidden" name="diningFromDate" th:value="${currentMessPeriod.diningFromDate}" id="diningFromDate">
		<input type="hidden" name="diningToDate" th:value="${currentMessPeriod.diningToDate}" id="diningToDate">
	</form>
	</modalBody>
</div>
