<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
	<link rel="stylesheet" th:href="@{/assets/css/mess/mess-session.css}">
</head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Mess Name and Session to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="*{form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
                   		
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="messSessionListDataTable" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th><span th:text="#{message.label.mess.name}"></span></th>
		                                    <th class="text-center"><span th:text="#{message.label.session}"></span></th>
		                                    <th class="text-center"><span th:text="#{message.label.start.time}"></span></th>
		                                    <th class="text-center"><span th:text="#{message.label.end.time}"></span></th>
                                    		<th class="text-center"><span th:text="#{message.label.action}"></span></th>
                                    	</tr>
									</thead>
									<tbody>
								    	<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}" 
								    		th:each="mess, iter: ${form.paginationList.getContent()}">
											<td th:text="${mess.messName}"></td>
											<td class="text-center" th:text="${mess.sessionCode}"></td>
											<td class="text-center" th:text="${mess.startTime}"></td>
											<td class="text-center" th:text="${mess.endTime}"></td>
											<td class="text-center"> 
											
												<div class="d-flex justify-content-center">
													<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" th:data-mess-id="${mess.id.messId}" 
														th:data-session-name="${mess.id.sessionName}"
														onclick="editMessSession(this);" data-bs-title="Edit">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" th:id="${'deleteReq_'+mess.id.messId+mess.id.sessionName}"
														onclick="deleteMessSession(this);"
														th:data-mess-id="${mess.id.messId}" 
														th:data-session-name="${mess.id.sessionName}" 
														data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button>
												</div>
											</td>
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="6" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:id="modalDiv"></div>

	<th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>

	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/mess/mess-session.js}"></script>

		<script th:inline="javascript">
			const baseURL = /*[[#{url.mess.session}]]*/ '';
			const checkMessAndSessionExistURL = /*[[#{url.mess.session.exist}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
