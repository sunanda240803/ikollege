<!-- Form Module -->
<div
	th:replace="~{common/modal-template :: modal('vendor-master-modal', ~{::modalHeader}, ~{::modalBody}, Cancel, null, Save, null, 'lg')}">
	<modalHeader>
		<span th:text="#{message.label.mess.vendor}"></span>
	</modalHeader>
	<modalBody>
		<!-- Facility Details Module -->

		<form class="themeForm" th:action="@{#{url.mess.vendor.master}+#{url.save}}" method="post" id="vendorMasterForm"
			th:object="${vendorMasterDto}">
			<div class="row g-3">
				<div class="col-lg-6">
					<label class="form-label" for="vendorCode"><span th:text="#{message.label.mess.vendor.code}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="hidden" class="form-control" th:value="${vendorMasterDto.vendorCode}" id="id">
					<input type="text" class="form-control required-input" th:field="*{vendorCode}" maxlength="7"
						th:placeholder="#{message.placeholder.mess.vendor.code}" oninput="validateAlphabetInputWithSpace(this);" required>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.code.required}"></div>
				</div>
				<div class="col-lg-6">
					<label class="form-label" for="vendorName"><span
							th:text="#{message.label.mess.vendor.name}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-input" th:field="*{vendorName}" maxlength="64"
						th:placeholder="#{message.placeholder.mess.vendor.name}" required>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.name.required}"></div>
				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="mobileNumber"><span
							th:text="#{message.label.mobile.number}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-mob-num" th:field="*{mobileNoMask}"  oninput=" validateNumberInput(this);" th:placeholder="#{message.placeholder.mobile.number}" required>
					<div class="invalid-feedback" th:text="#{message.validation.student.details.mob.no.required}"></div>
					<div class="invalid-req-feedback d-none"><span
							th:text="#{message.validation.student.details.mob.no.required}"></span></div>
					<div class="invalid-val-feedback d-none"><span
							th:text="#{message.validation.student.details.mob.no}"></span>
					</div>
				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="pinCode"><span th:text="#{message.label.mess.vendor.pin.no}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-input" th:field="*{pincode}" maxlength="7"
						oninput=" validateNumberInput(this);" th:placeholder="#{message.placeholder.mess.vendor.pin.no}"
						required>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.pin.no.required}"></div>
				</div>
				<div class="col-lg-12 mb-3">
					<label class="form-label" for="address"><span th:text="#{message.label.address}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<textarea rows="2" class="form-control required-input" th:field="*{address1}" maxlength="128"
						th:placeholder="#{message.placeholder.address}" required></textarea>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.address.required}"></div>
				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="contactPerson"><span
							th:text="#{message.label.mess.vendor.contact.person}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-input" th:field="*{contactPerson}" maxlength="30"
						th:placeholder="#{message.placeholder.mess.vendor.contact.person}" required>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.contact.person.required}"></div>

				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="email"><span th:text="#{message.label.email.id}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-email" th:field="*{email}" maxlength="64"
						th:placeholder="#{message.placeholder.email.id}" required>
					<div class="invalid-feedback" th:text="#{message.validation.email.id.required}"></div>
					<div class="invalid-req-feedback d-none"><span th:text="#{message.validation.email.id.required}"></span></div>
					<div class="invalid-valid-feedback d-none" th:text="#{message.validation.email.id}"></div>
				</div>
				
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="licenseNo"><span
							th:text="#{message.label.mess.vendor.license.no}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-input" th:field="*{licenseNo}" maxlength="64"
						th:placeholder="#{message.placeholder.mess.vendor.license.no}" required>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.license.no.required}"></div>
				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="licenseValidUpto"><span
							th:text="#{message.label.mess.vendor.license.valid.upto}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="date" class="form-control required-input" th:field="*{licenseValidUpto}" required
						onkeydown="return false">
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.license.validity.required}"></div>

				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" for="panNo"><span th:text="#{message.label.pan.no}"></span> <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
					<input type="text" class="form-control required-pan" th:field="*{panNo}" maxlength="10"
						oninput="validateAlphaNumericInput(this);getUpperCase(this);"
						th:placeholder="#{message.placeholder.pan.no}" required id="panNo">
					<div class="invalid-feedback" th:text="#{message.validation.student.details.pan}"></div>
				</div>
				<div class="col-lg-6 mb-3">
					<label class="form-label" style="white-space: nowrap;"><span
							th:text="#{message.label.mess.vendor.is.caterer}"></span>
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<div class="checkRadio-bg form-control">
						<div class="form-check form-check-inline me-4">
							<input class="form-check-input required-input" type="radio" th:field="*{isCaterer}" id="catererYes"
								value="yes" required>
							<label class="form-check-label" for="catererYes"><span th:text="#{message.label.yes}"></span></label>
						</div>
						<div class="form-check form-check-inline">
							<input class="form-check-input required-input" type="radio" th:field="*{isCaterer}" id="catererNo"
								value="no">
							<label class="form-check-label" for="catererNo"><span th:text="#{message.label.no}"></span></label>
						</div>
					</div>
					<div class="invalid-feedback" th:text="#{message.validation.mess.vendor.is.caterer.required}"></div>
				</div>
			</div>
		</form>
<script>
	$(document).ready(function () {
		document.getElementById('licenseValidUpto').min = new Date().toISOString().split("T")[0];
	});
</script>
</modalBody>
</div>
