<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
  <div class="row">
    <div class="col-lg-12">
      <div class="card main-card mt-4">
        <div class="card-body themeForm">
          <form th:action="@{#{url.food.court.credit.debit}+#{url.upload}}" method="post"
                enctype="multipart/form-data" th:object="${foodCourtLedgerDto}" id="foodCourtUploadForm">
            <div class="row">
              <div class="col-lg-6">
                <div class="row">
                  <div class="col-lg-12">
                    <h2 class="tmsub-title" th:text="#{message.label.debit.bulk.upload.file.header}"></h2>
                  </div>
                </div>
                <div class="row">
                  <div class="col-lg-8 mb-3" id="documentUploadSection">
                    <th:block th:replace="~{common/template/drag-drop-file-upload-template::contents(
										                'uploadFile' + 1, 'file', ${#messages.msg('message.accepted.document.types.xl')},
										                'uploadDoc', null, ${#messages.msg('message.drag.drop.here.document')})}">
                    </th:block>
                    <div class="invalid-feedback" th:text="#{message.validation.complaint.type.required}"></div>
                  </div>
                  <div class="col-lg-4">
                    <button type="button" id="uploadFileButton" class="btn btn-purple px-4 me-2">
                      <i class="fa fa-upload" aria-hidden="true"></i> <span th:text="#{message.button.upload.file}"></span>
                    </button>
                  </div>
                </div>
                <div class="text-danger d-flex align-items-center" th:if="${excelErrorList != null && !excelErrorList.isEmpty()}">
                  <div class="invalid-feedback"></div>
                  <ul>
                    <li th:each="error : ${excelErrorList}">
                      <span th:text="${error}"></span>
                    </li>
                  </ul>
                </div>
              </div>
              <div class="col-lg-6">
                <div class="row">
                  <div class="col-lg-12">
                    <h2 class="tmsub-title" th:text="#{message.label.debit.bulk.upload.download}"></h2>
                  </div>
                </div>
                <div class="col-lg-12 mb-3 d-flex align-items-center">
                  <span class="fs-5">
                    <u class="text-tmPrimary">
                      <a th:href="@{#{url.food.court.credit.debit} + #{url.template.download}}"
                         th:text="#{message.label.click.here.caps}"></a>
                    </u>
                    <span th:text="' '+#{message.button.download.excel.template}"></span>
                  </span>
                </div>
              </div>
            </div>
          </form>
          <div class="row mt-2">
            <div class="col-lg-12">
              <h2 class="tmsub-title">
                <span class="me-2" th:text="#{message.label.food.court.credit}"></span> (
                <span class="text-warning fw-bold fs-5" th:text="#{message.label.food.court.credit.list.note}"></span> )
              </h2>
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-lg-3 mb-3">
              <label class="form-label" for="messPeriod" th:text="#{message.label.mess.period.without.colon}"></label>
              <select id="messPeriod" class="form-select" >
                <option value="" th:selected="${id == null}" th:text="#{message.label.select}"></option>
                <option th:each="period : ${messPeriods}" th:value="${period.id}" th:text="${period.messPeriod}" th:selected="${id != null and id == period.id}"></option>
              </select>
            </div>
            <div class="col-auto" style="margin-top: 8px">
              <button id="searchButton" type="button" class="btn btn-primary mt-4"
                      onclick="getSelectedPeriod()"><i class="fa-solid fa-database"></i>
                <span th:text="#{message.label.get.data}"></span>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <div class="table-responsive themeTable">
              <table id="foodCourtStudentsCreditTable" class="table table-bordered nowrap w-100">
                <thead>
                <tr>
                  <th th:text="#{message.label.sl.no}"></th>
                  <th th:text="#{message.label.student.id}"></th>
                  <th th:text="#{message.label.mess.name}"></th>
                  <th th:text="#{message.label.allotted.from.date}"></th>
                  <th th:text="#{message.label.allotted.to.date}"></th>
                  <th>
                    <span th:text="#{message.label.food.court.amount} + ' ' + #{message.label.per.day}"></span>
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                  </th>
                  <th>
                    <span th:text="#{message.label.amount}"></span>
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                  </th>
                  <th th:text="#{message.label.credit}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${form.getList() != null }" th:each="foodCourtList, iter: ${form.getList()}">
                  <td th:text="${iter.index} + 1"></td>
                  <td th:text="${foodCourtList.studentId}"></td>
                  <td th:text="${foodCourtList.messName}"></td>
                  <td th:text="${#temporals.format(foodCourtList.changeFromDate, #messages.msgOrNull('date.format'))}"></td>
                  <td th:text="${#temporals.format(foodCourtList.changeToDate, #messages.msgOrNull('date.format'))}"></td>
                  <td th:text="${#numbers.formatDecimal(foodCourtList.foodCourtAmount, 1, 2)}"></td>
                  <td th:text="${#numbers.formatDecimal(foodCourtList.amount, 1, 2)}"></td>
                  <td th:text="${foodCourtList.debitOrCredit}"></td>
                </tr>
                </tbody>
              </table>
            </div>
            <div th:replace="~{common/template/dt-pagination :: pagination(${form})}"></div>
          </div>
          <div class="row mt-2" id="insertSection">
            <div class="col-lg-12">
              <div class="d-flex justify-content-end">
                <button class="btn btn-success" id="insertButton"
                        th:data-list="${form.getList()}"
                        onclick="saveFoodCourtList()">
                  <i class="fa-solid fa-plus-circle"></i>
                  <span th:text="#{message.button.insert}"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
 <div th:id="modalDiv"></div>
  <th:block th:replace="~{common/modal/info-modal ::
     contents(id='insertAll',headerText=#{message.label.confirmation},bodyText=#{message.label.save.list.confirmation})}">
  </th:block>
 <!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
  <script th:src="@{/assets/js/mess/food-court-students-credit.js}"></script>
  <script th:src="@{/assets/js/data-table-common.js}"></script>
  <script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
  <script th:inline="javascript">
    const baseURL = /*[[#{url.food.court.credit.debit}]]*/ '';
    const saveFoodCourtURL = /*[[#{url.save.food.court.list}]]*/ '';
    const getURL = /*[[#{url.get.form}]]*/ '';
    const checkStudentURL = /*[[#{url.exist}]]*/ '';
  </script>
</th:block>
<!-- Footer-->
</body>

</html>
