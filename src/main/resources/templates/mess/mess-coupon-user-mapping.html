<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})}"></head>
<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
    <!--School Info Section-->
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-4">
                            <form class="themeForm g-3 needs-validation" id="messCouponMappingForm"
                                  th:object="${messCouponUserMappingDto}"
                                  th:action="@{#{url.mess.coupon.mapping}}" method="post">
                                <div class="row">
                                    <div class="col-lg-12">
                                        <h2 class="tmsub-title" th:text="#{message.label.mess.name.user.name}"></h2>
                                    </div>
                                </div>
                                <span class="form-text mb-3"
                                      th:text="#{message.label.caterer.account.head.user.name.note}"></span>
                                <div class="col-lg-12 mb-3">
                                    <label for="userName" class="form-label"><span th:text="#{message.label.username}"></span>
                                        <th:block th:replace="~{common/template/mandatory-symbol}" /></label>
                                    <div class="input-group mb-3">
                                        <input type="text" class="form-control hostel-username-validation"
                                               th:field="*{userName}"
                                               th:classappend="${#fields.hasErrors('userName')} ? 'is-invalid' : ''"
                                               id="userName" list="names" th:placeholder="#{message.placeholder.username}">
                                        <datalist id="names">
                                            <option th:each="user : ${userList}" th:text="${user.id.username}"></option>
                                        </datalist>
                                        <div class="invalid-feedback backendErrors" th:errors="*{userName}"></div>
                                        <div class="invalid-feedback-frontEnd" id="validateError"
                                             th:text="#{message.validation.enter.usernme}"></div>
                                    </div>
                                </div>

                                <div class="col-lg-12 mb-3">
                                    <!-- Label for Input -->
                                    <label class="form-label" for="searchMessName">
                                        <span th:text="#{message.label.mess.name}"></span>
                                        <th:block th:replace="~{common/template/mandatory-symbol}"/>
                                    </label>
                                    <!-- Search Input -->
                                    <input type="text" class="form-control" id="searchMessName"
                                           th:placeholder="#{message.label.search.mess.name}">
                                    <!-- Checkbox List -->
                                    <div class="hostelname border rounded p-3"
                                         th:classappend="${#fields.hasErrors('messId')} ? 'is-invalid' : ''">
                                        <!-- Select All Option -->
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="" id="selectAllMess">
                                            <label class="form-label fw-bold" for="selectAllMess"
                                                   th:text="#{message.label.select.all.caterer.mess.name}"></label>
                                        </div>
                                        <!-- Individual Options -->
                                        <div class="searchMess">
                                            <div class="form-check mb-1" th:each="mess : ${messMasterList}">
                                                <input type="checkbox" class="form-check-input messCheckbox"
                                                       name="messId" th:value="${mess.id}" th:id="${mess.id}"
                                                       th:checked="${messCouponUserMappingDto.messId ne null and !messCouponUserMappingDto.messId.isEmpty()
                                                       and messCouponUserMappingDto.messId.contains(mess.id)}"
                                                >
                                                <label class="form-check-label" th:for="${mess.id}"
                                                       th:text="${mess.messName}"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <!-- Validation Message -->
                                    <div class="invalid-feedback backendErrors mt-2" th:errors="*{messId}"></div>
                                    <div class="invalid-feedback-frontEnd mt-2"
                                         th:text="#{message.validation.choose.account.head.name}"></div>
                                </div>
                                <div class="modal-footer col-lg-12 mt-2">
                                    <button type="button" id="saveMess" class="btn btn-primary"><i
                                            class="fa-solid fa-save"></i> <span th:text="#{message.button.save}"></span>
                                    </button>
                                </div>
                            </form>
                        </div>
                        <div class="col-lg-8">
                            <div class="row">
                                <div class="col-lg-12">
                                    <h2 class="tmsub-title"
                                        th:text="#{message.label.mess.coupon.user.mapping.list}"></h2>
                                </div>
                            </div>
                            <form action="#" method="get">
                                <div class="row mb-3">
                                    <div class="col-auto">
                                        <label for="search" class="form-label">
                                            <span th:text="#{message.label.keyword}"></span>
                                            <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                               data-bs-title="Use Mess Name or Username to search"></i>
                                        </label>
                                        <input type="text" class="form-control" name="search" id="search"
                                               th:value="${form.search}">
                                    </div>
                                    <div class="col-auto mt-3">
                                        <button class="btn btn-secondary mt-3" type="submit">
                                            <span th:text="#{message.label.search}"></span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                            <div class="table-responsive themeTable" id="myTable">
                                <table id="catererMappingTable" class="table table-bordered nowrap w-100">
                                    <thead>
                                    <tr>
                                        <th th:text="#{message.label.username}"></th>
                                        <th th:text="#{message.label.mess.name}"></th>
                                        <th class="text-center" th:text="#{message.label.action}"></th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                        th:each="user : ${form.paginationList.getContent()}">
                                        <td th:text="${user.userName}"></td>
                                        <td th:text="${user.messMaster.messName}"></td>
                                        <td class="text-center">
                                            <div class="d-flex justify-content-center">
                                                <!-- Delete Button -->
                                                <button type="button" class="btn btn-outline-danger btn-sm"
                                                        data-bs-toggle="tooltip" th:id="${'deleteMap_'+user.id}"
                                                        data-bs-title="Delete" th:data-id="${user.id}"
                                                        onclick="deleteCouponUserMapping(this)">
                                                    <i class="fa-solid fa-trash-can"></i>
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                        <td colspan="3" class="text-center"><span
                                                th:text="#{message.label.no.data.available}"></span></td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:id="modalDiv"></div>
<th:block
        th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>
<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <!-- Datad Table JS FILES -->
    <script th:src="@{/assets/js/mess/mess-coupon-mapping.js}"></script>
    <script th:src="@{/assets/js/hostel/user-mapping.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.mess.coupon.mapping}]]*/ '';
        const exists = [[${exists}]];
        if(exists) {
            showErrorToast('Error', 'Mess Coupon User Mapping exists');
        }
    </script>
</th:block>
<!-- Footer-->
</body>
</html>
