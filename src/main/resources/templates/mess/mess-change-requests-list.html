<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get" id="messChangeRequestsId" th:object="${messChangeRequestsList}">
							<div class="row mb-4">
								<div class="col-lg-3 mb-3">
									<label for="messPeriodId" class="form-label"> 
										<span th:text="#{message.label.mess.allotted.list.period}"></span>
									</label> 
									<select id="messPeriod" class="form-select" th:field="*{messPeriod}" required>
										<option value="" th:text="#{message.label.select}+' '+#{message.label.mess.allotted.list.period}"></option>
										<option th:each="messPeriod : ${messPeriodList}" th:value="${messPeriod.id}"
											th:text="${#temporals.format(messPeriod.diningFromDate, #messages.msg('date.format'))} +' to ' +
						               	 	${#temporals.format(messPeriod.diningToDate, #messages.msg('date.format'))}">
										</option>
									</select>
									<div class="invalid-feedback"
										th:text="#{message.label.mess.period} + ' ' + #{message.validation.is.required}">
									</div>
								</div>
								<div class="col-lg-3 mb-3">
									<div class="col-auto mt-4">
										<input type="hidden" id="pageVal" th:value="${form.pageVal}"/>
										<input type="hidden" id="sizeVal" th:value="${form.size}"/>
										<button id="getData" class="btn btn-lgtblue mt-3" type="button"
											onclick="getMessChangeRequest()">
											<i class="fa-solid fa-database"></i>
											<span th:text="#{message.label.get.data}"></span>
										</button>
									</div>
								</div>
								<div class="col d-flex justify-content-end align-items-center">
				                    <div class="col-auto me-3">
			                     	  	<label for="search" class="form-label">
				                          <span th:text="#{message.label.keyword}"></span>
				                          <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
				                             data-bs-title="Use IITM Student ID, Student Name, Old Mess, New Mess and Description to search">
				                          </i>
			                        	</label>
				                        <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
				                    </div>
				                    <div class="col-auto mt-3">
				                       <button class="btn btn-secondary mt-4" type="button" onclick="return getMessChangeRequest();">
				                          <span th:text="#{message.label.search}"></span>
				                       </button>
				                    </div>
				                </div>
							</div>
						</form>
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="studentMessRequestTable"
									class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th th:text="#{message.label.student.id}"></th>
											<th th:text="#{message.label.student.name}"></th>
											<th th:text="#{message.label.old.mess}"></th>
											<th th:text="#{message.label.effective.from.date}"></th>
											<th th:text="#{message.label.new.mess}"></th>
											<th th:text="#{message.label.description}"></th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											th:each="messChangeRequest, iter : ${form.paginationList.getContent()}">
											<td>
												<span th:text="${messChangeRequest.studentId}"></span>
											</td>
											<td>
												<span th:text="${messChangeRequest.studentName}"></span>
											</td>
											<td>
												<span th:text="${messChangeRequest.messHead}"></span>
											</td>
											<td>
												<span th:text="${#temporals.format(messChangeRequest.effectiveFromDate, #messages.msg('date.format'))}"></span>
											</td>
											<td>
												<span th:text="${messChangeRequest.requestedMessHead}"></span>
											</td>
											<td>
												<span th:text="${messChangeRequest.description}"></span>
											</td>
										</tr>
								    	<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="7" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	<!-- Footer -->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/mess/mess-change-requests-list.js}"></script>
	</th:block>
	<!-- Footer -->
</body>
</html>
