<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>

<header th:replace="~{common/header:: title(${headerForm})}"></header>
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <form id="messAllottedDinedForm"
                          th:action="@{#{url.mess.allotted.dined}}"
                          th:object="${searchForm}" method="post" class="form-horizontal">

                        <div class="row mb-4">
                            <div class="col-lg-3 mb-3">
                                <label for="messPeriod" th:text="#{message.label.mess.period}"></label>
                                <select id="messPeriod" th:field="*{messPeriodId}" class="form-select required-input" required>
                                    <option value="" selected="selected" th:text="#{message.label.select}"></option>
                                    <option th:each="period : ${messPeriods}"
                                            th:value="${period.id}"
                                            th:text="${period.messPeriod}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label for="messName" th:text="#{message.label.mess.name}"></label>
                                <select id="messName" th:field="*{messId}" class="form-select required-input" required>
                                    <option value="" selected="selected" th:text="#{message.label.select}"></option>
                                    <option th:each="mess : ${messNames}"
                                            th:value="${mess.id}"
                                            th:text="${mess.messName}">
                                    </option>
                                </select>
                            </div>
                            <div class="col-lg-3 row">
                                <div class="">
                                    <button id="searchButton" type="button" class="btn btn-primary mt-4"
                                            onclick="validateForm()"><i class="fa-solid fa-database"></i>
                                        <span th:text="#{message.label.get.data}"></span>
                                    </button>

                                </div>
                            </div>
                        </div>
                    </form>
                    <div class="col-lg-12 mb-3 text-danger" th:if="${errorMessage != null}">
                        <span>* </span>
                        <span th:text="#{message.label.no.record.found}"></span>
                        <span th:if="${errorMessage != 'No Record Found'}" th:text="' - ' + ${errorMessage}"></span>
                    </div>
                    <div class="col-lg-12 mb-3" th:if="${showTable}">
                        <h2 class="tmsub-title"><span class="mb-3" th:text="#{message.label.download.pdf.report}"></span></h2>
                        <div class="col-lg-12 mb-3 d-flex align-items-center">
                                <span class="fs-5">
                                    <u class="text-tmPrimary">
                                        <a th:href="@{#{url.mess.allotted.dined} + #{url.pdf.download} + '/' + ${messAllottedDined.messPeriodId}+ '/' + ${messAllottedDined.messId}}"
                                           target="_blank" rel="noopener noreferrer"
                                           th:text="#{message.label.click.here.caps}"></a>
                                    </u>&nbsp;
                                    <span class="mb-3" th:text="#{message.label.download.pdf.report}"></span>
                                </span>
                        </div>
                    </div>


                    <div class="row" th:if="${showTable}">
                        <div class="col-lg-12">
                            <div class="col-6 mx-auto">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">
                                            Mess Name - <span th:text="${messAllottedDined.messName}"></span>
                                            (<span th:text="${messAllottedDined.fromDateString}"></span> -
                                            <span th:text="${messAllottedDined.toDateString}"></span>)
                                        </h5>
                                        <table class="table table-bordered">
                                            <tbody>
                                            <tr>
                                                <th th:text="#{message.label.total.days}"></th>
                                                <td th:text="${messAllottedDined.totalDays}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.no.of.students.allotted}"></th>
                                                <td th:text="${messAllottedDined.studentsAlloted}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.total.no.of.sessions.allotted.for.students}"></th>
                                                <td th:text="${(messAllottedDined.totalDays != null && messAllottedDined.studentsAlloted != null) ?
                                                        #numbers.formatInteger(messAllottedDined.totalDays * messAllottedDined.studentsAlloted, 0) : '0'}">
                                                </td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.actual.no.of.sessions.dined.by.students}"></th>
                                                <td th:text="${messAllottedDined.sessionTotalCount}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.actual.no.of.days.dined.by.student}"></th>
                                                <td th:text="${messAllottedDined.dayTotalCount != null && messAllottedDined.studentsAlloted != 0 ?
                                           messAllottedDined.dayTotalCount / messAllottedDined.studentsAlloted : 0}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.actual.no.of.days.dined.by.students}"></th>
                                                <td th:text="${messAllottedDined.dayTotalCount}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.mess.rate}"></th>
                                                <td class="currency text-end" th:text="${messAllottedDined.rate}"></td>
                                            </tr>
                                            <tr>
                                                <th th:text="#{message.label.total.amount.calculated}"></th>
                                                <td class="currency text-end"
                                                    th:text="${messAllottedDined.dayTotalCount != null && messAllottedDined.rate != null ?
                                                        #numbers.formatDecimal(messAllottedDined.dayTotalCount * messAllottedDined.rate, 1, 2, 'COMMA') : '0.00'}">
                                                </td>
                                            </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/mess/mess-allotted-dined-report.js}"></script>
    <script th:inline="javascript">
        const excelDownloadUrl = /*[[#{url.mess.allotted.dined.report.download}]]*/ '';
    </script>
</th:block>
</body>
</html>
