<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <form class="themeForm" method="get" id="hostelAccommodationRebateRequestReport">
                        <div class="row mb-3">
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="fromDateId" th:text="#{message.label.from.date}"></label>
                                <input type="date"  class="form-control additional-param" th:name="additionalParam.approvalFromDate" id="fromDateId" onkeydown="return false">
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="toDateId" th:text="#{message.label.to.date}"></label>
                                <input type="date"  class="form-control additional-param" id="toDateId" onkeydown="return false">
                                <div class="invalid-feedback" th:text="#{message.validation.exc.prog.to.date.required}"></div>
                                <div class="invalid-feedback-date-compare d-none" th:text="#{message.validation.from.to.date.range}"></div>
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label class="form-label" for="reportType">
                                    <span th:text="#{message.label.report.type}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <select class="form-select required-input additional-param" id="reportType" required>
                                    <option value="" th:text="#{message.label.select} + ' ' + #{message.label.application.type}"></option>
                                    <option th:each="reportType : ${reportType}"
                                            th:value="${reportType.id}"
                                            th:text="${reportType.value}">
                                    </option>
                                </select>
                                <div class="invalid-feedback" th:text="#{message.label.report.type} + ' ' + #{message.label.is} + ' ' + #{message.label.required}"></div>
                            </div>
                            <div class="col-auto mt-4">
                                <a type="button" id="getData" class="btn btn-success mt-3" target="_blank" onclick="return getAdminReportExcelFile()">
                                    <i class="fa-solid fa-file-excel"></i>
                                    <span th:text="#{message.label.download.excel}"></span>
                                </a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/dean/vacating-students.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.student.vacating}]]*/ '';
        const downloadURL = /*[[#{url.admin.excel.report.download}]]*/ '';
    </script>
</th:block>
</body>
</html>
