<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <form action="#" method="get">
                        <div class="row mb-4">
                            <div class="col-lg-2 mb-3">
                                <label class="form-label" for="fromDate">
                                    <span th:text="#{message.label.from.date}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <input type="date" id="fromDate" name="fromDate" class="form-control" required>
                                <div class="invalid-feedback" th:text="#{message.validation.from.date.required}"></div>
                            </div>
                            <div class="col-lg-2 mb-3">
                                <label class="form-label" for="toDate">
                                    <span th:text="#{message.label.to.date}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <input type="date" id="toDate" name="fromDate" class="form-control" required>
                                <div class="invalid-feedback" th:text="#{message.validation.to.date.required}"></div>
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label for="messId" class="form-label" th:text="#{message.label.mess.name}"></label>
                                <select id="messId" class="form-select">
                                    <option value="" th:text="#{message.label.select}+' '+#{message.label.mess.name}"></option>
                                    <option th:each="messMaster : ${messMasterList}" th:value="${messMaster.id}" th:text="${messMaster.messName}"></option>
                                </select>
                            </div>
                            <div class="col-lg-2 mb-3">
                                <label class="form-label" th:text="#{message.label.student.id}" for="studentId"></label>
                                <input type="text" id="studentId" class="form-control" th:placeholder="#{message.placeholder.student.id}">
                            </div>
                            <div class="col-auto" style="margin-top: 38px">
                                <button id="filterData" class="btn btn-lgtblue" type="button" onclick="downloadExcelReport();">
                                    <i class="fa-solid fa-file-excel"></i>
                                    <span th:text="#{message.button.export}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Footer -->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/biometric/log.js}"></script>
    <script th:inline="javascript">
        const downloadExcelURL = /*[[#{url.excel.download}]]*/ '';
    </script>
</th:block>
<!-- Footer -->
</body>
</html>
