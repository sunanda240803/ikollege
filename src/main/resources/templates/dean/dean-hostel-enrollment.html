<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
    <link rel="stylesheet" th:href="@{/assets/css/hostel/hostel-individual-allotment.css}">
</head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
</header>
<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <input type="hidden" th:value="${form.getAdditionalParam()}">

                    <form class="mb-4" th:action="@{#{url.dean.hostel.enrollment}+#{url.student.bulk.upload.save}}" method="post"
                          enctype="multipart/form-data" th:object="${studentBulkUploadDto}" id="studentBulkUploadForm">

                        <div class="row" id="bulkRoomInventory" th:if="${needBulkUpload}">
                            <div class="row">
                                <div class="col-lg-12">
                                    <h2 class="tmsub-title"><span th:text="#{message.label.bulk.upload.download}"></span></h2>
                                </div>
                            </div>
                            <div class="col-lg-12 mb-3 d-flex align-items-center">
									<span class="fs-5">
										<u class="text-tmPrimary">
											<a th:href="@{#{url.dean.hostel.enrollment}+#{url.download.student.bulk.upload.template}}" th:text="#{message.label.click.here.caps}"></a>
										</u>
										<span th:text="#{message.label.hostel.enrollment.bulk.approval.click.here.note}"></span>
									</span>
                            </div>
                            <div class="row">
                                <div class="col-lg-12">
                                    <h2 class="tmsub-title"><span th:text="#{message.label.bulk.upload.file.header}"></span></h2>
                                </div>
                            </div>

                            <div class="col-lg-4 mb-3">
                                <label class="form-label"><span th:text="#{message.label.mess.period.radio}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <div class="checkRadio-bg form-control" id="messPeriod">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input required-input" type="radio"
                                               th:name="|messPeriod|" id="current" value="Current" required th:disabled="${!currentMp}"
                                               th:checked="${currentMp}">
                                        <label class="form-check-label" for="current"
                                               th:text="#{message.label.current}+' '+ #{message.label.mess.period.radio}"></label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input required-input" type="radio"
                                               th:name="|messPeriod|" id="next" value="Next" required th:disabled="${!nextMp}"
                                               th:checked="${nextMp}">
                                        <label class="form-check-label" for="next"
                                               th:text="#{message.label.next}+' '+ #{message.label.mess.period.radio}"></label>
                                    </div>
                                </div>
                                <div class="invalid-feedback" th:text="#{message.validation.mess.period.required}"></div>
                            </div>

                            <div class="col-lg-4">
                                <label class="form-label">
                                    <span th:text="#{message.choose.file}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}"/>
                                </label>
                                <div th:replace="~{common/template/drag-drop-file-upload-template::contents('file', 'file', ${#messages.msg('message.excel.upload.file.types')}, 'uploadDoc', null, ${#messages.msg('message.drag.drop.guest.request.select')})}">
                                    <div class="invalid-feedback"
                                         th:text="#{message.validation.document.required}"></div>
                                </div>
                                <div class="selectFile2 d-none"><span
                                        class="text-danger" th:text="#{message.validation.upload.file}"></span></div>
                                <div class="validFile d-none"><span class="text-danger" th:text="#{message.validation.invalid.file.format}"></span></div>
                            </div>
                            <div class="col-lg-3 my-2">
                                <button type="button" id="uploadFileButton" class="btn btn-purple px-4 me-2" onclick=" return validateFile()">
                                    <i class="fa fa-upload" aria-hidden="true"></i> <span th:text="#{message.button.upload.file}"></span>
                                </button>
                            </div>
                        </div>
                        <div class="text-danger errorList d-flex align-items-center" th:if="${excelErrorList != null && !excelErrorList.isEmpty()}">
                            <ul>
                                <li th:each="error : ${excelErrorList}">
                                    <span th:text="${error}"></span>
                                </li>
                            </ul>
                        </div>
                    </form>

                    <th:block th:replace="~{common/dean-dashboard-filter :: formInputs(${form.getAdditionalParam()})}"></th:block>
                    <th:block th:replace="~{common/dean-common-table}"></th:block>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- //Main-->
<th:block th:replace="~{common/modal/hostel-enrollment-approve-modal ::
   contents(id = 'hostelEnrollment', headerText=#{message.label.confirmation},bodyText=#{message.label.dean.hostel.enrollment.approve})}"></th:block>

<th:block th:replace="~{dean/dean-reject-modal}"></th:block>

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/dean/dean-dashboard.js}"></script>
    <script th:src="@{/assets/js/dean/hostel-enrollment.js}"></script>
    <script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.dean.hostel.enrollment}]]*/ '';
        const lateFeeEnrollment = /*[[#{url.late.fee.enrollment}]]*/ '';
    </script>
</th:block>
<!-- //Footer-->
</body>
</html>
