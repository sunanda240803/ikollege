<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
    <link rel="stylesheet" th:href="@{/assets/css/hostel/hostel-individual-allotment.css}">
    <link rel="stylesheet" th:href="@{/assets/css/dean/dean-common-table-style.css}">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.2.5/css/buttons.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/staterestore/1.4.3/css/stateRestore.bootstrap5.css">
</head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
<!--                     <th:block th:insert="~{common/dean-dashboard-header :: tabs(url='/hosteldine/hostel/student-room')}"></th:block> -->
<!--                    <th:block th:insert="~{common/dean-dashboard-header}"></th:block>-->
<!--                    <h2 class="tmsub-title" th:text="${columnDto?.property?.displayName}"></h2>-->
                    <span th:if ="${showUploadCard != null}">
                         <span th:if ="${isDeanLogin != null && isDeanLogin == true}">
                            <th:block th:replace="~{common/dean-upload-file}"></th:block>
                         </span>
                        <span th:if ="${isFacultyLogin != null && isFacultyLogin == true}">
                            <th:block th:replace="~{common/faculty-student-bulk-upload}"></th:block>
                         </span>
                    </span>
                    <input type="hidden" th:value="${form.getAdditionalParam()}">
                    <th:block th:replace="~{common/dean-dashboard-filter :: formInputs(${form.getAdditionalParam()})}"></th:block>
                    <div class="row d-none" th:if="${isHostelUser}" id="roomInventorySection">
                        <div class="col-lg-12">
                            <div class="d-flex justify-content-end">
                                <button class="btn btn-primary mb-2" id="roomInventoryActionButton" onclick="roomInventoryList()">Inventory List</button>
                            </div>
                        </div>
                    </div>
                    <div class="row d-none" th:if="${isBulkApproveRejectNeeded} and ${isRoleDean}" id="bulkApproveRejectButtons">
                        <div class="col-lg-12">
                            <div class="d-flex justify-content-end">
                                <button type="button" id="bulkApproveButton" th:data-bs-title="BulkApprove" onclick="bulkApproveOrReject(this);"
                                        class="btn btn-success px-4 me-2">
                                    <i class="fa-solid fa-check-circle me-1"></i>
                                    <span th:text="#{message.button.approve}"></span>
                                </button>
                                <button type="button" id="bulkRejectButton" th:data-bs-title="BulkReject" onclick="bulkApproveOrReject(this);"
                                        class="btn btn-danger px-4 me-2">
                                    <i class="fa-solid fa-times-circle me-1"></i>
                                    <span th:text="#{message.button.reject}"></span>
                                </button>
                            </div>
                        </div>
                    </div>
                    <input type="hidden" th:value="${excelUrl}" id="excelUrl">
                    <input type="hidden" th:value="${addNewUrl}" id="addNewUrl">
                   <th:block th:replace="~{common/dean-common-table}"></th:block>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- //Main-->

<div th:id="modalMailDiv"></div>
<div th:id="modalDiv"></div>

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/dean/dean-dashboard.js}"></script>
    <script th:src="@{/assets/js/dean/faculty-screen.js}"></script>
    <script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/staterestore/1.4.3/js/dataTables.stateRestore.js"></script>
    <script src="https://cdn.datatables.net/staterestore/1.4.3/js/stateRestore.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.5/js/dataTables.buttons.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.5/js/buttons.bootstrap5.js"></script>
    <script th:src="@{/assets/js/data-table-common.js}"></script>
</th:block>
<!-- //Footer-->

<!-- Delete Modal-->
<th:block
	th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>
	
<!-- Resend Email Modal-->
<th:block th:replace="~{common/modal/resend-mail-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.resend.email.submission})}">
</th:block>

<th:block th:replace="~{common/modal/reject-reversal-reason-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.status.update.reject.reversal})}">
</th:block>

<th:block th:replace="~{common/modal/reject-with-reason-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.status.update.reject})}">
</th:block>

<th:block th:replace="~{common/modal/approve-with-reason-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.status.update.approve})}">
</th:block>

<th:block th:replace="~{common/modal/send-message-modal ::
   contents(headerText=#{message.label.suggestion})}">
</th:block>

<!-- Approve Modal-->
<th:block th:replace="~{common/modal/approval-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.approve.confirmation.message})}">
</th:block>

<!-- CheckIn Modal-->
<th:block th:replace="~{common/modal/checkin-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.checkin.confirmation.message})}">
</th:block>

<!-- CheckOut Modal-->
<th:block th:replace="~{common/modal/checkout-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.checkout.confirmation.message})}">
</th:block>

<th:block th:replace="~{common/modal/info-modal ::
   contents(id='accept',headerText=#{message.label.confirmation},bodyText=#{message.label.sick.food.request.accept})}">
</th:block>

<th:block th:replace="~{common/modal/info-modal ::
   contents(id='outForDelivery',headerText=#{message.label.confirmation},bodyText=#{message.label.sick.food.delivery.status})}">
</th:block>
</body>
</html>
