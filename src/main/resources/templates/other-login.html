<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{common/head :: common_header(~{null})}"></th:block>
<link th:href="@{/assets/css/animation-style.css}" rel="stylesheet"/>
<body class="">

<!-- Login Page-->
<section class="login-page-wrapper pt-5">
    <div th:replace="~{common/template/login-page-wrapper:: title(${loginPageWrapper})}"></div>
    <!-- Login Page Content -->
    <div class="login-page-content">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-8 col-xl-6">
                    <div class="card">
                        <div class="card-body">
                            <div class="logo mb-4">
                                <div th:replace="common/template/app-logo-name :: title(logoAndName)"></div>
                                <div class="col-lg-12">
                                    <h5 class="text-tmPrimary fw-bold text-uppercase" th:text="#{message.label.other.candidate.login}"></h5>
                                </div>
                            </div>
                            <form th:action="@{/login/authenticate}" method="post" id="loginForm">
                                <div class="float-label mb-4">
                                    <label class="form-label" for="id">
                                        <span th:text="#{message.label.email.id}"></span>
                                        <th:block th:replace="~{common/template/mandatory-symbol}" />
                                    </label>
                                    <input type="text" class="form-control login-email-validation" name="id" id="id" oninput="this.value = this.value.toLowerCase()"
                                           th:placeholder="#{message.placeholder.reg.email.id}" th:required="required">
                                    <input type="hidden" class="form-control" name="loginType" id="loginType"
                                           th:value="${loginType}">
                                    <input type="hidden" class="form-control" name="userName" id="userName">
                                    <div class="invalid-feedback" th:text="#{message.validation.reg.email.id.required}"></div>
                                    <div class="invalid-req-feedback d-none">
                                        <span th:text="#{message.validation.registered.email.id.required}"></span>
                                    </div>
                                    <div class="invalid-valid-feedback d-none" id="invalid-email" th:text="#{message.validation.invalid.registered.email.id}"></div>
                                </div>
                                <div class="float-label mb-4">
                                    <label class="form-label" for="password">
                                        <span th:text="#{message.label.password}"></span>
                                        <th:block th:replace="~{common/template/mandatory-symbol}" />
                                    </label>
                                    <input class="form-control login-password-validation" type="password" name="password" id="password"
                                           th:placeholder="#{message.placeholder.password}">
                                    <div class="invalid-feedback" th:text="#{message.validation.password.required}"></div>
                                    <div class="invalid-length-feedback d-none" th:text="#{message.validation.password.length}"></div>
                                </div>
                                <div class="mb-4 text-danger" th:if="${param.error!=null}" id="failureText" th:text="#{message.validation.invalid.other.credentials}"></div>
                                <div class="text-danger mb-4 d-none" id="error-message" th:text="#{message.validation.invalid.other.credentials}"></div>
                                <div class="text-center mb-3">
                                    <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPassword" onclick="clearFormElements('forgotPasswordForm','')" class="small">
                                        <i class="fas fa-lock"></i> <span th:text="#{message.label.forgot.password}"></span>
                                    </a>
                                </div>
                                <!-- Other Login Buttons -->
                                <div th:replace="common/template/register-login-button :: buttons('loginLogic', 'loginIcon', 'loginText')"></div>
                            </form>
                            <div th:replace="common/template/login-bottom :: title('otherLogin')"></div>
                        </div>
                    </div>
                    <div class="mt-4 text-center">
                        <div th:replace="~{common/template/footer:: title(${footer})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- //Login Page-->

<!-- Hostel Fee Payment Module -->
<div th:replace="~{common/modal/hostel-fee-model:: title(${hostelFeeModel})}"></div>

<!-- Info Module -->
<th:block th:replace="~{common/modal/success-modal ::
    contents(headerText=#{message.label.confirmation}, bodyText=#{message.label.forgot.password.success})}">
</th:block>
<!-- Forgot Password Module -->
<th:block th:replace="~{forgot-password-modal}"></th:block>
<!-- Security Notice Info -->
<th:block th:replace="~{common/modal/info-modal :: contents(id = null, headerText=#{message.label.security.notice},bodyText=#{message.label.security.notice.note})}"></th:block>
<!-- JS FILES -->
<th:block th:replace="~{common/footer2 :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/landing-page.js}"></script>
    <script th:src="@{/assets/js/common/login-registration.js}"></script>
    <script th:inline="javascript">
        $(document).ready(function() {
            $('#infoModal').modal('show');
            $('#infoModalCancel').addClass(displayNone);
        });
        const forgotPasswordURL = /*[[#{url.forgot.password}]]*/ '';
    </script>
</th:block>
</body>
</html>
