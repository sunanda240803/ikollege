<!DOCTYPE html>
<html lang="en">
   <head th:replace="~{common/head :: common_header(~{::link})} "></head>
   <body>
     <header th:replace="~{common/student-dashboard-header:: title(${headerForm}, 'Sick Food Request',
	 	'Dashboard', 'Add New', null,null, 'Back', null, #{url.dashboard}+#{url.student}, null)}">
	</header>
      <!-- //Main-->
      <main id="main" class="main">
         <div class="row">
            <div class="col-lg-12">
               <div class="card main-card mt-4">
                  <div class="card-body themeForm">
                     <form action="#" method="get">
                        <div class="row mb-3">
                           <div class="row">
                              <div class="col-lg-9 mb-3">
                                 <th:block
                                         th:replace="~{common/template/note :: noteContent('message.label.note', #{message.note.mess.session}, null)}">
                                 </th:block>
                              </div>
                              <div class="col-lg-3 mb-3 text-end p-3" th:if="${vendorContact ne null and vendorContact>0}">
                                 <a th:href="@{'tel:+91'+${vendorContact}}" class="btn btn-lg btn-tmPrimary w-100 mb-3"
                                    data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Call Vendor">
                                    <i class="fa-solid fa-phone me-2"></i>
                                    <span th:text="#{message.label.call.vendor}"></span>
                                 </a>
                                 <a th:href="@{'sms:+91'+${vendorContact}}" class="btn btn-lg btn-tmPrimary w-100"
                                    data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Message Vendor">
                                    <i class="fa-solid fa-comment me-2"></i>
                                    <span th:text="#{message.label.message.vendor}"></span>
                                 </a>
                              </div>
                           </div>
                           <div class="row">
                              <div class="col-auto">
                                 <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                                    <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                       data-bs-title=" search only Menu Type and Medical Reason"></i>
                                 </label>
                                 <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
                              </div>
                              <div class="col-auto mt-3">
                                 <button class="btn btn-secondary mt-4" type="submit">
                                    <span th:text="#{message.label.search}"></span>
                                 </button>
                              </div>
                           </div>

                        </div>
                     </form>
                     <div class="mb-4">
                        <div class="table-responsive themeTable">
                           <table id="sickFoodDataTable" class="table table-bordered nowrap w-100">
                              <thead>
                                 <tr>
                                    <th th:text="#{message.label.request.date}"></th>
                                    <th th:text="#{message.label.medical.reason}"></th>
                                    <th th:text="#{message.delivery.option}"></th>
                                    <th th:text="#{message.label.mess.session} + ' / ' + #{message.label.caterer.status}"></th>
                                    <th th:text="#{message.label.student.status}"></th>
                                    <th class="text-center"  th:text="#{message.label.action}"></th>
                                    <th class="text-center"  th:text="#{message.label.download.file}"></th>
                                 </tr>
                              </thead>
                              <tbody>
                                 <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="sickFood, iter: ${form.paginationList.getContent()}">
                                    <td th:text="${#temporals.format(sickFood.requestDate, #messages.msg('date.format'))}"></td>
                                    <!-- <td th:text="${sickFood.requestDate}"></td> -->
                                    <td th:text="${sickFood.medicalReason}"></td>
                                        <td th:text="${sickFood.deliveryOption}"></td>
		                            <td>
									    <div style="margin-bottom: 10px;">
									        <span th:each="messSessionItem, iterStat : ${sickFood.messSessionStatus}">
									       		<th:block th:replace="hostel/mess-session-template :: messSession(${messSessionItem.id},
									       			${messSessionItem.messSession}, ${messSessionItem.catererStatus}, 'ico')">
									       		</th:block>
									        </span>
									    </div>
									</td>
                                    <td>
                                       <div style="margin-bottom: 10px;">
                                          <!-- Check if messSessionStatus is not empty -->
                                          <span th:if="${sickFood.messSessionStatus != null && !sickFood.messSessionStatus.isEmpty()}" 
                                             th:each="messSessionItem, iterStat : ${sickFood.messSessionStatus}">
                                             <!-- Render badge only if studentDeliveryStatus is not null -->
                                             <button type="button" 
                                               class="btn btn-sm width-80" 
                                                th:if="${messSessionItem.studentDeliveryStatus != null}" 
                                              
                                                th:classappend="' ' + 
                                                (${messSessionItem.messSession == 'BF' ? 'btn-primary' 
                                                : messSessionItem.messSession == 'LC' ? 'btn-warning'
                                                : messSessionItem.messSession == 'DR' ? 'btn-pink' 
                                                : 'btn-secondary'})"
                                                style="margin-right: 5px;"
                                                data-bs-toggle="tooltip" 
                                               th:attr="data-bs-placement='top', data-bs-title=
           (${messSessionItem.messSession == 'BF' ? 'Break Fast' 
           : messSessionItem.messSession == 'LC' ? 'Lunch' 
           : messSessionItem.messSession == 'DR' ? 'Dinner' : ''}) + ' - ' + 
           (${messSessionItem.studentDeliveryStatus})">
                                                <!-- Badge Text -->
                                                <span th:text="${messSessionItem.messSession}"></span>
                                                <!-- Show icon only if the status is 'Delivered' -->
                                                <span style="margin-left: 10px;">
                                                <i class="fa-solid fa-check-to-slot" 
                                                   th:if="${messSessionItem.studentDeliveryStatus == 'Received'}"></i>
                                                </span>
                                             </button>
                                             <!-- Feedback Button -->
                                             <button type="button" 
                                                th:if="${(messSessionItem.catererStatus!=null && messSessionItem.catererStatus eq 'OutForDelivery') &&
                                                (#strings.isEmpty(messSessionItem.studentDeliveryStatus))}"
                                                class="btn btn-sm btn-primary" 
                                                style="margin-left: 5px;" 
                                                th:data-session-id="${messSessionItem.messSession}"
                                                th:data-request-id="${messSessionItem.id}"
                                                onclick="openFeedbackModal(this)">
                                             <span th:text="#{message.label.confirm.delivery}"></span>
                                             </button> 
                                             <!-- Food not delivered button -->
														<button type="button"
															th:id="${'notDeliverButton_' + messSessionItem.id}"
															th:if="${messSessionItem.sessionName != null 
                                                            && messSessionItem.foodDeliveryStatus != null 
                                                                 && !messSessionItem.foodDeliveryStatus
                                                                 && sickFood.requestDate != null
                                                            && sickFood.requestDate <= T(java.time.LocalDate).now()}"
															class="btn btn-sm btn-warning" style="margin-left: 5px;"
															th:data-session-id="${messSessionItem.sessionName}"
															th:data-request-id="${messSessionItem.id}"
															onclick="openFoodDeliveryModal(this)">
															<span th:text="#{message.label.food.not.delivery}"></span>
															<span> - </span> <span
																th:text="${messSessionItem.messSession == 'BF' ? 'Break Fast' 
                                                             : messSessionItem.messSession == 'LC' ? 'Lunch' 
                                                             : messSessionItem.messSession == 'DR' ? 'Dinner' 
                                                             : 'Unknown'}"></span>
														</button>

													</span>
                                          <!-- Show '-' if all badges are skipped -->
                                          <span th:if="${sickFood.messSessionStatus == null || sickFood.messSessionStatus.isEmpty()}">--</span>
                                       </div>
                                    </td>
                                    <td class="text-center">
                                       <a type="button" class="btn btn-outline-primary btn-sm me-2" 
                                          data-bs-toggle="tooltip"  data-bs-title="Edit" th:href="@{|/sickFoodRequest/${sickFood.id}|}">
                                       <i class="fa-solid fa-pencil"></i>
                                       </a> 
                                    </td>
                                    <td class="text-center"><span
                                       th:if="${sickFood.medicalProofDoc == null}"
                                       th:text="#{message.label.na}"></span> <a
                                       th:if="${sickFood.medicalProofDoc!= null}"
                                       th:href="@{#{url.sick.food.request} + #{url.download} + '/' + ${sickFood.id}}"
                                       data-bs-toggle="tooltip"
                                       th:data-bs-title="#{message.label.downloadFile}"> <i
                                       class="fa fa-download" aria-hidden="true"></i>
                                       </a>
                                    </td>
                                 </tr>
                                 <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="7" class="text-center">
                                       <span th:text="#{message.label.no.data.available}"></span>
                                    </td>
                                 </tr>
                              </tbody>
                           </table>
                        </div>
                        <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </main>
      <!--  <div th:id="modalDiv"></div> -->

      <th:block th:replace="~{common/modal/feedback-modal}"></th:block>
      <th:block th:replace="~{common/modal/warning-modal :: contents(id = null, headerText=#{message.label.warning},bodyText=#{message.label.deliver.status})}"></th:block>
      <!-- Footer-->
      <th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
         <script th:src="@{/assets/js/mess/sick-food-request.js}"></script>
         <script th:inline="javascript">
            const baseURL = /*[[#{url.sick.food.request}]]*/ '';
            const status = /*[[#{url.delivery.status}]]*/ '';
            const foodNotDeliverStatus = /*[[#{url.not.food.deliver}]]*/ '';
         </script>
      </th:block>
      <!-- Footer-->
   </body>
</html>
