<!DOCTYPE html>
<html lang="en">
   <head th:replace="~{common/head :: common_header(~{::link})} ">
      <!--If you want to specify custom styling, create its own css page and link it here.-->
   </head>
   <body>
       <header th:replace="~{common/student-dashboard-header:: title(${headerForm}, 'Student Complaint Form',
	 	'Dashboard', 'Add New', null,null, 'Back', null,#{url.dashboard}+#{url.student}, null)}">
	</header>
      <!-- //Main-->
      <main id="main" class="main">
         <div class="row">
            <div class="col-lg-12">
               <div class="card main-card mt-4">
                  <div class="card-body themeForm">
                     <form action="#" method="get">
                        <div class="row mb-3">
                           <div class="col-auto">
                              <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                              <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
                                 data-bs-title=" Use Complaint Type, Compaliant About to search"></i>
                              </label>
                              <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
                           </div>
                           <div class="col-auto mt-3">
                              <button class="btn btn-secondary mt-4" type="submit">
                              <span th:text="#{message.label.search}"></span>
                              </button>
                           </div>
                        </div>
                     </form>
                     <div class="mb-4">
                        <div class="table-responsive themeTable">
                           <table id="studentComplaintListDataTable" class="table table-bordered nowrap w-100">
                              <thead>
                                 <tr>
                                    <th th:text="#{message.label.submitted.date}"></th>
                                    <th th:text="#{message.label.complaint.type}"></th>
                                    <th th:text="#{message.label.complaint.about}"></th>
                                    <th th:text="#{message.label.complaint.description}"></th>
                                    <th th:text="#{message.label.uploaded.file}"></th>
                                 </tr>
                              </thead>
                              <tbody>
                                 <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="complaintForm, iter: ${form.paginationList.getContent()}">
                                  <td th:text="${complaintForm.createdAt != null ? #temporals.format(complaintForm.createdAt, #messages.msg('date.format')).format(complaintForm.createdAt, #messages.msg('date.format')) : #messages.msg('message.label.na')}"></td>
                                    <td th:text="${#strings.capitalize(complaintForm.stuComplaintType)}"></td>
                                    <td th:text="${complaintForm.complaints}"></td>
                                    <td
                                       th:text="${#strings.length(complaintForm.complaintDesc) > 50 ? #strings.substring(complaintForm.complaintDesc, 0, 50) + '...' : complaintForm.complaintDesc}"
                                       th:attr="title=${complaintForm.complaintDesc}"></td>
											<td><span
												th:if="${complaintForm.fileUpload == #messages.msg('message.label.not.applicable.short.form')}"
												th:text="#{message.label.na}"></span> <a
												th:if="${complaintForm.fileUpload != #messages.msg('message.label.not.applicable.short.form')}"
												th:href="@{#{url.student.complaint.form} + #{url.download} + '/' + ${complaintForm.complaintId}}"
												data-bs-toggle="tooltip"
												th:data-bs-title="#{message.label.downloadFile}"> <i
													class="fa fa-download" aria-hidden="true"></i>
											</a></td>

										</tr>
                                 <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="6" class="text-center">
                                       <span th:text="#{message.label.no.data.available}"></span>
                                    </td>
                                 </tr>
                              </tbody>
                           </table>
                        </div>
                        <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </main>
      <div th:id="modalDiv"></div>
      <th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>
      <!-- Footer-->
      <th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
         <script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
         <script th:src="@{/assets/js/student/student-complaint.js}"></script>
         <script th:inline="javascript">
            const baseURL = /*[[#{url.student.complaint.form}]]*/ '';
            
         </script>
      </th:block>
      <!-- Footer-->
   </body>
</html>
