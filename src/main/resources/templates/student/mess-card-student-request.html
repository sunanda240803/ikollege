<!DOCTYPE html>
<html lang="en">
   <head th:replace="~{common/head :: common_header(~{::link})} ">
      <!--If you want to specify custom styling, create its own css page and link it here.-->
   </head>
   <body>
       <header th:replace="~{common/student-dashboard-header:: title(${headerForm}, 'Mess To Card Account Transfer',
	 	'Dashboard', 'Add New', null,null, 'Back', null, #{url.dashboard}+#{url.student}, null)}">
	</header>
      <main id="main" class="main">
         <div class="row">
            <div class="col-lg-12">
               <div class="card main-card mt-4">
                  <div class="card-body themeForm">
                     <form action="#" method="get">
                        <div class="row mb-3">
                           <div class="col-auto">
                              <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                              <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
                                 data-bs-title="Use Student ID, Current Balance, Requested Amount, Request Date,
                                 Status and Transferred Date to search"></i>
                              </label>
                              <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
                           </div>
                           <div class="col-auto mt-3">
                              <button class="btn btn-secondary mt-4" type="submit">
                              <span th:text="#{message.label.search}"></span>
                              </button>
                           </div>
                        </div>
                     </form>
                     <div class="mb-4">
                        <div class="table-responsive themeTable">
                           <table id="assetConfigTable" class="table table-bordered nowrap w-100">
                              <thead>
                                 <tr>
                                    <th>
                                       <span th:text="#{message.label.studentID}"></span>
                                    </th>
                                    <th class="text-end">
                                       <span th:text="#{message.label.current.balance}"></span>
                                       <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-end">
                                       <span th:text="#{message.label.requested.amount}"></span>
                                       <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th>
                                       <span th:text="#{message.label.request.date}"></span>
                                    </th>
                                    <th >
                                       <span th:text="#{message.label.status}"></span>
                                    </th>
                                    <th>
                                       <span th:text="#{message.label.transferred.date}"></span>
                                    </th>
                                 </tr>
                              </thead>
                              <tbody>
                                 <tr
                                    th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="messToCardForm, iter: ${form.paginationList.getContent()}">
                                    <td th:text="${messToCardForm.studentId}"></td>
                                    <td class="text-end currency" th:text="${messToCardForm.netBalance != null && messToCardForm.netBalance != '' ? messToCardForm.netBalance : '--'}"></td>
                                    <td class="text-end currency" th:text="${messToCardForm.transferAmount}"></td>
                                    <td
                                       th:text="${#temporals.format(messToCardForm.requestDate, #messages.msg('date.format'))}"></td>
                                    <td th:text="${messToCardForm.requestedStatus}"></td>
                                    <td th:text="${messToCardForm.requestedStatus eq 'Pending' ? '--' : #temporals.format(messToCardForm.transferredDate, #messages.msg('date.format'))}"></td>

                                 </tr>
                                 <tr
                                    th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="6" class="text-center"><span
                                       th:text="#{message.label.no.data.available}"></span></td>
                                 </tr>
                              </tbody>
                           </table>
                        </div>
                        <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </main>
      <div th:id="modalDiv"></div>
      <!-- Footer-->
      <th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
         <script th:src="@{/assets/js/mess/mess-card-student-request.js}"></script>
         <script th:inline="javascript">
            const baseURL = /*[[#{url.mess.to.card.transfer}]]*/ '';
            const messages = {
                amountRequired: /*[[${#messages.msg('message.label.amount.required')}]]*/ '',
                wholeNumbersOnly: /*[[${#messages.msg('message.label.whole.numbers.only')}]]*/ '',
                amountGreaterThanZero: /*[[${#messages.msg('message.label.amount.greater.than.zero')}]]*/ '',
                insufficientBalance: /*[[${#messages.msg('message.label.insufficient.balance')}]]*/ '',
                amountLessThan1000: /*[[${#messages.msg('message.label.amount.less.than')}]]*/ '',
                checkPreviousRequest: /*[[${#messages.msg('message.label.amount.check.previous.transfer')}]]*/ ''
                	
            };
         </script>
      </th:block>
      <!-- Footer-->
   </body>
</html>
