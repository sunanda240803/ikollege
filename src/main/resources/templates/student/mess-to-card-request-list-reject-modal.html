<!-- Form Module -->
<div
	th:replace="~{common/modal-template :: modal('reject-request-modal', ~{::modalHeader}, ~{::modalBody}, Cancel, null, Save, null, null)}">
	<modalHeader> <span
		th:text="#{message.label.rejection.details}"></span> </modalHeader>
	<modalBody>
		<form class="themeForm" method="post" id="rejectRequestId">
			<div class="row">
				<div class="col-lg-12 mb-3">
					<label class="form-label">
						<span th:text="#{message.label.reason}"></span> 
						<th:block th:replace="~{common/template/mandatory-symbol}" />
					</label>
					<textarea class="form-control required-input" id="reason"
						th:attr="placeholder=#{message.placeholder.reason}" required
						maxlength="500" oninput="trimSpaces(this)">
            		</textarea>
					<div class="invalid-feedback" th:text="#{message.validation.reason.required}"></div>
				</div>
			</div>
		</form>
	</modalBody>
</div>
