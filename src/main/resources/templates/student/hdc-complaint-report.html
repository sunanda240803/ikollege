<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get" id="hdcComplaintId">
							<div class="row mb-4">
								<div class="col-lg-3 mb-3">
									<label for="messListName" class="form-label">
										<span th:text="#{message.label.hostel.name}"></span>
									</label> 
									<select id="hostelId" class="selectpicker required-select-input" name="hostelId"
										data-live-search="true" required>
						                 <option value="" th:text="#{message.label.select}+' '+#{message.label.hostel.name}"></option>
										<option th:each="hostel : ${hostelList}"
											th:value="${hostel.id}" th:text="${hostel.hostelName}">
										</option>
									</select>
								</div>
								<div class="col-lg-3 mb-3">
									<label class="form-label"> 
										<span th:text="#{message.label.complaint}+' '+#{message.label.from.date}"></span>
									</label> 
									<input type="date" class="form-control" id="complaintFromDate" name="complaintFromDate">
								</div>
								<div class="col-lg-3 mb-3">
									<label class="form-label"> 
										<span th:text="#{message.label.complaint}+' '+#{message.label.to.date}"></span>
									</label> 
									<input type="date" class="form-control" id="complaintToDate" name="complaintToDate">
								</div>
								<div class="col-auto mt-3">
									<input type="hidden" id="pageVal" th:value="${form.pageVal}"/>
									<input type="hidden" id="sizeVal" th:value="${form.size}"/>
									<button id="getData" class="btn btn-lgtblue mt-4" type="button" onclick="getHdcComplaintReport()">
										<i class="fa-solid fa-file-excel"></i>
										<span th:text="#{message.label.get.report}"></span>
									</button>
								</div>
							</div>
                        	<div class="d-none">
	                        	<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
	                        </div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:inline="javascript">
			const baseURL = /*[[#{url.dean.approval.hdc.complaint}]]*/'';
			const downloadExcelURL = /*[[#{url.excel.download}]]*/'';
			const reportURL = /*[[#{url.report}]]*/'';
		</script>
		<script th:src="@{/assets/js/student/hdc-complaint-report.js}"></script>
	</th:block>
	<!-- Footer-->
</body>

</html>
