<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.5/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/3.2.5/css/buttons.bootstrap5.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/staterestore/1.4.3/css/stateRestore.bootstrap5.css">

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
<!--                    <span th:if ="${showUploadCard != null}">-->
<!--                        <th:block th:replace="~{common/dean-upload-file}"></th:block>-->
<!--                    </span>-->
                    <input type="hidden" th:value="${form.getAdditionalParam()}">
                    <th:block th:replace="~{common/dean-dashboard-filter :: formInputs(${form.getAdditionalParam()})}"></th:block>
                    <input type="hidden" th:value="${excelUrl}" id="excelUrl">
<!--                    <input type="hidden" th:value="${addNewUrl}" id="addNewUrl">-->
                    <th:block th:replace="~{common/dean-allotment-common-table}"></th:block>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- //Main-->

<div th:id="modalMailDiv"></div>
<div th:id="modalDiv"></div>

<!-- Delete Modal-->
<th:block
        th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>

<!-- Resend Email Modal-->
<th:block th:replace="~{common/modal/resend-mail-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.resend.email.submission})}">
</th:block>

<!-- Approve Modal-->
<th:block th:replace="~{common/modal/approval-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.approve.confirmation.message})}">
</th:block>

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.3.5/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/staterestore/1.4.3/js/dataTables.stateRestore.js"></script>
    <script src="https://cdn.datatables.net/staterestore/1.4.3/js/stateRestore.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.5/js/dataTables.buttons.js"></script>
    <script src="https://cdn.datatables.net/buttons/3.2.5/js/buttons.bootstrap5.js"></script>
    <script th:src="@{/assets/js/dean/dean-dashboard.js}"></script>
    <script th:src="@{/assets/js/data-table-common.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.hostel.room.info}]]*/ '';

        const getRoomListURL =/*[[#{url.room.list}]]*/ '';
        const getSeatListURL =/*[[#{url.seat.list}]]*/ '';
    </script>
</th:block>

</body>
</html>
