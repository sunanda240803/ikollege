<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>
<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <div class="row">
                        <div class="col-12">
                            <form action="#" method="get">
                                <div class="row mb-3">
                                    <div class="col-auto">
                                        <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                                            <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                               data-bs-title="Use Category Name and Description to search"></i>
                                        </label>
                                        <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
                                    </div>
                                    <div class="col-auto mt-3">
                                        <button class="btn btn-secondary mt-4" type="submit">
                                            <span th:text="#{message.label.search}"></span>
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div class="row">
                        <div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
                        <div class="table-responsive themeTable">
                            <table id="configTable" class="table table-bordered nowrap w-100">
                                <thead>
                                <tr>
                                    <th th:text="#{message.label.sl.no}"></th>
                                    <th th:text="#{message.label.effective.date}"></th>
                                    <th th:text="#{message.label.category.name}"></th>
                                    <th th:text="#{message.label.description}"></th>
                                    <th class="text-end">
                                        <span th:text="#{message.label.hostel.rent.per.day}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-end">
                                        <span th:text="#{message.label.breakfast}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-end">
                                        <span th:text="#{message.label.lunch}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-end">
                                        <span th:text="#{message.label.dinner}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-end">
                                        <span th:text="#{message.label.rebate.charges}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-center" th:text="#{message.label.action}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="accom, iter: ${form.paginationList.getContent()}">
                                    <td th:text="${iter.count}"></td>
                                    <td th:text="${#temporals.format(accom.effectiveDate, #messages.msg('date.format'))}"></td>
                                    <td th:text="${accom.categoryName}"></td>
                                    <td th:text="${accom.description}"></td>
                                    <td class="text-end currency" th:text="${accom.accStayAmnt}"></td>
                                    <td class="text-end currency" th:text="${accom.breakfastCoupon}"></td>
                                    <td class="text-end currency" th:text="${accom.lunchCoupon}"></td>
                                    <td class="text-end currency" th:text="${accom.dinnerCoupon}"></td>
                                    <td class="text-end currency" th:text="${accom.rebateCharges}"></td>
                                    <td>
                                        <div class="d-flex justify-content-center gap-1">
                                            <button type="button" class="btn btn-outline-primary btn-sm edit" id="edit"
                                                    th:data-id="${accom.id}" data-bs-toggle="tooltip" data-bs-title="Edit"
                                            onclick="addEdit(this)">
                                                <i class="fa-solid fa-pencil"></i>
                                            </button>
                                            <button type="button" class="btn btn-outline-danger btn-sm" id="delete" data-bs-toggle="tooltip"
                                                    th:id="${'deleteAccom_'+accom.id}"
                                                    onclick="deleteTempAccomConfig(this);"
                                                    th:data-id="${accom.id}"
                                                    data-bs-title="Delete">
                                                <i class="fa fa-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="10" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
                                </tr>
                                </tbody>
                            </table>
                            <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<div th:id="modalDiv"></div>

<!-- Delete Modal-->
<th:block
        th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/hostel/temporary-accommodation-config.js}"></script>
    <script th:inline="javascript">
    const baseURL = /*[[#{url.temporary.accommodation.config}]]*/ '';
    const deleteURL = /*[[#{url.delete}]]*/ '';
    const downloadURL = /*[[#{url.dean.approval.excel.report.download}]]*/ '';
    </script>
</th:block>
<!-- Footer-->
</body>

</html>
