<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
  <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
  <header th:replace="~{common/header:: title(${headerForm})}"></header>

  <!-- //Main-->

  <main id="main" class="main">
    <!--School Info Section-->
    <div class="row">
      <div class="col-lg-12">
        <div class="card main-card mt-4">
          <div class="card-body themeForm">
            <th:block th:insert="~{common/show-wise-tabs::tabs(tabList='Show wise list', screen='#{url.show.wise.details}')}"></th:block>
            <form th:action="@{#{url.show.wise.details}}" method="get">
		                  <div class="row mb-4">
		                  	<div class="col-lg-3">
				                <label class="form-label" for="eventName">
				                    <span th:text="#{message.label.event.name}"></span>
				                    <th:block th:replace="~{common/template/mandatory-symbol}" />
				                </label>
				                 <select class="selectpicker required-select-input" data-live-search="true" th:name="showEventMaster.id" th:id="eventId"
				                   	 	 th:value="${eventId}">
				                    <option value="" th:text="#{message.label.select}"></option>
				                  	<option th:each="event:${eventList}"
										th:value="${event.id}" th:text="${event.eventName}"
										th:selected="${event.id.toString() == eventId}">
									</option>
				                </select>
				                <div class="invalid-feedback" id="eventVal" th:text="#{message.validation.event.name.required}"></div>
				            </div>
				            <div class="col-auto margin-top-search" >
								<input type="hidden" id="pageVal" th:value="${form.pageVal}"/>
								<input type="hidden" id="sizeVal" th:value="${form.size}"/>
								<button type="button" id="searchButton" class="btn btn-lgtblue"
										onclick="return validateSearchFeild()"><i
										class="fa-solid fa-database"></i> 
										<span th:text="#{message.button.get.data}"></span>
								</button>
							</div>
							<div class="col d-flex justify-content-end align-items-center">
			                    <div class="col-auto me-3">
		                     	  	<label for="search" class="form-label">
			                          <span th:text="#{message.label.keyword}"></span>
			                          <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
			                             th:data-bs-title=" #{message.label.show.wise.title}">
			                          </i>
		                        	</label>
			                        <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
			                    </div>
			                    <div class="col-auto mt-3">
			                       <button class="btn btn-secondary mt-4" type="button" onclick="return validateSearchFeild();">
			                          <span th:text="#{message.label.search}"></span>
			                       </button>
			                    </div>
			                  </div>
			                 </div>
		               	</form>
		               <form class="themeForm g-3 needs-validation">
						   <div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
		                  <div class="table-responsive themeTable">
		                     <table id="MyDataTable" class="table table-bordered  nowrap w-100">
		                        <thead>
		                           <tr>
		                              <th th:text="#{message.label.show.name}"></th>
		                              <th th:text="#{message.label.show.desc}"></th>
		                              <th th:text="#{message.label.reg.start.date}"></th>
		                              <th th:text="#{message.label.reg.end.date}"></th>
		                              <th class="text-center" th:text="#{message.label.max.seat.count}"></th>
		                              <th class="text-center" th:text="#{message.label.action}"></th>
		                           </tr>
		                        </thead>
		                        <tbody>
		                           <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											th:each="showWise, iter: ${form.paginationList.getContent()}">
		                              <td th:text="${showWise.showName}"></td>
		                              <td th:text="${showWise.showDescr}"></td>
		                              <td th:text="${#temporals.format(showWise.regStartingDate, #messages.msg('date.format'))}"></td>
		                              <td th:text="${#temporals.format(showWise.regEndingDate,#messages.msg('date.format'))}"></td>
		                              <td class="text-center" th:text="${showWise.maxSeatCount}"></td>
		                              <td class="text-center">
		                                 <button type="button" class="btn btn-outline-primary btn-sm me-2"
												data-bs-toggle="tooltip" th:data-show-id="${showWise.id}"
												onclick="editShowWiseDetails(this);" th:data-bs-title="#{message.label.edit}">
												<i class="fa-solid fa-pencil"></i>
										 </button>
		                              </td>
		                           </tr>
		                           <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
										<td colspan="7" class="text-center">
											<span th:text="#{message.label.show.list.data}"></span>
										</td>
								 </tr>
		                        </tbody>
		                     </table>
		                  </div>
		               </form>
		               <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
		            </div>
		         </div>
		      </div>
		   </div>
		</main>

		<!-- Modal-->
		<div th:id="showWiseModalDiv"></div>
		<div th:id="showSeatModalDiv"></div>
		<!-- //Modal-->
		
		<!-- Footer-->
		<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/common.js}"></script>
		<script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
		   <script th:src="@{/assets/js/hostel/show-wise-details.js}"></script>
		   <script th:inline="javascript">
				const baseURL = /*[[#{url.show.wise.details}]]*/ '';
				const checkShowNameExistURL = /*[[#{url.show.name.exist}]]*/ '';
				const showNameExistMessage = /*[[${#messages.msg('message.label.show.name.exist')}]]*/'';
		   </script>
		</th:block>
		<!-- //Footer-->
	</body>
</html>
