<div th:replace="~{common/modal-template ::
   modal('guest-coupoun-approval-modal', ~{::modalHeader}, ~{::modalBody}, null, null, null, null, 'lg')}">
    <modalHeader th:text="#{message.label.confirmation}"></modalHeader>
    <modalBody>
        <form class="themeForm" id="guestCouponApproval" th:action="@{#{url.hostel.guest.coupon.request}+#{url.approval}}"
              th:object="${guestCouponRequestDTO}" method="post">
            <div class="row">
				<input type="hidden" th:name="requestId" th:value="${requestId}" th:id="id" />
            </div>
        </form>
    </modalBody>
</div>
