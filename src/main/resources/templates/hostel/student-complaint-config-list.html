<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>

<!-- //Main-->
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
                    <form action="#" method="get">
                        <div class="row mb-3">
                            <div class="col-auto">
                                <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                                    <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                       th:data-bs-title="#{message.student.complaint.config.search.title}">
                                    </i>
                                </label>
                                <input type="text" class="form-control" name="search" id="search"
                                       th:value="${form.search}">
                            </div>
                            <div class="col-auto mt-3">
                                <button class="btn btn-secondary mt-3" type="submit">
                                    <span th:text="#{message.label.search}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                    <div class="table-responsive themeTable">
                        <table id="MyDataTable" class="table table-bordered  nowrap w-100">
                            <thead>
                            <tr>
                                <th th:text="#{message.label.submitted.date}"></th>
                                <th th:text="#{message.label.complaint.type}"></th>
                                <th th:text="#{message.label.complaint.name}"></th>
                                <th th:text="#{message.label.email.id}"></th>
                                <th  class="text-center" th:text="#{message.label.action}"></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                th:each="studentComplaintConfig, iter: ${form.paginationList.getContent()}">
                                <td th:text="${#temporals.format(studentComplaintConfig.createdAt, #messages.msgOrNull('date.format'))}"></td>
                                <td th:text="${studentComplaintConfig.complaintType}"></td>
                                <td th:text="${studentComplaintConfig.complaintName}"></td>
                                <td th:text="${studentComplaintConfig.configMailId}"></td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center">
                                        <button type="button" class="btn btn-outline-primary btn-sm me-2"
                                                data-bs-toggle="tooltip" th:data-student-complaint-config-id="${studentComplaintConfig.id}"
                                                onclick="editStudentComplaintConfig(this);" th:data-bs-title="#{message.label.edit}">
                                            <i class="fa-solid fa-pencil"></i>
                                        </button>
                                        <button type="button" class="btn btn-outline-danger btn-sm"
                                                data-bs-toggle="tooltip" th:id="${'deleteEvent_'+studentComplaintConfig.id}"
                                                onclick="deleteStudentComplaintConfig(this);"
                                                th:data-student-complaint-config-id="${studentComplaintConfig.id}" th:data-bs-title="#{message.label.delete}">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                <td colspan="6" th:text="#{message.label.no.data.available}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- //Main-->

<!-- Modal-->
<div th:id="modalDiv"></div>

<!-- //Modal-->

<!-- Delete Modal-->
<th:block th:replace="~{common/modal/delete-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>
<!-- //Delete Modal-->

<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/hostel/student-complaint-config.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.student.complaint.config}]]*/ '';
        const getURL = /*[[#{url.get}]]*/ '';
        const deleteURL = /*[[#{url.delete}]]*/ '';
    </script>
</th:block>
<!-- //Footer-->
</body>
</html>
