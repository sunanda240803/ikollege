<!DOCTYPE html>
<html lang="en">
	<head th:replace="~{common/head :: common_header(~{::link})} ">
	    <!--If you want to specify custom styling, create its own css page and link it here.-->
	</head>

	<body>
		<header th:replace="~{common/header:: title(${headerForm})}"></header>
		<!-- //Main-->
		<main id="main" class="main">
		   <div class="row">
		      <div class="col-lg-12">
		         <div class="card main-card mt-4">
		            <div class="card-body">
		               <div class="table-responsive themeTable">
		                  <table id="MyDataTable" class="table table-bordered  nowrap w-100">
		                     <thead>
		                        <tr>
		                           <th th:text="#{message.label.from.date}"></th>
		                           <th th:text="#{message.label.to.date}"></th>
		                           <th class="text-end">
		                           	<span th:text="#{message.label.individual.room}"></span>
		                           	<i class="fa-solid fa-indian-rupee-sign"></i>
		                           </th>
		                           <th class="text-end" >
		                           	<span th:text="#{message.label.stay.with.student}"></span>
		                           	<i class="fa-solid fa-indian-rupee-sign"></i>
		                           </th>
		                           <th class="text-end">
		                              <span th:text="#{message.label.sharing.person}"></span>
		                              <i class="fa-solid fa-indian-rupee-sign"></i>
		                           </th>
		                           <th th:text="#{message.label.description}"></th>
		                           <th class="text-center"  th:text="#{message.label.action}"></th>
		                        </tr>
		                     </thead>
		                     <tbody>
		                        <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
									th:each="guestAccom, iter: ${form.paginationList.getContent()}">
								   <td th:text="${#temporals.format(guestAccom.fromDate, #messages.msg('date.format'))}"></td>
		                           <td th:text="${#temporals.format(guestAccom.toDate, #messages.msg('date.format'))}"></td>
		                           <td class="text-end currency" th:text="${guestAccom.individualRoomAmount}"></td>
		                           <td class="text-end currency" th:text="${guestAccom.amount}"></td>
		                           <td class="text-end currency" th:text="${guestAccom.individualRoomMultipleAmount}"></td>
		                           <td th:text="${guestAccom.description}"></td>
		                           <td class="text-center">
		                              <button type="button" class="btn btn-outline-primary btn-sm me-2"
										data-bs-toggle="tooltip" th:data-guest-id="${guestAccom.id}"
										onclick="editGuestAccommodationCharge(this);" th:data-bs-title="#{message.label.edit}">
										<i class="fa-solid fa-pencil"></i>
									</button>
		                           </td>
		                        </tr>
		                        <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
									<td colspan="6" class="text-center">
										<span th:text="#{message.label.no.data.available}"></span>
									</td>
								</tr>
		                     </tbody>
		                  </table>
		               </div>
		               <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
		            </div>
		         </div>
		      </div>
		   </div>
		</main>
		<!-- //Main-->

		<!-- Modal-->
		<div th:id="modalDiv"></div>
		<!-- //Modal-->
		
		<!-- Footer-->
		<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		   <script th:src="@{/assets/js/warden/guest-accomm-charge.js}"></script>
		   <script th:inline="javascript">
					const baseURL = /*[[#{url.guest.accomm.charges}]]*/ '';
				</script>
		</th:block>
		<!-- //Footer-->
	</body>
</html>
