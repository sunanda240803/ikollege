<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	 <header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<!--School Info Section-->
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
							<form action="#" method="get">
		                        <div class="row mb-3">
			        				<div class="col-auto">
			        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
			        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
			        							data-bs-title="Use Warden Name, Office No, Warden Email, Alternate Warden Email, Phone Number and LDAP User Name to search"></i>
			        					</label>
		                            	<input type="text" class="form-control" name="search" id="search"
		                                   th:field="${form.search}">
		                             </div>
		                             <div class="col-auto mt-3">
		                            	<button class="btn btn-secondary mt-4" type="submit">
		                            		<span th:text="#{message.label.search}"></span>
		                            	</button>
		                            </div>
		                        </div>
	                   		</form>
						<div class="mb-4">
							<div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
							<div class="table-responsive themeTable " id="myTable">
								<table id="wardenInfoList" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th class="text-center">
												<span th:text="#{message.label.sl.no}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.mess.inspection.warden.name}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.office.no}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.warden.email}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.alternate.warden.email}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.phone.number}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.ldap.username}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.action}"></span>
											</th>
										</tr>
									</thead>									
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											 th:each="wardenInfo, iter: ${form.paginationList.getContent()}">
											<td class="text-center" th:text="${form.paginationList.number * form.paginationList.size + iter.index + 1}"></td>
											<td class="text-center" th:text="${wardenInfo.wardenName}"></td>
											<td class="text-center" th:text="${wardenInfo.officeNo}"></td>
											<td class="text-center" th:text="${wardenInfo.wardenEmail}"></td>
											<td class="text-center" th:text="${wardenInfo.alternateEmail}"></td>
											<td class="text-center" th:text="${wardenInfo.phoneNumber}"></td>
											<td class="text-center" th:text="${wardenInfo.ldapUsername}"></td>
											<td class="text-center">
												<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" th:data="${wardenInfo.editUrl}"
														onclick="editDetails(this)" th:data-bs-title="#{message.label.edit}">
														<i class="fa-solid fa-pencil"></i>
												</button>
				                                <button type="button" class="btn btn-sm btn-outline-danger"
											            th:data="${wardenInfo.deleteUrl}"
											            th:onclick="deleteData(this)">
											        <i class="fa-solid fa-trash-can"></i>
											    </button>
				                            </td>									
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="12" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<!-- Delete Modal-->
	<th:block
		th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
	</th:block>
	
	<div th:id="modalDiv"></div>
	<!-- Footer-->
	
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/warden/warden-info.js}"></script>
		<script th:inline="javascript">
			const wardenInfoURL = /*[[#{url.warden.info}]]*/ '';
			const addURL = /*[[#{url.add}]]*/ '';
			const saveWardenInfoURL = /*[[#{url.save.warden.info}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
