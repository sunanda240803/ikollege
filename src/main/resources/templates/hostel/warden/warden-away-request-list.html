<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>
    <header th:replace="~{common/header:: title(${headerForm})}"></header>
    <main id="main" class="main">
        <div class="row">
            <div class="col-lg-12">
                <div class="card main-card mt-4">
                    <div class="card-body themeForm">
                        <div class="row" id="wardenAwayRequestListHeader">
                            <div class="row">
                                <div class="col-lg-12">
                                    <h2 class="tmsub-title"><span
                                            th:text="#{message.label.view.all.warden.details}"></span></h2>
                                </div>
                            </div>
                            <div class="col-lg-12 mb-3 d-flex align-items-end justify-content-end">
                                <div class="fs-5 d-flex align-items-end justify-content-end">
                                    <u class="text-tmPrimary">
                                        <a th:href="@{#{url.get.full.hostel.warden.details}}"  th:text="#{message.label.view.hostel.details}"></a>
                                    </u>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">							
						<div class="row mb-4">
						    <div class="col-lg-4">
						        <label class="form-label">Search</label>
						        <input type="text" id="tableSearch" class="form-control" placeholder="Search..." onkeyup="filterTable()">
						    </div>
						</div>
                        <div class="mb-4">
                            <div class="table-responsive themeTable">
                                <table id="wardenAwayRequestList" class="table table-bordered nowrap w-100">
                                    <thead>
                                        <tr>
                                            <th class="text-center" th:text="#{message.label.sl.no}"></th>
                                            <th class="text-center" th:text="#{message.label.hostel.name}"></th>
                                            <th class="text-center" th:text="#{message.label.warden.detail}"></th>
                                            <th class="text-center" th:text="#{message.label.away.from}"></th>
                                            <th class="text-center" th:text="#{message.label.away.to}"></th>
                                            <th class="text-center" th:text="#{message.label.away.description}"></th>
                                            <th class="text-center" th:text="#{message.label.incharge.details}"></th>
                                        </tr>
                                    </thead>
                                    <tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											 th:each="wardenAwayRequest, iter: ${form.paginationList.getContent()}">
											<td class="text-center" th:text="${form.paginationList.number * form.paginationList.size + iter.index + 1}"></td>
											<td class="text-center" th:text="${wardenAwayRequest.hostelName}"></td>
											<td class="text-center" th:utext="${wardenAwayRequest.wardenName + '<br>' + wardenAwayRequest.phoneNumber + '<br>' + wardenAwayRequest.wardenEmail}"></td>
											<td class="text-center" th:text="${wardenAwayRequest.awayFrom == null ?  #messages.msg('message.label.na') : #temporals.format(wardenAwayRequest.awayFrom,#messages.msg('date.format'))}"></td>											
											<td class="text-center" th:text="${wardenAwayRequest.awayTo == null ?  #messages.msg('message.label.na') : #temporals.format(wardenAwayRequest.awayTo,#messages.msg('date.format'))}"></td>
											<td class="text-center" th:text="${wardenAwayRequest.awayDescription}"></td>
											<td class="text-center" th:utext="${wardenAwayRequest.alternateWardenName + '<br>' + wardenAwayRequest.alternatePhoneNumber + '<br>' + wardenAwayRequest.alternateWardenEmail}"></td>																
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="12" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
                                </table>
                            </div>
                            <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
        <script th:src="@{/assets/js/warden/warden-away-req-list.js}"></script>
    </th:block>
    <!-- Footer -->
</body>

</html>
