<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form th:action="@{#{url.hostel.guest.coupon.request}}"
							method="get" th:object="${coupon}" id="guestCouponRequestForm">
							<div class="row mb-3">
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.student.name}"></span></label> <input
										type="text" class="form-control"
										id="studentName" th:field="*{name}"
										th:placeholder="#{message.placeholder.student.name}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.student.id}"></span></label> <input
										type="text" class="form-control" id="studentId"
										th:placeholder="#{message.placeholder.student.id}"
										th:field="*{studentId}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.dining.from.date}"></span></label> <input
										type="date" class="form-control" id="diningFromDateId"
										th:field="*{diningFrom}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.dining.to.date}"></span></label> <input
										type="date" class="form-control" id="diningToDateId"
										th:field="*{diningTo}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.submitted.from}"></span></label> <input
										type="date" class="form-control" id="submittedFromDate"
										th:field="*{submittedFrom}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.submitted.to}"></span></label> <input
										type="date" class="form-control" id="submittedToDate"
										th:field="*{submittedTo}">
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.category}"></span></label> <select
										class="selectpicker" data-live-search="true"
										th:field="*{category}" id="category">
										<option value=""
											th:text="#{message.label.select}+' '+#{message.label.category}"></option>
										<option th:each="category: ${categories}"
											th:value="${category.value}" th:text="${category.value}"></option>
									</select>
								</div>
								<div class="col-lg-2 mb-3">
									<label class="form-label"><span
										th:text="#{message.label.payment.status}"></span></label> <select
										class="selectpicker" data-live-search="true"
										th:field="*{paymentStatus}" id="paymentStatus">
										<option value=""
											th:text="#{message.label.select}+' '+#{message.label.payment.status}"></option>
										<option th:each="status: ${paymentStatuses}" th:value="${status.value}" th:text="${status.value}"></option>
									</select>
								</div>
								<div class="col-lg-2">
									<input type="hidden" id="pageVal" th:value="${form.pageVal}"/>
									<input type="hidden" id="sizeVal" th:value="${form.size}"/>
									<button type="submit" id="getData" class="btn btn-lgtblue px-4"
										style="margin-top: 38px" onclick="getGuestCouponList()">
										<i class="fa-solid fa-database"></i> <span
											th:text="#{message.button.get.data}"></span>
									</button>
								</div>
							</div>
						</form>

						<div class="mb-4">
							<div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
							<div class="table-responsive themeTable">
								<table id="guestCouponRequest"
									class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th th:text="#{message.label.submitted.date}"></th>
											<th th:text="#{message.label.category}"></th>
											<th th:text="#{message.label.student.name}"></th>
											<th th:text="#{message.label.student.id}"></th>
											<th th:text="#{message.label.mess.name}"></th>
											<th th:text="#{message.label.dining.from}"></th>
											<th th:text="#{message.label.dining.to}"></th>
											<th th:text="#{message.label.payment.status}"></th>
											<th th:text="#{message.label.mess.session}"></th>
											<th class="text-end"><span
												th:text="#{label.total.amount}"></span></th>
											<th th:text="#{message.label.approval.status}"></th>
											<th class="text-center" th:text="#{message.label.action}"></th>
										</tr>
									</thead>
									<tbody>
										<tr
											th:if="${form.getList() != null}"
											th:each="coupon, iterator: ${form.getList()}"
											th:classappend="${coupon.activeFlag == 'N'} ? 'table-danger'">
											<td th:attr="data-order=${coupon.createdAt != null ? coupon.createdAt : ''}">
												<span th:text="${#temporals.format(coupon.createdAt.toLocalDateTime(), #messages.msg('date.format'))}"></span>
											</td>
											<td th:text="${coupon.category}"></td>
											<td th:text="${coupon.name}"></td>
											<td th:text="${coupon.studentId}"></td>
											<td th:text="${coupon.messName}"></td>
											<td>
												<span th:text="${#temporals.format(coupon.diningFrom.toLocalDate(), #messages.msg('date.format'))}"></span>
											</td>
											<td>
												<span th:text="${#temporals.format(coupon.diningTo.toLocalDate(), #messages.msg('date.format'))}"></span>
											</td>
											<td><th:block
													th:include="common/template/approval-status-badge :: statusBadge(null, ${coupon.paymentStatus})"></th:block>
											</td>
											<td>
												<div style="display: flex; justify-content: space-between;">
													<th:block
														th:replace="hostel/mess-session-template :: messSession(${coupon.numOfBreakfast}, 'BF', null, 'num')"></th:block>
													<th:block
														th:replace="hostel/mess-session-template :: messSession(${coupon.numOfLunch}, 'LC', null, 'num')"></th:block>
													<th:block
														th:replace="hostel/mess-session-template :: messSession(${coupon.numOfDinner}, 'DR', null, 'num')"></th:block>
                                                    <th:block
														th:replace="hostel/mess-session-template :: messSession(${coupon.numOfSnacks}, 'ET', null, 'num')"></th:block>
												</div>
											</td>
											<td class="text-end currency" th:text="${coupon.totalAmount}"></td>
                                            <td>
                                                <th:block th:if="${coupon.approvalStatus == 'Approved'}">
                                                    <th:block
                                                            th:include="common/template/approval-status-badge :: statusBadge(${coupon.approvalStatus}, null)"></th:block>
                                                </th:block>
                                                <th:block th:if="${coupon.approvalStatus == 'Pending'}">
                                                    <th:block th:if="${coupon.category == 'IITM Faculty'}">
                                                        <th:block th:if="${role == 'Y'}"> <!--If Software admin role-->
                                                            <button type="button" class="btn btn-success btn-sm me-2"
                                                                    th:data-request-id="${coupon.requestId}"
                                                                    onclick="approveGuestCoupon(this)">
                                                                <i class="fa-solid fa-circle-check me-1"></i>
																<span th:text="#{message.button.approve}"></span>
                                                            </button>
                                                        </th:block>
                                                        <th:block th:if="${role != 'Y'}">
                                                            <th:block
                                                                    th:include="common/template/approval-status-badge :: statusBadge('Pending', null)"></th:block>
                                                        </th:block>
                                                    </th:block>
                                                    <th:block th:if="${coupon.category != 'IITM Faculty'}">
                                                        <th:block th:if="${coupon.paymentStatus == 'Success'}">
                                                            <th:block th:if="${role == 'Y'}">
                                                                <!--If Software admin role-->
                                                                <button type="button"
                                                                        class="btn btn-success btn-sm me-2"
                                                                        th:data-request-id="${coupon.requestId}"
                                                                        onclick="approveGuestCoupon(this)">
                                                                    <i class="fa-solid fa-circle-check me-1"></i>
																	<span th:text="#{message.button.approve}"></span>
                                                                </button>
                                                            </th:block>
                                                            <th:block th:if="${role != 'Y'}">
                                                                <th:block
                                                                        th:include="common/template/approval-status-badge :: statusBadge('Pending', null)"></th:block>
                                                            </th:block>
                                                        </th:block>
                                                        <th:block th:if="${coupon.paymentStatus == 'Pending'}">
                                                            -
                                                        </th:block>
                                                    </th:block>
                                                </th:block>

                                            </td>
											<td>
												<div class="d-flex justify-content-center">
													<button id="viewButton" type="button"
														class="btn btn-outline-bluegray btn-sm edit me-2"
														th:data-request-id="${coupon.encryReqIdView}"
														data-bs-toggle="tooltip" data-bs-title="View"
														onclick="viewGuestCoupon(this)">
														<i class="fa-solid fa-eye"></i>
													</button>
                                                    <th:block th:if="${(coupon.category == 'Online Coupon' and coupon.paymentStatus == 'Success')
                                                        or (coupon.category != 'Online Coupon' and coupon.approvalStatus == 'Approved')}">
														<button id="printButton" type="button"
															class="btn btn-outline-pink btn-sm delete me-2" data-bs-toggle="tooltip"
															th:data-bs-title="#{message.label.download.guest.coupons.pdf}"
															th:data-request-id="${coupon.encryReqIdPdf}"
															onclick="downloadGuestCouponSPDF(this)">
															<i class="fa-solid fa-print"></i>
														</button>
													</th:block>
                                                    <th:block th:if="${coupon.category != 'Online Coupon'}">
                                                        <th:block th:if="${coupon.mailStatus != 'sent'}">
                                                            <th:block th:if="${coupon.paymentStatus == 'Success'}">
                                                                <th:block th:if="${coupon.approvalStatus == 'Approved' && role == 'Y'}">
                                                                    <button type="button"
                                                                        th:data-request-id="${coupon.requestId}"
                                                                        class="btn btn-outline-warning btn-sm delete me-2"
                                                                        data-bs-toggle="tooltip" title="Send Mail"
                                                                        onclick="resendMail(this)">
                                                                        <i class="fa-solid fa-paper-plane"></i>
                                                                    </button>
                                                                </th:block>
                                                            </th:block>
                                                        </th:block>
                                                        <th:block th:if="${coupon.mailStatus == 'sent'}">
                                                            <th:block th:if="${role == 'Y'}">
                                                                <button type="button"
                                                                    th:data-request-id="${coupon.requestId}"
                                                                    class="btn btn-outline-warning btn-sm delete me-2"
                                                                    data-bs-toggle="tooltip" title="Resend Mail"
                                                                    onclick="resendMail(this)">
                                                                    <i class="fa-solid fa-paper-plane"></i>
                                                                </button>
                                                            </th:block>
                                                        </th:block>
                                                    </th:block>
													<th:block th:if="${coupon.paymentStatus == 'Pending' && coupon.approvalStatus == 'Pending'}">
														<button id="deleteButton" type="button"
															class="btn btn-outline-danger btn-sm delete me-2"
															th:data-request-id="${coupon.requestId}"
															th:id="${'deleteReq_'+coupon.requestId}"
															data-bs-toggle="tooltip" title="Delete"
															onclick="deleteGuestCouponDetails(this)">
															<i class="fa-solid fa-trash-can"></i>
														</button>
													</th:block>
													<button id="resetButton" type="button" th:if="${(coupon.category == 'Online Coupon' and role == 'Y')}"
															class="btn btn-outline-secondary btn-sm reset me-2" data-bs-toggle="tooltip"
															th:data-bs-title="#{message.label.reset.retry.count}"
															th:data-request-id="${coupon.requestId}"
															onclick="resetCount(this)">
														<i class="fa-solid fa-refresh"></i>
													</button>
													<th:block th:if="${coupon.activeFlag == 'N' and coupon.category == 'Online Coupon' and role == 'Y'}">
														<button type="button"
																class="btn btn-outline-success btn-sm me-2"
																th:data-request-id="${coupon.requestId}"
																th:id="${'enableReq_'+coupon.requestId}"
																data-bs-toggle="tooltip"
																title="Enable"
																onclick="enableGuestCoupon(this)">

															<i class="fa-solid fa-lg fa-check-circle"></i>
														</button>
													</th:block>
												</div>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/dt-pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>
	
	<div th:id="modalApproveDiv"></div>
	<div th:id="modalMailDiv"></div>

	<th:block
		th:replace="~{common/modal/delete-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
	</th:block>

	<th:block
		th:replace="~{common/modal/resend-mail-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.send.mail})}">
	</th:block>
	
	<!-- Approve Modal-->
	<th:block th:replace="~{common/modal/approval-modal ::
	   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.approve.confirmation.message})}">
	</th:block>

	<th:block th:replace="~{common/modal/info-modal ::
	   contents(id='reset',headerText=#{message.label.confirmation},bodyText=#{message.label.reset.retry.count.confirmation.message})}">
	</th:block>

	<th:block th:replace="~{common/modal/info-modal ::
	   contents(id='enable',headerText=#{message.label.confirmation},bodyText=#{message.label.enable.confirmation})}">
	</th:block>

	<!-- Footer-->
	<th:block
		th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/data-table-common.js}"></script>
		<script th:src="@{/assets/js/guest/guest-coupon-request.js}"></script>
		<script th:inline="javascript">
			const dateFormat = /*[[#{date.format}]]*/'';
			const baseURL = /*[[#{url.hostel.guest.coupon.request}]]*/'';
			const pdfDownloadURL = /*[[#{url.pdf.download}]]*/'';
			const approveURL = /*[[#{url.approval}]]*/'';
			const resendMailURL = /*[[#{url.resend.mail}]]*/ '';
			const viewURL = /*[[#{url.view}]]*/ '';
			const resetUrl = /*[[#{url.reset}]]*/ '';
			const enableUrl = /*[[#{url.enable.coupon}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>
</html>
