<div th:replace="~{common/modal-template ::
   modal('feedback-modal', ~{::modalHeader}, ~{::modalBody}, Cancel, null, Save, null, 'md')}">
   <modalHeader th:text="#{message.label.feedback.question}"></modalHeader>
   <modalBody>
      <form class="themeForm" th:action="@{#{url.feedback}}" method="post" th:object="${feedbackQuestionDto}"
			id="feedback">
			<input type="hidden" th:value="${feedbackQuestionDto.feedbackQuesId}" th:name="feedbackQuesId"  />
         <div class="row">
            <div class="col-lg-12 mb-3">
               <label class="form-label">
                  <span th:text="#{message.label.weightage}"></span> 
                  <th:block th:replace="~{common/template/mandatory-symbol}" />
               </label>
               <div class="RadioCheckToggle" th:classappend="${#fields.hasErrors('feedbackWeightage')} ? 'is-invalid' : ''" >
                  <!-- Loop to generate radio buttons from 1 to 9 -->
                  <div th:each="num : ${#numbers.sequence(1, 9)}" class="d-inline-block">
                      <input type="radio" 
                             class="btn-check required-input" 
                             name="feedbackWeightage" 
                             th:id="'option' + ${num}" 
                             th:value="${num}" 
                              th:checked="${num == feedbackQuestionDto.feedbackWeightage}"  
                             autocomplete="off" required>
                      <label class="btn btn-sm btn-outline-primary" 
                             th:for="'option' + ${num}" 
                             th:text="${num}"></label>
                  </div>
               </div>
               <div class="invalid-feedback-frontEnd" style="display: none;" th:text="#{message.validation.weightage.required}"></div>
                <div class="invalid-feedback backendErrors" th:errors="*{feedbackWeightage}"></div>
            </div>
            <div class="col-lg-12 mb-3">
               <label class="form-label" for="description">
                  <span
                     th:text="#{message.label.description}"></span>
                  <th:block
                     th:replace="~{common/template/mandatory-symbol}" />
               </label>
               <textarea type="text" id="description" rows="2" class="form-control required-input"  th:field="*{feedbackQuesDesc}"
                  th:placeholder="#{message.placeholder.description}"  th:classappend="${#fields.hasErrors('feedbackQuesDesc')} ? 'is-invalid' : ''"  required></textarea>
               <div class="invalid-feedback-frontEnd" style="display: none;"
                  th:text="#{message.validation.description.required}"></div>
                    <div class="invalid-feedback backendErrors" th:errors="*{feedbackQuesDesc}"></div>
                  
            </div>
         </div>
      </form>
   </modalBody>
</div>
