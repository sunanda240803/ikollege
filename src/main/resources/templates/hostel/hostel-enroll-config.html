<!DOCTYPE html>
<html lang="en">
 <head th:replace="~{common/head :: common_header(~{::link})} "></head>
<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body">
			    		<form class="themeForm" th:action="@{#{url.hostel.enrollment.config}}" th:object="${hostelEnrollmentDto}"
			    			id="hostel-enroll-config-form" method="post">
			     			<input type="hidden" th:value="${hostelEnrollmentDto.id}" th:field="*{id}" id="id"/>
			     			<div class="row">
			        			<div class="col-lg-4 mb-3">
			          				<label class="form-label" for="startDate">
							            <span th:text="#{message.label.positive.balance.date}"></span>
							            <th:block th:replace="~{common/template/mandatory-symbol}" />
			          				</label>
							        <input type="date" class="form-control required-input" th:field="*{startDate}" id="startDate" required>
							        <div class="invalid-feedback" th:text="#{message.validation.start.date.required}"></div>
			        			</div>
			        			<div class="col-lg-4 mb-3">
			          				<label class="form-label" for="fromDate">
							            <span th:text="#{message.label.from.date}"></span>
							            <th:block th:replace="~{common/template/mandatory-symbol}" />
			          				</label>
			          				<input type="date" class="form-control future-date" th:field="*{fromDate}" id="fromDate">
							          <div class="invalid-feedback fd fromDateReq" th:text="#{message.validation.from.date.required}"></div>
							          <div class="invalid-feedback fd fromDateFuture" th:text="#{message.validation.from.date.current.future}"></div>
			        			</div>
			        			<div class="col-lg-4 mb-3">
			          				<label class="form-label" for="toDate">
							            <span th:text="#{message.label.to.date}"></span>
							            <th:block th:replace="~{common/template/mandatory-symbol}" />
			          				</label>
							        <input type="date" class="form-control future-date" th:field="*{toDate}" id="toDate">
							          <div class="invalid-feedback td toDateReq" th:text="#{message.validation.to.date.required}"></div>
							          <div class="invalid-feedback td toDateFuture" th:text="#{message.validation.to.date.current.future}"></div>
							          <div class="invalid-feedback td toDateAfterFromDate" th:text="#{message.validation.to.date.greater}"></div>
			        			</div>
			      			</div>
							<div class="col-lg-12 mt-2 mb-4">
								<div class="d-flex align-items-center justify-content-end">
									<button type="button" class="btn btn-aqua px-4 me-3"
										id="saveForm" onclick="return validateForm()">
										<i class="fa-solid fa-floppy-disk me-1"></i> <span
											th:text="#{message.button.save}"></span>
									</button>
								</div>
							</div>
			    		</form>
		    		</div>
				</div>
			</div>
		</div>
	</main>
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/hostel/hostel-enroll-config.js}"></script>
	</th:block>
</body>
</html>
