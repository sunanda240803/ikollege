<!DOCTYPE html>
<html lang="en">
   <head th:replace="~{common/head :: common_header(~{::link})} "></head>
   <body>
       <header th:replace="~{common/header:: title(${headerForm})}"></header>
      <!-- //Main-->
      <main id="main" class="main">
         <div class="row">
            <div class="col-lg-12">
               <div class="card main-card mt-4">
                  <div class="card-body themeForm">
                     <form action="#" method="get">
                        <div class="row mb-3">
                           <div class="col-auto">
                              <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                              <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
                                 data-bs-title=" Use Description, Weightage to search"></i>
                              </label>
                               <input type="text" class="form-control" name="search" id="search" th:value="${form.search}">
                           </div>
                           <div class="col-auto mt-3">
                              <button class="btn btn-secondary mt-4" type="submit">
                              <span th:text="#{message.label.search}"></span>
                              </button>
                           </div>
                        </div>
                     </form>
                     <div class="mb-4">
                        <div class="table-responsive themeTable">
                           <table id="studentLoginTable" class="table table-bordered nowrap w-100">
                              <thead>
                                 <tr>
                                    <th th:text="#{message.label.description}"></th>
                                    <th th:text="#{message.label.weightage}"></th>
                                    <th class="text-center"  th:text="#{message.label.action}"></th>
                                 </tr>
                              </thead>
                              <tbody>
                                 <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}" 
											th:each="feed, iter: ${form.paginationList.getContent()}">
											<td class="text-wrap" th:text="${feed.feedbackQuesDesc}"></td>
											<td th:text="${feed.feedbackWeightage}"></td>
											<td class="text-center">
												<div class="d-flex justify-content-center">
													<button type="button"
														class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip"
														th:data-feed-id="${feed.feedbackQuesId}"
														onclick="editFeedback(this);"
														th:data-bs-title="#{message.label.edit}">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" th:id="${'deleteFeed_'+feed.feedbackQuesId}"
														onclick="deleteFeed(this);"
														th:data-feed-id="${feed.feedbackQuesId}" data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button> 
												</div> 
											</td>
										</tr>
                              </tbody>
                           </table>
                        </div>
                        <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </main>
      <div th:id="modalDiv"></div>
      <th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>
      <!-- Footer-->
      <th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
         <script th:src="@{/assets/js/hostel/feedback.js}"></script>
         <script th:inline="javascript">
			const baseURL = /*[[#{url.feedback}]]*/'';
			 
		</script>
      </th:block>
      <!-- Footer-->
   </body>
</html>
