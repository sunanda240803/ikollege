<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})}"></head>

<body>

<header th:replace="~{common/header:: title(${headerForm})}"></header>
<main id="main" class="main">
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                    <form id="roomOccupancyReportForm"
                          th:action="@{#{url.room.occupancy.report}}"
                          th:object="${searchForm}" method="post" class="form-horizontal">

                        <div class="row mb-4">
                            <div class="col-lg-3 mb-3">
                                <label for="hostelId" class="form-label">
                                    <span th:text="#{message.label.hostel.name}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <select id="hostelId" th:field="*{hostelId}" class="form-select required-input" required>
                                    <option value="" selected="selected" th:text="#{message.label.select}"></option>
                                    <option value="-1" th:text="'All Hostels'"></option>
                                    <option th:each="hostel : ${hostels}"
                                            th:value="${hostel.id}"
                                            th:text="${hostel.hostelName}"></option>
                                </select>
                            </div>
                            <div class="col-lg-3 mb-3">
                                <label for="reportType" class="form-label">
                                    <span th:text="#{message.label.report.type}"></span>
                                    <th:block th:replace="~{common/template/mandatory-symbol}" />
                                </label>
                                <select id="reportType" th:field="*{reportType}" class="form-select" required>
                                    <option value="" selected="selected" th:text="#{message.label.select}"></option>
                                    <option value="seatVacancy" th:text="#{message.label.seat.vacancy}"></option>
                                    <option value="roomOccupancy" th:text="#{message.label.room.occupancy}"></option>
                                </select>
                            </div>
                            <div class="col-auto" style="margin-top: 38px">
                                <button type="button" id="downloadReport" class="btn btn-lgtblue" onclick="downloadRequestReport()">
                                    <i class="fa-solid fa-file-excel"></i>
                                    <span  th:text="#{message.button.export}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/hostel/room-occupancy-report.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.room.occupancy.report}]]*/ '';
        const excelDownloadUrl = /*[[#{url.room.occupancy.report.excel.report.download}]]*/ '';
    </script>
</th:block>
</body>
</html>
