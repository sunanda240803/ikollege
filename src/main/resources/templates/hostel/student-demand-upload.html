<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form class="themeForm mb-4" th:action="@{#{url.student.demand.upload}+#{url.save}}" method="post"
							enctype="multipart/form-data" th:object="${messBilling}" id="studentDemandId">
							<div class="row mb-3">
								<div class="col-lg-3 mb-3">
									<label for="voucherDate" class="form-label">
										<span th:text="#{message.label.voucher.date}"></span>
										<th:block th:replace="~{common/template/mandatory-symbol}" />
									</label> 
									<input type="date" class="form-control required-input" id="voucherDate" th:field="*{date}"
										required th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''">
									<div class="invalid-feedback backendErrors" th:errors="*{date}"></div>
									<div class="invalid-feedback-frontEnd" th:text="#{message.label.voucher.date}+ ' ' +#{message.validation.is.required}"></div>
								</div>
								<div class="col-lg-3 mb-3">
									<label for="description" class="form-label">
										<span th:text="#{message.label.description}"></span>
										<th:block th:replace="~{common/template/mandatory-symbol}" />
									</label>
									<textarea id="description" class="form-control required-input" th:field="*{description}"
										th:placeholder="#{message.placeholder.description}" required
										th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''">
									</textarea>
									<div class="invalid-feedback backendErrors" th:errors="*{description}"></div>
									<div class="invalid-feedback-frontEnd" th:text="#{message.label.description}+' '+#{message.validation.is.required}"></div>
								</div>
								<div class="col-lg-6 mb-3">
									<div class="row">
										<div class="col-lg-12">
											<h2 class="tmsub-title">
												<span th:text="#{message.label.bulk.upload.download}"></span>
											</h2>
										</div>
									</div>
									<div class="col-lg-12 mb-3 d-flex align-items-center">
										<span class="fs-5">
											<u class="text-tmPrimary">
												<a th:href="@{#{url.student.demand.upload}+#{url.template.download}}"
													id="excelTemplate" th:text="#{message.label.click.here.caps}">
												</a>
											</u>
											<span th:text="#{message.label.download.excel.student.demand.template}"></span>
										</span>
									</div>
								</div>
							</div>
							<div class="row">
								<div class="col-lg-12">
									<h2 class="tmsub-title">
										<span th:text="#{message.label.account.head.charges}"></span>
									</h2>
								</div>
							</div>
							<div class="row">
								<div class="col-lg-3 mb-3" th:each="input, iterStat : *{accheadInputs}">
									<label th:for="${'accheadInputs_' + iterStat.index}" th:text="${input.accheadName}" class="form-label"></label>
									<input type="text" th:id="${'accheadInputs_' + iterStat.index}"
										th:field="*{accheadInputs[__${iterStat.index}__].value}" class="form-control numeric"
										th:placeholder="#{message.label.enter} + ' ' + ${input.accheadName}" 
										oninput="checkInputLength(this)" data-maxlength="8"/>
									<input type="hidden" th:id="${'accheadName_' + iterStat.index}"
										th:field="*{accheadInputs[__${iterStat.index}__].accheadName}" />
									<input type="hidden" th:id="${'creditOrDebit_' + iterStat.index}"
										th:field="*{accheadInputs[__${iterStat.index}__].creditOrDebit}" />
									<input type="hidden" th:id="${'acchead_' + iterStat.index}"
										th:field="*{accheadInputs[__${iterStat.index}__].acchead}" />
								</div>
								<div class="col-lg-6 mb-3">
									<label class="form-label me-3" for="file">
										<span th:text="#{message.label.bulk.upload.file}"></span>
										<th:block th:replace="~{common/template/mandatory-symbol}" />
									</label>
									<th:block th:replace="~{common/template/drag-drop-file-upload-template::contents('uploadFile', 
                                       		'file', ${#messages.msg('message.accepted.document.types.xl')}, 'uploadDoc', 
                                       		null, ${#messages.msg('message.drag.drop.student.credit.debit.file.upload')})}">
                                    </th:block>
                                    <div class="selectFile2 d-none">
                                    	<span class="text-danger" th:text="#{message.validation.choose.file}"></span>
                                    </div>
									<div class="validFile d-none">
										<span class="text-danger" th:text="#{message.validation.invalid.file.format}"></span>
									</div>
								</div>
								<div class="col-lg-12 mb-3">
									<div class="d-flex align-items-center justify-content-end">
										<button type="button" onclick="return validateFile()" id="uploadButton" class="btn btn-purple">
											<i class="fa fa-upload" aria-hidden="true"></i>
											<span th:text="#{message.button.upload.file}"></span>
										</button>
									</div>
								</div>
							</div>
							<div class="errorText" th:if="${messBilling != null 
							    && messBilling.errorList != null 
							    && !messBilling.errorList.isEmpty()}">
								<ul>
									<li th:each="error : ${messBilling.errorList}">
										<span th:text="${error}" class="text-danger"></span>
									</li>
								</ul>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	<!-- Footer-->
	<th:block
		th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
		<script th:src="@{/assets/js/hostel/student-demand-upload.js}"></script>
	</th:block>
	<!-- Footer-->
</body>

</html>
