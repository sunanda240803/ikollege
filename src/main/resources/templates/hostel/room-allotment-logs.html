<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<!--School Info Section-->
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<div class="mb-4">
							<th:block th:fragment="formInputs(filters)">
								<form class="themeForm" method="get" id="searchRoomInfo">
									<input type="hidden" th:value='${filters}' id="filters">
									<input type="hidden" id="search" name="search">
									<div class="row mb-4">
										<div class="col-lg-2 mb-3">
											<label class="form-label"> 
												<span th:text="#{message.label.hostel.name}"></span>
											</label> 
											<select class="form-select" id="hostelName" name="hostelName">
												<option value="" th:text="#{message.label.select}"></option>
												<option th:each="hostelOrWardenList : ${hostelOrWardenList}" th:value="${hostelOrWardenList.id}"
														th:text="${hostelOrWardenList.hostelName}"
														th:selected="${filters.get('hostelName')} eq ${hostelOrWardenList.id}">
												</option>
											</select>
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> <span
												th:text="#{message.label.user.name}"></span>
											</label>
											<select class="form-select" id="userName" name="userName">
												<option value="" th:text="#{message.label.select}"></option>
												<option th:each="user : ${usersList}" th:value="${user}"
														th:text="${user}"
														th:selected="${user eq filters.get('userName')}">
												</option>
											</select>
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> 
												<span th:text="#{message.label.allotment}+' '+#{message.label.from.date}"></span>
											</label>
											<input type="date" class="form-control" id="allotedFromDate" name="allotedFromDate"
												th:value="${filters.get('allotedFromDate')}">
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> 
												<span th:text="#{message.label.allotment}+' '+#{message.label.to.date}"></span>
											</label>
											<input type="date" class="form-control" id="allotedToDate" name="allotedToDate"
												th:value="${filters.get('allotedToDate')}">
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> <span
												th:text="#{message.label.student.id}"></span>
											</label> 
											<input type="text" class="form-control" id="studentId" name="studentId" 
											th:value="${filters.get('studentId')}" />
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> <span
												th:text="#{message.label.student.candidate.email}"></span>
											</label> 
											<input type="text" class="form-control" id="email" name="email" th:value="${filters.get('email')}" />
										</div>
										<div class="col-lg-2 mb-3">
											<label class="form-label"> 
												<span th:text="#{message.label.allocation.type}"></span>
											</label>
											<select class="form-select" id="allocationType" name="allocationType">
												<option value="" th:text="#{message.label.select}"></option>
												<option th:each="status : ${allocationTypeMap}" th:value="${status.key}" 
													th:text="${status.value}"
													th:selected="${status.key eq filters.get('allocationType')}"></option>
											</select>							
										</div>
										<div class="col-lg-3">
											<input type="hidden" id="pageVal" th:value="${form.pageVal}" /> 
											<input type="hidden" id="sizeVal" th:value="${form.size}" />
											<button type="button" id="getData" class="btn btn-lgtblue px-4"
												style="margin-top: 38px" onclick="return checkAdvanceFilter();">
												<i class="fa-solid fa-database"></i> 
												<span th:text="#{message.button.get.data}"></span>
											</button>
										</div>									
									</div>
								</form>
							</th:block>							
							<div class="table-responsive themeTable " id="myTable">
								<table id="hostelRoomAllotmentLogs" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
											<th class="text-center">
												<span th:text="#{message.label.allotment.date}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.type}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.student.id}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.student.name}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.student.email}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.previous.hostel}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.previous.room}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.current.hostel}"></span>
											</th>											
											<th class="text-center">
												<span th:text="#{message.label.current.room}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.user}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.stay.from}"></span>
											</th>
											<th class="text-center">
												<span th:text="#{message.label.stay.to}"></span>
											</th>
										</tr>
									</thead>									
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
											 th:each="roomallotmentLogs, iter: ${form.paginationList.getContent()}">
											<td class="text-center" th:text="${roomallotmentLogs.allotmentDate}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.type}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.studentId}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.studentName}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.email}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.previousHostelName}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.previousRoomNo}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.currentHostelName}"></td>											
											<td class="text-center" th:text="${roomallotmentLogs.currentRoomNo}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.createdBy}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.stayFrom}"></td>
											<td class="text-center" th:text="${roomallotmentLogs.stayTo}"></td>											
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="12" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<!-- Footer-->
	
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<!-- Datad Table JS FILES -->
		<script th:src="@{/assets/js/hostel/room-info.js}"></script>
		<script th:src="@{/assets/js/dean/dean-dashboard.js}"></script>
	</th:block>
	<!-- Footer-->
</body>

</html>
