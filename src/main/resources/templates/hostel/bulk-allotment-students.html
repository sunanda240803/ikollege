<!DOCTYPE html>
<html lang="en">

<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<main id="main" class="main">
		<!--School Info Section-->
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form class="themeForm mb-4" th:action="@{#{url.bulk.allotment.students}+#{url.save}}" method="post"
							enctype="multipart/form-data" th:object="${studentsHostelAllotmentDto}" id="bulkUploadForm">
							<div class="row" id="bulkAllotments">
								<div class="row">
									<div class="col-lg-12">
										<h2 class="tmsub-title"><span th:text="#{message.label.bulk.upload.download}"></span></h2>
									</div>
								</div>
								<div class="col-lg-12 mb-3 d-flex align-items-center">
									<span class="fs-5">
										<u class="text-tmPrimary">
											<a th:href="@{#{url.bulk.allotment.students}+#{url.template.download}}"
												id="excelTemplate" th:text="#{message.label.click.here.caps}">
											</a>
										</u>
										<span th:text="#{message.label.bulk.allotments.students.click.here.note}"></span>
									</span>
								</div>
								<div class="row">
									<div class="col-lg-12">
										<h2 class="tmsub-title">
											<span th:text="#{message.label.bulk.allotments.students}"></span>
										</h2>
									</div>
								</div>
								<div class="col-lg-4 mb-3">
									<label class="form-label"><span th:text="#{message.label.allotment.type}"></span> 
										<th:block th:replace="~{common/template/mandatory-symbol}" /> 
									</label>
									<div class="checkRadio-bg form-control" id="uploadType"
										th:classappend="${#fields.hasErrors('uploadType')} ? 'is-invalid' : ''">
										<div class="form-check form-check-inline">
											<input class="form-check-input required-input" type="radio"
												name="uploadType" id="WithCheckHostel" value="WithCheckHostel" required>
											<label class="form-check-label" for="WithCheckHostel"
												th:text="#{message.label.check.allotment}"></label>
										</div>
										<div class="form-check form-check-inline">
											<input class="form-check-input required-input" type="radio"
												name="uploadType" id="WithoutCheckHostel" value="WithoutCheckHostel" required>
											<label class="form-check-label" for="WithoutCheckHostel"
												th:text="#{message.label.force.allotment}"></label>
										</div>
									</div>
									<div class="invalid-feedback backendErrors" th:errors="*{uploadType}"></div>
									<div class="invalid-feedback-frontEnd" th:text="#{message.validation.allotment.type.required}"></div>
								</div>
								<label class="form-label me-3" for="file"><span th:text="#{message.label.bulk.upload.file}"></span>
									<th:block th:replace="~{common/template/mandatory-symbol}" /></label>
								<div class="col-lg-4">
									<th:block th:replace="~{common/template/drag-drop-file-upload-template::contents('uploadFile', 
                                       		'file', ${#messages.msg('message.accepted.document.types.xl')}, 'uploadDoc', 
                                       		null, ${#messages.msg('message.drag.drop.hostel.accommo.file.upload')})}">
                                    </th:block>
                                    <div class="selectFile2 d-none"><span class="text-danger" th:text="#{message.validation.choose.file}"></span></div>
										<div class="validFile d-none"><span class="text-danger" th:text="#{message.validation.invalid.file.format}"></span></div>
									</div>
								<div class="col-lg-4 my-4">
									<button type="button"
											onclick=" return validateFile()" id="uploadFileButton"
											class="btn btn-purple">
										<i class="fa fa-upload" aria-hidden="true"></i> <span th:text="#{message.button.upload.file}"></span>
									</button>
								</div>
							</div>
							<div class="errorText" th:if="${studentsHostelAllotmentDto != null 
							    && studentsHostelAllotmentDto.errorList != null 
							    && !studentsHostelAllotmentDto.errorList.isEmpty()}">
							    <ul>
							        <li th:each="error : ${studentsHostelAllotmentDto.errorList}">
							            <span th:text="${error}" class="text-danger"></span>
							        </li>
							    </ul>
							</div>
							<hr>
							<th:block th:replace="~{common/log-content::content(${logTag})}"></th:block>
						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/common/drag-drop-file-upload.js}"></script>
		<script th:src="@{/assets/js/hostel/bulk-allotment.js}"></script>
		<script th:src="@{/assets/js/biometric/log.js}"></script>
	</th:block>
	<!-- Footer-->
</body>

</html>
