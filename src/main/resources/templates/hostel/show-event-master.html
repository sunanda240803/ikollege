<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
    <!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
<header th:replace="~{common/header:: title(${headerForm})}"></header>

<!-- //Main-->

<main id="main" class="main">
    <!--School Info Section-->
    <div class="row">
        <div class="col-lg-12">
            <div class="card main-card mt-4">
                <div class="card-body themeForm">
                	<th:block th:insert="~{common/show-wise-tabs::tabs(tabList='Show Even Master', screen='#{url.hostel.event.master}')}"></th:block>
                    <form action="#" method="get">
                        <div class="row mb-3 justify-content-end">
                            <div class="col-auto">
                                <label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
                                    <i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"
                                       th:data-bs-title="#{message.labelshow.event.master.search.title}">
                                    </i>
                                </label>
                                <input type="text" class="form-control" name="search" id="search"
                                       th:value="${form.search}">
                            </div>
                            <div class="col-auto mt-3">
                                <button class="btn btn-secondary mt-4" type="submit">
                                    <span th:text="#{message.label.search}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                    <form class="themeForm g-3 needs-validation">
                        <div th:replace="~{common/template/left-right-table-scroll-arrows.html :: leftRightArrow()}"></div>
                        <div class="table-responsive themeTable">
                            <table id="eventMasterTable" class="table table-bordered  nowrap w-100">
                                <thead>
                                <tr>
                                    <th th:text="#{message.label.event.name}"></th>
                                    <th th:text="#{message.label.event.description}"></th>
                                    <th th:text="#{message.label.sales.start.date}"></th>
                                    <th th:text="#{message.label.sales.end.date}"></th>
                                    <th th:text="#{message.label.event.start.date}"></th>
                                    <th th:text="#{message.label.event.end.date}"></th>
                                    <th th:text="#{message.label.accomm.req.start.date}"></th>
                                    <th th:text="#{message.label.accomm.req.end.date}"></th>
                                    <th class="text-center" th:text="#{message.label.currently.active}"></th>
                                    <th class="text-center">
                                        <span th:text="#{message.label.max.amount}"></span>
                                        <i class="fa-solid fa-indian-rupee-sign"></i>
                                    </th>
                                    <th class="text-center" th:text="#{message.label.action}"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}"
                                    th:each="events, iter: ${form.paginationList.getContent()}">
                                    <td th:text="${events.eventName}"></td>
                                    <td th:text="${events.eventDesc}"></td>
                                    <td th:text="${#temporals.format(events.eventStartingDate,'MMM dd, yyyy')}"></td>
                                    <td th:text="${#temporals.format(events.eventEndingDate,'MMM dd, yyyy')}"></td>
                                    <td th:text="${#temporals.format(events.actualEventStartingDate,'MMM dd, yyyy')}"></td>
                                    <td th:text="${#temporals.format(events.actualEventEndingDate,'MMM dd, yyyy')}"></td>
                                    <td th:text="${#temporals.format(events.eventAccRegistrationStartingDate,'MMM dd, yyyy')}"></td>
                                    <td th:text="${#temporals.format(events.eventAccRegistrationEndingDate,'MMM dd, yyyy')}"></td>
                                    <td class="text-center" th:text="${events.currentlyActive}"></td>
                                    <td class="text-end currency" th:text="${events.creditLimit}"></td>
                                    <td class="text-center">
                                        <div class="d-flex justify-content-center">
                                            <button type="button" class="btn btn-outline-primary btn-sm me-2"
                                                    data-bs-toggle="tooltip" th:data-event-id="${events.id}"
                                                    onclick="editShowEventMaster(this);" th:data-bs-title="#{message.label.edit}">
                                                <i class="fa-solid fa-pencil"></i>
                                            </button>
                                            <button type="button" class="btn btn-outline-danger btn-sm"
                                                    data-bs-toggle="tooltip" th:id="${'deleteEvent_'+events.id}"
                                                    onclick="deleteShowEventMaster(this);"
                                                    th:data-event-id="${events.id}" th:data-bs-title="#{message.label.delete}">
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
                                    <td colspan="11" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </form>
                    <div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modal-->
<div th:id="modalDiv"></div>
<!-- //Modal-->

<!-- Delete Modal-->
<th:block th:replace="~{common/modal/delete-modal ::
   contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}">
</th:block>
<!-- //Delete Modal-->


<!-- Footer-->
<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
    <script th:src="@{/assets/js/hostel/show-event-master.js}"></script>
    <script th:inline="javascript">
        const baseURL = /*[[#{url.hostel.event.master}]]*/ '';
        const getURL = /*[[#{url.get}]]*/ '';
        const deleteURL = /*[[#{url.delete}]]*/ '';
    </script>
</th:block>
<!-- //Footer-->
</body>
</html>
