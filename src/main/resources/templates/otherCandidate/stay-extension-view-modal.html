<!-- Form Module -->
<div
        th:replace="~{common/modal-template :: modal('stayExtensionRequestViewModal', ~{::modalHeader}, ~{::modalBody}, null, null, null, null, 'lg')}">
    <modalHeader>
        <span th:text="#{message.label.stay.extension.request.details}"></span>
    </modalHeader>
    <modalBody>
        <form class="themeForm">
            <div class="row">
                <div class="col-lg-6">
                    <div class="row">
                        <div class="col-lg-12">
                            <h2 class="tmsub-title" th:text="#{message.label.selected.appointment.period}"></h2>
                        </div>
                        <div class="col-lg-6 mb-3">
                            <label class="form-label" for="periodFromDate">
                                <span th:text="#{message.label.from.date}"></span>
                                
                            </label>
                            <div type="date" id = "periodFromDate" class="form-control form-graybox"
                            	th:text="${stayExtensionDetails.candidateAppointmentRequestDto.appointmentFrom}"></div>
                        </div>
                        <div class="col-lg-6 mb-3">
                            <label class="form-label" for="periodToDate">
                                <span th:text="#{message.label.to.date}"></span>
                                
                            </label>
                            <div class="form-control form-graybox" id = "periodToDate"
                            	th:text="${stayExtensionDetails.candidateAppointmentRequestDto.appointmentTo}"></div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="row">
                        <div class="col-lg-12">
                            <h2 class="tmsub-title" th:text="#{message.label.previously.approved.stay.period }"></h2>
                        </div>
                        <div class="col-lg-6 mb-3">
                            <label class="form-label" for="stayFrom">
                                <span th:text="#{message.label.from.date}"></span>
                                
                            </label>
                            <div class="form-control form-graybox" id = "stayFrom"
                            	th:text="${stayExtensionDetails.candidateAppointmentRequestDto.stayFrom}"></div>
                        </div>
                        <div class="col-lg-6 mb-3">
                            <label class="form-label" for="stayTo">
                                <span th:text="#{message.label.to.date}"></span>
                                
                            </label>
                            <div class="form-control form-graybox" id="stayTo"
                            	th:text="${stayExtensionDetails.candidateAppointmentRequestDto.stayTo}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-lg-12">
                    <h2 class="tmsub-title"
                        th:text="#{message.label.other.details}"></h2>
                </div>

                <!--<div class="col-lg-4 mb-3">
                    <label class="form-label" for="stipendFellowshipPay">
                        <span th:text="#{message.label.stipend}"></span>
                        
                    </label>
                    <div class="form-control form-graybox" id="stipendFellowshipPay"
                    	th:text="${stayExtensionDetails.candidateAppointmentRequestDto.grossPay}"></div>
                </div>-->

                <div class="col-lg-4 mb-3">
                    <label class="form-label">
                        <span th:text="#{message.label.category}"></span>
                    </label>
                    <div class="form-control form-graybox" th:text="${stayExtensionDetails.candidateAppointmentRequestDto.category}"></div>
                </div>
            </div>
            <div class="row mb-4">
                <div class="col-lg-12">
                    <h2 class="tmsub-title"
                        th:text="#{message.label.validating.authority}"></h2>
                </div>
                <div class="col-lg-6 mb-3">
                    <label class="form-label">
                        <span th:text="#{message.label.authority.name}"></span>
                        
                    </label>
                    <div type="text" class="form-control form-graybox" th:text="${stayExtensionDetails.candidateAppointmentRequestDto.validatingAuthority}"></div>
                </div>
                <div class="col-lg-6 mb-3">
                    <label class="form-label">
                        <span th:text="#{message.label.authority.email}"></span>
                        
                    </label>
                    <div type="text" class="form-control form-graybox" th:text="${stayExtensionDetails.candidateAppointmentRequestDto.validatingAuthorityEmail}"></div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-lg-12">
                    <h2 class="tmsub-title" th:text="#{message.label.stay.request.details}"></h2>
                </div>
                <div class="col-lg-3 mb-3">
                    <label class="form-label" for="requestFromDate">
                        <span th:text="#{message.label.from.date}"></span>
                        
                    </label>
                    <div id = "requestFromDate" class="form-control form-graybox"
                    	th:text="${stayExtensionDetails.stayExtensionRequestDto.stayFrom}"></div>
                </div>
                <div class="col-lg-3 mb-3">
                    <label class="form-label" for="requestToDate">
                        <span th:text="#{message.label.to.date}"></span>
                        
                    </label>
                    <div id = "requestToDate" class="form-control form-graybox"
                    	th:text="${stayExtensionDetails.stayExtensionRequestDto.stayTo}"></div>
                </div>
                <div class="col-lg-6 mb-3">
                    <label class="form-label" for="currentHostel">
                        <span th:text="#{message.label.current.hostel}"></span>
                        
                    </label>
                    <div id = "currentHostel" class="form-control form-graybox"
                    	th:text="${stayExtensionDetails.stayExtensionRequestDto.hostelName}"></div>
                </div>

                <div class="col-lg-3 mb-3">
                    <label class="form-label" for="roomNo">
                        <span th:text="#{message.label.room.no}"></span>
                        
                    </label>
                    <div id = "roomNo" class="form-control form-graybox"
                    	th:text="${stayExtensionDetails.stayExtensionRequestDto.roomNo}"></div>
                </div>

                <div class="col-lg-6 mb-3">
                    <label class="form-label" for="description">
                        <span th:text="#{message.label.description}"></span>
                        
                    </label>
                    <div class="form-control form-graybox" id="description" 
                    	th:text="${stayExtensionDetails.stayExtensionRequestDto.description}"></div>
                </div>
            </div>

             <th:block th:include="common/template/file-upload-template :: contents(${stayExtensionDetails.candidateFilesInformationDto})"></th:block>
            <div class="row">
                <div class="col-lg-12">
                    <h2 class="tmsub-title">
                        <span th:text="#{message.label.current.stay.approval.staus}"></span>
                    </h2>
                </div>
            </div>

            <div>
                <div class="table-responsive themeTable">
                    <table class="table table-bordered nowrap w-100">
                        <thead>
                        <tr>
                            <th th:text="#{message.label.approver.name}"></th>
                            <th th:text="#{message.label.approver.email}"></th>
                            <th th:text="#{message.label.approval.status}"></th>
                        </tr>
                        </thead>
                        <tbody>
                        	<tr th:if="*{workFlowDetails ne null and !workFlowDetails.isEmpty()}"
				            	th:each="workflow : *{workFlowDetails}">
				              <td th:text="${workflow.validatorName}"></td>
				              <td th:text="${workflow.validatorEmail}"></td>
				              <td>
				                <th:block th:include="common/template/approval-status-badge ::
				                	statusBadge(${workflow.approvalStatus},null)"></th:block>
				              </td>
				            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </form>
    </modalBody>
</div>
