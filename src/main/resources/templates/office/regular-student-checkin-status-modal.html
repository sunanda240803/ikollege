   modal('regular-student-status-modal', ~{::modalHeader}, ~{::modalBody}, null, null, null, null, 'lg')}">

    <modalBody>
        <form class="themeForm" id="regularStudentStatusId" th:action="@{#{url.office.regular.student.check.in}+#{url.status}}"

				<input type="hidden" th:name="data" th:value="${data}" th:id="data" />
            </div>
        </form>
    </modalBody>
</div>
