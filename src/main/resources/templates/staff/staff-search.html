<!DOCTYPE html>
<html lang="en">
<head th:replace="~{common/head :: common_header(~{::link})} ">
	<!--If you want to specify custom styling, create its own css page and link it here.-->
</head>

<body>
	<header th:replace="~{common/header:: title(${headerForm})}"></header>
	<!-- //Main-->
	<main id="main" class="main">
		<div class="row">
			<div class="col-lg-12">
				<div class="card main-card mt-4">
					<div class="card-body themeForm">
						<form action="#" method="get">
	                        <div class="row mb-3">
		        				<div class="col-auto">
		        					<label for="search" class="form-label"><span th:text="#{message.label.keyword}"></span>
		        						<i class="fas fa-info-circle text-secondary" data-bs-toggle="tooltip"  
		        							data-bs-title="Use Staff Name, Staff ID, Desigation Name, User Name and Email ID to search"></i>
		        					</label>
	                            	<input type="text" class="form-control" name="search" id="search"
	                                   th:field="${form.search}">
	                             </div>
	                             <div class="col-auto mt-3">
	                            	<button class="btn btn-secondary mt-4" type="submit">
	                            		<span th:text="#{message.label.search}"></span>
	                            	</button>
	                            </div>
	                        </div>
                   		</form>
						<div class="mb-4">
							<div class="table-responsive themeTable">
								<table id="StaffSearchDataTable" class="table table-bordered nowrap w-100">
									<thead>
										<tr>
                                            <th><span th:text="#{message.label.staff.id}"></span></th>
											<th><span th:text="#{message.label.staff.name}"></span></th>
<!-- 											<th><span th:text="#{message.label.designation.name}"></span></th> -->
                                            <th><span th:text="#{message.label.role}"></span></th>
											<th><span th:text="#{message.label.email.id}"></span></th>
											<th class="text-center"><span th:text="#{message.label.mobile.number}"></span></th>
											<th><span th:text="#{message.label.username}"></span></th>
											<th class="text-center"><span th:text="#{message.label.action}"></span></th>
										</tr>
									</thead>
									<tbody>
										<tr th:if="${form.paginationList != null && form.paginationList.getContent() != null}" 
											th:each="staff, iter: ${form.paginationList.getContent()}">
										    <td th:text="${staff.facultyId}"></td>
											<td th:text="${staff.firstName}"></td>
<!-- 											<td th:text="${staff.designation}"></td> -->
                                            <td th:text="${staff.roleName}"></td>
											<td th:text="${staff.emailAddress}"></td>
											<td class="text-center" th:text="${staff.contactNumber}"></td>
											<td th:text="${staff.userName}"></td>
											<td class="text-center">
												<div class="d-flex justify-content-center">
													<button type="button" class="btn btn-outline-primary btn-sm me-2"
														data-bs-toggle="tooltip" th:data-staff-id="${staff.facultyId}"
														onclick="editFacultyDetails(this);" data-bs-title="Edit">
														<i class="fa-solid fa-pencil"></i>
													</button>
													<button type="button" class="btn btn-outline-danger btn-sm"
														data-bs-toggle="tooltip" th:id="${'deleteStaff_'+staff.facultyId}"
														onclick="deleteStaff(this)"
														th:data-staff-id="${staff.facultyId}" data-bs-title="Delete">
														<i class="fa-solid fa-trash-can"></i>
													</button>
													<button type="button" class="btn btn-outline-orange btn-sm ms-2"
															data-bs-toggle="tooltip" th:id="${'view_staff_creds_'+staff.facultyId}"
															onclick="viewStaffCred(this)"
															th:data-staff-id="${staff.facultyId}" data-bs-title="Reset Password">
														<i class="fa-solid fa-key" data-bs-toggle="tooltip"></i>
													</button>
												</div>
											</td>
										</tr>
										<tr th:if="${form.paginationList  == null || form.paginationList.getContent().size() eq 0}">
											<td colspan="7" class="text-center"><span th:text="#{message.label.no.data.available}"></span></td>
										</tr>
									</tbody>
								</table>
							</div>
							<div th:replace="~{common/template/pagination :: pagination(${form})}"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:id="modalDiv"></div>
	<div th:id="resetPasswordModalDiv"></div>

	<th:block th:replace="~{common/modal/delete-modal :: contents(headerText=#{message.label.confirmation},bodyText=#{message.label.delete.row})}"></th:block>
	<th:block th:replace="~{common/modal/info-modal ::	contents(id='resetPassword',headerText=#{message.label.confirmation},bodyText=#{message.label.status.reset.password})}"></th:block>
	<th:block th:replace="~{common/modal/success-modal :: contents(headerText=#{message.label.confirmation}, bodyText=#{message.label.reset.password.success})}"></th:block>
	<!-- Footer-->
	<th:block th:replace="~{common/footer :: scripts(~{::script}, ${footerForm})}">
		<script th:src="@{/assets/js/staff/staff-search.js}"></script>
			
		<script th:inline="javascript">
			const baseURL = /*[[#{url.staff.search}]]*/ '';
			const targetURL = /*[[#{url.staff.details}]]*/ '';
			const getResetPasswordURL = /*[[#{url.reset.password}]]*/ '';
		</script>
	</th:block>
	<!-- Footer-->
</body>

</html>
